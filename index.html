r words, is hidden far more than it reveals"], "a": 0, "e": "Câu kết đoạn 1 chốt ý 'someone, somewhere, pays for it': giá thấp che giấu chi phí thật → 'A low price tag, in other words, hides far more than it reveals'."}, {"s": "", "o": ["that allows retailers to introduce new collections", "what allows retailers to introduce new collections", "allowing retailers introducing new collections", "which allows retailers to introduce new collections"], "a": 3, "e": "Chỗ trống cần mệnh đề quan hệ không xác định bổ nghĩa cho cả mệnh đề trước: '..., which allows retailers to introduce new collections every few weeks'."}, {"s": "", "o": ["Indeed, sustainability in practice is shown as the refusal of recycling itself", "However, the truth is that genuine sustainability begins long before recycling", "True sustainability itself, in truth, is recycled to begin before being genuine", "Genuine recyclers are, therefore, the beginning of true sustainability itself"], "a": 1, "e": "Câu sau 'It lies in garments built to last...' cần chủ ngữ số ít ở câu trước: 'genuine sustainability'. B nối mạch đối lập ('However') với việc vứt quần áo."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Many people believe that talent alone decides who succeeds. On meeting a champion athlete, @1. In reality, however, behind most champions are years of unseen, repetitive practice. A student who studies for thirty minutes every day @2. @3.\n\nWe tend to credit talent for results @4. We seldom see the hours of failure, so we rely on the final performance to judge ability. Hence, we should be careful @5.", "qs": [{"s": "", "o": ["we might assume that the athlete must have been born gifted", "the athlete might assume that we must have been born gifted", "born gifted might be assumed to be the athlete", "gifted birth might make the athlete assumed by us"], "a": 0, "e": "Cụm giới từ 'On meeting a champion athlete' (Khi gặp một VĐV vô địch) cần chủ ngữ của mệnh đề chính là 'we' (chúng ta có thể cho rằng VĐV đó bẩm sinh đã có tài)."}, {"s": "", "o": ["will usually outperform one who studies for hours only before exams", "usually outperforming one who studies for hours only before exams", "is usually outperformed one who studies for hours only before exams", "has usually outperform one who studies for hours only before exams"], "a": 0, "e": "Chủ ngữ 'A student who studies for thirty minutes every day' chưa có động từ chính → cần vị ngữ chia thì 'will usually outperform...'."}, {"s": "", "o": ["Consistency, therefore, proves more valuable than occasional bursts of effort", "Occasional bursts of effort, similarly, prove more valuable than consistency", "However, consistency proves to be less valuable than occasional bursts of effort", "Besides, bursts of occasional effort prove being consistent"], "a": 0, "e": "Tổng kết ý câu trước: học đều đặn 30 phút mỗi ngày tốt hơn học dồn trước kỳ thi → Sự kiên trì có giá trị hơn những đợt nỗ lực nhất thời."}, {"s": "", "o": ["unless the effort behind them is hardly ever seen", "because the effort behind them is hardly ever seen", "as though the effort behind them hardly ever seen", "so that the effort behind them is hardly ever seen"], "a": 1, "e": "Mệnh đề chỉ nguyên nhân với 'because': chúng ta hay quy kết quả cho tài năng vì nỗ lực phía sau hiếm khi được nhìn thấy."}, {"s": "", "o": ["for ignoring the role of persistent practice in success", "not to ignore the role of persistent practice in success", "ignoring the role of persistent practice in success to be", "to be ignored the role of persistent practice in success"], "a": 1, "e": "Cấu trúc be careful (not) to V: cẩn thận để không xem nhẹ vai trò của việc rèn luyện bền bỉ."}]}]}, {"lv": 1, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Walking down a tree-lined avenue on a hot July afternoon feels noticeably cooler than crossing an open car park. Street trees, @1, act as natural parasols for pavements and buildings. Through a process called transpiration, leaves release moisture into the air, @2.\n\nYet many newly planted saplings in cities fail to survive their first three summers. Surrounded by concrete pavements, @3. Compacted soil also prevents rainwater from reaching the roots and leaves little room for growth. @4.\n\nWhen residents help water young trees outside their homes during dry spells, survival rates climb sharply. In the long run, a healthy urban canopy is not merely a decoration; it is living infrastructure @5.", "qs": [{"s": "", "o": ["their branches spreading wide over the asphalt", "which branches spread wide over the asphalt", "whose branches spread wide over the asphalt", "that branches spread wide over the asphalt"], "a": 2, "e": "Mệnh đề quan hệ sở hữu 'whose branches spread wide...' bổ nghĩa cho 'Street trees'."}, {"s": "", "o": ["that lowers the surrounding temperature by several degrees", "which lowers the surrounding temperature by several degrees", "what lowers the surrounding temperature by several degrees", "lowered the surrounding temperature by several degrees"], "a": 1, "e": "Sau dấu phẩy dùng 'which' thay cho toàn bộ mệnh đề đứng trước (việc lá cây thoát hơi nước giúp giảm nhiệt độ xung quanh)."}, {"s": "", "o": ["their roots often struggle to find enough oxygen and water", "oxygen and water often struggle to find their roots", "finding enough oxygen and water is struggled by their roots", "people often struggle to find enough oxygen and water"], "a": 0, "e": "Cụm phân từ 'Surrounded by concrete pavements' bổ nghĩa cho chủ ngữ 'their roots' (rễ cây bị bao quanh bởi mặt đường bê tông)."}, {"s": "", "o": ["In contrast, concrete pavements help young saplings grow much faster", "Planting a tree, however, requires no further care once the hole is dug", "Therefore, cities should stop planting trees along busy streets altogether", "Planting a tree is therefore only the first step in a much longer commitment"], "a": 3, "e": "Nối logic với ý cây non dễ chết nếu thiếu đất và nước → Trồng cây mới chỉ là bước đầu của một cam kết chăm sóc lâu dài."}, {"s": "", "o": ["protected public health and making neighbourhoods livable", "what protects public health and makes neighbourhoods livable", "that protects public health and makes neighbourhoods livable", "whose protects public health and makes neighbourhoods livable"], "a": 2, "e": "Mệnh đề quan hệ xác định 'that protects... and makes...' bổ nghĩa cho danh từ 'living infrastructure'."}]}]}, {"lv": 1, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "When e-books and search engines first became widespread, many commentators predicted the end of public libraries. It seemed unnecessary @1 when millions of articles could be read on a phone screen. Two decades later, however, libraries are busier than ever.\n\nModern libraries have evolved into community learning hubs @2. Alongside quiet reading rooms, they offer free high-speed internet, digital workshops for seniors and storytelling corners for young children. @3. In a city where almost every indoor seat requires buying a coffee or a ticket, the library remains open to all without charge.\n\nMoreover, librarians do far more than stamp return dates on paper slips. Trained in information literacy, @4, helping students distinguish reliable sources from online rumours. That human guidance is the main reason @5.", "qs": [{"s": "", "o": ["for maintaining large buildings full of printed books", "maintaining large buildings full of printed books for us", "that large buildings full of printed books be maintaining", "to maintain large buildings full of printed books"], "a": 3, "e": "Cấu trúc giả chủ ngữ: It seemed + adj + to V ('It seemed unnecessary to maintain...')."}, {"s": "", "o": ["whose people of all ages gather to study and connect", "which people of all ages gather to study and connect", "where people of all ages gather to study and connect", "what people of all ages gather to study and connect"], "a": 2, "e": "Trạng từ quan hệ 'where' thay cho 'community learning hubs' (nơi mọi lứa tuổi tụ họp học tập và kết nối)."}, {"s": "", "o": ["Conversely, visitors must pay a high fee before entering these rooms", "Equally important is their role as one of the last free public spaces", "Digital workshops, therefore, have completely replaced printed books", "As a result, fewer students visit the library during exam seasons"], "a": 1, "e": "Khớp trực tiếp với câu liền sau ('In a city where almost every indoor seat requires buying a coffee... the library remains open to all without charge')."}, {"s": "", "o": ["they act as navigators in an ocean of digital data", "an ocean of digital data acts as navigators for them", "navigating an ocean of digital data is acted by them", "digital data is trained to navigate librarians"], "a": 0, "e": "Cụm phân từ 'Trained in information literacy' cần chủ ngữ chỉ người là 'they' (= librarians)."}, {"s": "", "o": ["what algorithms alone can never replace a good neighbourhood library", "which algorithms alone can never replace a good neighbourhood library", "because algorithms alone can never replace a good neighbourhood library", "why algorithms alone can never replace a good neighbourhood library"], "a": 3, "e": "Cấu trúc 'the main reason why + S + V' (lý do chính tại sao thuật toán không thể thay thế thư viện)."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "A generation ago, a broken radio or sewing machine was taken to a local repair shop rather than thrown into the bin. Today, many household gadgets are glued shut, making it nearly impossible @1. Often, a replacement part costs almost as much as a brand-new appliance.\n\nThis throwaway design has created mountains of electronic waste, @2. Gold, copper and rare earth metals inside discarded phones are lost when devices are dumped or burned. @3.\n\nIn response, several countries have introduced 'Right to Repair' laws, @4. Manufacturers must now supply spare parts and clear repair manuals for up to ten years. When consumers choose products @5, they send a clear message that durability matters.", "qs": [{"s": "", "o": ["for owners to replace a worn battery or a faulty switch", "that owners replacing a worn battery or a faulty switch", "to owners for replacing a worn battery or a faulty switch", "owners to replace a worn battery or a faulty switch"], "a": 0, "e": "Cấu trúc make it + adj + for sb + to V: 'making it nearly impossible for owners to replace...'."}, {"s": "", "o": ["whose is now the fastest-growing waste stream in the world", "that is now the fastest-growing waste stream in the world", "what is now the fastest-growing waste stream in the world", "which is now the fastest-growing waste stream in the world"], "a": 3, "e": "Mệnh đề quan hệ không xác định sau dấu phẩy dùng 'which' bổ nghĩa cho 'electronic waste'."}, {"s": "", "o": ["Consumers, by contrast, prefer appliances that break down after a single year", "Consequently, electronic waste has become completely harmless to the natural environment", "At the same time, toxic substances from old batteries can leak into soil and groundwater", "Rare earth metals, therefore, are no longer needed in modern smartphones"], "a": 2, "e": "Bổ sung tác hại thứ hai của rác thải điện tử bên cạnh việc lãng phí kim loại quý ở câu trước."}, {"s": "", "o": ["required companies to make their appliances easier to fix", "requiring companies to make their appliances easier to fix", "which are required companies to make their appliances easier to fix", "to require companies making their appliances easier to fix"], "a": 1, "e": "Rút gọn mệnh đề quan hệ chủ động bằng V-ing: 'requiring companies to make...' (= which require companies...)."}, {"s": "", "o": ["that are designed to be repaired rather than discarded", "what are designed to be repaired rather than discarded", "designing to be repaired rather than discarded", "whom are designed to be repaired rather than discarded"], "a": 0, "e": "Mệnh đề quan hệ 'that are designed to be repaired...' bổ nghĩa cho 'products'."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Many teenagers find it hard to fall asleep before 11 p.m., even when they feel tired after a long school day. Biologists explain that during adolescence, the body's internal clock shifts forward by about two hours, @1. Waking a teenager at 6 a.m. is biologically similar to waking an adult at 4 a.m.\n\nWhen early school bells force students to cut their sleep short, @2. Sleep-deprived brains struggle to sustain attention in morning lessons and forget new vocabulary much faster. @3.\n\nSeveral high schools that delayed their first class from 7:30 to 8:30 a.m. reported striking improvements. Not only did attendance and grades rise, @4. Helping students succeed, therefore, depends not only on what happens in the classroom @5.", "qs": [{"s": "", "o": ["that delays the release of the sleep hormone melatonin", "which delays the release of the sleep hormone melatonin", "delayed the release of the sleep hormone melatonin", "what delays the release of the sleep hormone melatonin"], "a": 1, "e": "Mệnh đề quan hệ 'which delays...' bổ nghĩa cho cả mệnh đề phía trước sau dấu phẩy."}, {"s": "", "o": ["both academic performance and emotional well-being suffer", "students immediately gain higher energy and sharper memory", "suffering both academic performance and emotional well-being", "their internal clock shifts back to childhood patterns at once"], "a": 0, "e": "Sau mệnh đề trạng ngữ 'When early school bells...' cần mệnh đề chính có S + V hoàn chỉnh hợp nghĩa với các câu sau."}, {"s": "", "o": ["Drinking coffee late at night is the best way to reset the body clock", "As a result, teenagers need far less sleep than primary school children", "Morning lessons, however, require no concentration from students", "Mood swings and irritability also become more frequent after several short nights"], "a": 3, "e": "Câu trước nói về học tập ('attention', 'vocabulary'), câu này bổ sung khía cạnh cảm xúc ('emotional well-being' → 'Mood swings and irritability')."}, {"s": "", "o": ["so students also reported feeling less anxious and more alert", "and students also reported feeling less anxious and more alert", "but students also reported feeling less anxious and more alert", "or students also reported feeling less anxious and more alert"], "a": 2, "e": "Cấu trúc đảo ngữ tương quan: Not only + trợ động từ + S + V, but S + also + V."}, {"s": "", "o": ["as well as how well they rest the night before", "but also on how well they rest the night before", "and on how well do they rest the night before", "but also how well do they rest the night before"], "a": 1, "e": "Cấu trúc song hành 'depends not only on + N/mệnh đề danh từ + but also on + mệnh đề danh từ'."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "In many densely populated neighbourhoods, vacant lots between buildings often collect litter and weeds. Yet when local residents are given permission @1, these neglected corners can blossom into vibrant community gardens. Within a few months, rows of tomatoes, herbs and morning glory replace broken bricks.\n\nFor apartment dwellers who have no balcony or backyard, a shared plot offers rare contact with soil and seasons. Older residents pass down traditional planting tips to children @2. @3.\n\nBeyond fresh vegetables, the greatest harvest of a community garden is social trust. Neighbours who used to pass each other in silence in the lift @4. By tending a small piece of land together, citizens cultivate a stronger sense of belonging @5.", "qs": [{"s": "", "o": ["that they clear the rubbish and enrich the soil with compost", "clearing the rubbish and enriching the soil with compost", "to clear the rubbish and enrich the soil with compost", "for clearing the rubbish and enrich the soil with compost"], "a": 2, "e": "Cấu trúc give sb permission to V / be given permission to V (được phép làm gì)."}, {"s": "", "o": ["which might otherwise think vegetables come only from supermarket shelves", "who might otherwise think vegetables come only from supermarket shelves", "whom might otherwise think vegetables come only from supermarket shelves", "whose might otherwise think vegetables come only from supermarket shelves"], "a": 1, "e": "Đại từ quan hệ 'who' làm chủ ngữ cho động từ 'might think', bổ nghĩa cho 'children'."}, {"s": "", "o": ["Working outdoors for an hour after work also relieves stress and lowers blood pressure", "Supermarkets, therefore, have stopped selling fresh vegetables in big cities", "However, children are forbidden from entering the garden on weekends", "Apartment dwellers consequently prefer concrete car parks to green spaces"], "a": 0, "e": "Bổ sung lợi ích sức khỏe của việc làm vườn đối với cư dân thành thị."}, {"s": "", "o": ["to stop chatting about rainfall, seedlings and family recipes", "stopping to chat about rainfall, seedlings and family recipes", "who now stop to chat about rainfall, seedlings and family recipes", "now stop to chat about rainfall, seedlings and family recipes"], "a": 3, "e": "Chủ ngữ 'Neighbours' đã có mệnh đề quan hệ 'who used to pass...' nên chỗ trống cần động từ chính của câu ('now stop to chat...')."}, {"s": "", "o": ["made the whole district safer and more welcoming", "what makes the whole district safer and more welcoming", "that makes the whole district safer and more welcoming", "where makes the whole district safer and more welcoming"], "a": 2, "e": "Mệnh đề quan hệ xác định 'that makes...' bổ nghĩa cho 'a stronger sense of belonging'."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Scanning a QR code to pay for a bowl of pho or a bus ticket has become second nature in Vietnamese cities. Digital wallets allow transactions @1, sparing shopkeepers the trouble of counting small change. Even street vendors now display printed payment codes beside their baskets.\n\nYet the ease of tapping a screen carries a subtle psychological trap. When we hand over crisp paper notes, we physically see our wallet grow thinner, @2. Paying with a phone feels painless, so young shoppers often spend more on impulse buys than they realise. @3.\n\nFinancial educators therefore advise students to review their digital spending history every Sunday evening. Setting a weekly transfer limit on e-wallets is another simple habit @4. Digital payments are a wonderful servant, @5.", "qs": [{"s": "", "o": ["be completed in just a few seconds", "completing in just a few seconds", "that completed in just a few seconds", "to be completed in just a few seconds"], "a": 3, "e": "Cấu trúc allow + O + to V (ở dạng bị động vì 'transactions' được hoàn tất: 'allow transactions to be completed')."}, {"s": "", "o": ["what naturally reminds us to think twice before buying", "that naturally reminds us to think twice before buying", "which naturally reminds us to think twice before buying", "reminding naturally us to think twice before buying"], "a": 2, "e": "Sau dấu phẩy dùng 'which' thay cho cả mệnh đề trước (việc nhìn thấy ví mỏng đi nhắc chúng ta cân nhắc kỹ)."}, {"s": "", "o": ["Paper banknotes, by contrast, make people spend ten times more than digital wallets", "Small daily purchases—milk tea, snacks and game tokens—can quietly add up to a large sum", "As a result, street vendors refuse to accept QR code payments from students", "Young shoppers therefore never buy anything online without asking their banks"], "a": 1, "e": "Minh họa trực tiếp cho ý 'impulse buys' (các khoản chi nhỏ hàng ngày cộng dồn thành số tiền lớn)."}, {"s": "", "o": ["that helps keep monthly budgets under control", "what helps keep monthly budgets under control", "helped keep monthly budgets under control", "whose helps keep monthly budgets under control"], "a": 0, "e": "Mệnh đề quan hệ 'that helps...' bổ nghĩa cho 'another simple habit'."}, {"s": "", "o": ["for requiring mindful discipline from every user", "so they require no attention from any user", "unless they require mindful discipline from every user", "but they require mindful discipline from every user"], "a": 3, "e": "Mệnh đề đối lập 'but they require...' cân xứng với 'Digital payments are a wonderful servant'."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Scientific research is no longer confined to university laboratories and professional field stations. Equipped with smartphones, ordinary citizens are now helping ecologists @1. By photographing migratory birds, butterflies or wildflowers and uploading the location to a shared app, volunteers contribute to global biodiversity maps.\n\nNo single research team could afford @2. Thousands of hikers, gardeners and students, however, can observe wildlife across an entire continent on the same morning. @3.\n\nTo ensure data quality, entries are reviewed by AI filters and specialist moderators before being added to official archives. Participating in citizen science not only accelerates environmental discovery @4. People who learn to name the birds and trees in their neighbourhood @5.", "qs": [{"s": "", "o": ["track changes in nature on a scale never seen before", "tracking changes in nature on a scale never seen before", "that track changes in nature on a scale never seen before", "tracked changes in nature on a scale never seen before"], "a": 0, "e": "Cấu trúc help + O + V / to V: 'helping ecologists track changes...'."}, {"s": "", "o": ["for stationing observers in every forest, park and coastline", "stationing observers in every forest, park and coastline at once", "that observers be stationed in every forest, park and coastline", "to station observers in every forest, park and coastline at once"], "a": 3, "e": "Cấu trúc afford + to V (có đủ nguồn lực để làm gì)."}, {"s": "", "o": ["Migratory birds, consequently, have stopped flying across continents in spring", "Professional scientists therefore reject all photographs taken by smartphone users", "In several cases, amateur naturalists have even rediscovered species thought to be extinct", "However, smartphones cannot take photographs of wildflowers outdoors"], "a": 2, "e": "Nêu thành tựu nổi bật của mạng lưới tình nguyện viên quan sát thiên nhiên."}, {"s": "", "o": ["and also deepens public care for the natural world", "but also deepens public care for the natural world", "or deepens public care for the natural world as well", "so it deepens public care for the natural world"], "a": 1, "e": "Cấu trúc tương quan 'not only + V1 + but also + V2' ('not only accelerates... but also deepens...')."}, {"s": "", "o": ["are far more likely to protect those habitats in the future", "being far more likely to protect those habitats in the future", "who are far more likely to protect those habitats in the future", "to be far more likely to protect those habitats in the future"], "a": 0, "e": "Chủ ngữ 'People' đã có mệnh đề quan hệ 'who learn...' nên chỗ trống cần động từ chính 'are far more likely...'."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Every ancient bronze drum or stone statue carries the memory of the community that crafted it. When historical artefacts are preserved in local museums near their place of origin, young people can see @1. Touching the living context of heritage inspires pride and historical curiosity.\n\nIn recent years, 3D laser scanning has opened a new chapter in cultural preservation. Fragile manuscripts and temple carvings, @2, can now be digitised in microscopic detail. @3.\n\nDigital models also serve as an insurance policy against fire, floods and time. Should a historic wooden communal house suffer storm damage, craftsmen can consult the 3D blueprints @4. Technology, when guided by respect for tradition, ensures @5.", "qs": [{"s": "", "o": ["what did their ancestors live, work and celebrate", "how their ancestors lived, worked and celebrated", "how did their ancestors live, work and celebrate", "their ancestors lived, worked and celebrated how"], "a": 1, "e": "Mệnh đề danh từ làm tân ngữ cho động từ 'see' dùng trật tự trần thuật: 'how + S + V'."}, {"s": "", "o": ["which would be damaged by frequent handling or bright light", "that would be damaged by frequent handling or bright light", "whose would be damaged by frequent handling or bright light", "what would be damaged by frequent handling or bright light"], "a": 0, "e": "Mệnh đề quan hệ không xác định giữa hai dấu phẩy dùng 'which' bổ nghĩa cho 'Fragile manuscripts and temple carvings'."}, {"s": "", "o": ["Consequently, historians no longer study ancient manuscripts or temple carvings", "As a result, museums have destroyed all original stone statues and bronze drums", "Laser scanners, however, can only photograph modern plastic objects", "Students in remote provinces can then examine these treasures on screen from every angle"], "a": 3, "e": "Phát triển lợi ích của việc số hóa 3D: học sinh ở xa vẫn có thể quan sát hiện vật từ mọi góc độ."}, {"s": "", "o": ["restored every carved beam with complete accuracy", "for restore every carved beam with complete accuracy", "to restore every carved beam with complete accuracy", "so as restoring every carved beam with complete accuracy"], "a": 2, "e": "Cụm động từ nguyên mẫu chỉ mục đích 'to restore...' (để phục dựng chính xác từng xà gỗ chạm khắc)."}, {"s": "", "o": ["what cultural heritage is passed on intact to future generations", "that cultural heritage is passed on intact to future generations", "cultural heritage passing on intact to future generations", "whether cultural heritage passing on intact to future generations"], "a": 1, "e": "Cấu trúc ensure + that + S + V (đảm bảo rằng di sản văn hóa được truyền lại nguyên vẹn)."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "When high school students sign up for community service, they usually aim to help others. Yet employers and university admissions officers often note that rs to elderly patients"], "a": 3, "e": "Mệnh đề quan hệ 'who spends...' bổ nghĩa cho chủ ngữ 'A student'."}, {"s": "", "o": ["where a young person can make in their own future", "what a young person can make in their own future", "a young person can make in their own future", "making by a young person in their own future"], "a": 2, "e": "Mệnh đề quan hệ lược bỏ đại từ tân ngữ '(that) a young person can make in their own future' bổ nghĩa cho 'investments'."}]}]}, {"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Images of plastic bottles floating in the middle of the Pacific Ocean have shocked the public for years. Yet marine scientists point out that trying to scoop plastic out of the open sea is like @1. Once plastic fragments are scattered by ocean currents, collecting them becomes enormously expensive.\n\nRecent research shows that roughly eighty percent of river-borne ocean plastic comes from just a thousand rivers worldwide. Intercepting rubbish at river mouths, @2, is therefore far more effective. Solar-powered barges anchored near city bridges use floating barriers @3.\n\nEven the cleverest river traps, however, cannot solve the crisis on their own. @4. Only when manufacturers redesign packaging and citizens cut single-use plastics @5.", "qs": [{"s": "", "o": ["mopped a flooded kitchen floor while the tap is still running", "mop a flooded kitchen floor while the tap is still running", "to mop a flooded kitchen floor while the tap is still running", "mopping a flooded kitchen floor while the tap is still running"], "a": 3, "e": "Sau giới từ 'like' (giống như) cần danh động từ V-ing ('mopping a flooded kitchen floor...')."}, {"s": "", "o": ["unless it stays in the middle of the Pacific", "after it has already sunk to the ocean floor", "before it ever reaches the open sea", "which it never reaches the open sea"], "a": 2, "e": "Mệnh đề trạng ngữ chỉ thời gian 'before it ever reaches the open sea' giải thích tại sao chặn rác ở cửa sông lại h rom transport drop sharply. Travel becomes richer when we stop trying to see everything @5.", "qs": [{"s": "", "o": ["they often experience destinations through a glass window", "destinations often experience them through a glass window", "a glass window often experiences them on tour buses", "experiencing destinations through a glass window is often"], "a": 0, "e": "Cụm phân từ 'Rushing from airport to tour bus' bổ nghĩa cho chủ ngữ chỉ người 'they' (= holidaymakers)."}, {"s": "", "o": ["so that staying long enough to understand its daily life", "staying long enough for understanding its daily life", "which stay long enough to understand its daily life", "and stay long enough to understand its daily life"], "a": 3, "e": "Cấu trúc song hành động từ: 'slow travellers choose... and stay...'."}, {"s": "", "o": ["Taking local trains, however, produces ten times more carbon than flying", "Consequently, slow travellers never leave their hotel rooms during the entire holiday", "Unplanned conversations with bakers or artisans often become the highlight of the journey", "They therefore try to visit at least five different countries every afternoon"], "a": 2, "e": "Phát triển cụ thể trải nghiệm đi chợ sáng và học tiếng địa phương ở câu trước."}, {"s": "", "o": ["supporting local livelihoods directly rather than leaking to distant chains", "supports local livelihoods directly rather than leaking to distant chains", "which supports local livelihoods directly rather than distant chains", "to support local livelihoods directly rather than distant chains"], "a": 1, "e": "Chủ ngữ 'Money spent at family-run guesthouses and craft stalls' (số ít) cần động từ chính chia thì hiện tại đơn 'supports'."}, {"s": "", "o": ["and start paying attention to where we actually are", "and starting to pay attention to where are we actually", "to start paying attention to where are we actually", "or start paying attention to what we actually are where"], "a": 0, "e": "Song hành với 'when we stop trying... and start paying attention to where we actually are'."}]}]}, {"lv": 3, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Walk down any supermarket aisle and you will see packets boldly labelled 'low fat', 'natural' or 'rich in vitamins'. Health-conscious shoppers often pick up these products immediately, @1. A glance at the fine print on the back, however, frequently reveals a surprising amount of added sugar.\n\nTo keep food tasty after removing fat, manufacturers often add refined syrups under dozens of unfamiliar names—such as maltose, dextrose or fruit juice concentrate—@2. A single bottle of flavoured yogurt drink can contain as much sugar as afizzy cola. @3.\n\nNutritionists recommend a simple rule of thumb when shopping. The shorter the ingredient list is, @4. Taking ten seconds to read the nutrition table empowers consumers @5.", "qs": [{"s": "", "o": ["assumed that the front of the box tells the whole truth", "assuming that the front of the box tells the whole truth", "who assuming that the front of the box tells the whole truth", "to assume what the front of the box tells the whole truth"], "a": 1, "e": "Mệnh đề phân từ hiện tại 'assuming that...' chỉ hành động đồng thời của chủ ngữ 'Health-conscious shoppers'."}, {"s": "", "o": ["which makes it hard for ordinary buyers to spot", "that makes it hard for ordinary buyers to spot", "what makes it hard for ordinary buyers to spot", "made it hard for ordinary buyers to spot"], "a": 0, "e": "Mệnh đề quan hệ 'which makes...' bổ nghĩa cho cả mệnh đề trước (việc dùng hàng chục tên gọi khác nhau khiến người mua khó nhận ra)."}, {"s": "", "o": ["Refined syrups are the main source of vitamins in fresh vegetables", "Flavoured yogurt drinks, therefore, contain no calories or sweeteners at all", "Manufacturers have consequently stopped printing ingredient lists on food packets", "Consuming such hidden sugars daily increases the risk of tooth decay and weight gain"], "a": 3, "e": "Nêu tác hại sức khỏe c , "e": "Đại từ quan hệ 'who' bổ nghĩa cho 'those' (những người đầu tiên trong gia đình học đại học)."}, {"s": "", "o": ["the academic system must figure out first-generation students on its own", "first-generation students must figure out the academic system on their own", "figuring out the academic system on their own is parents", "their parents have already taught them every university regulation"], "a": 1, "e": "Sau cụm giới từ 'Unlike peers...' cần chủ ngữ tương ứng là 'first-generation students'."}, {"s": "", "o": ["Many also balance part-time jobs with lectures to support themselves in the city", "Consequently, first-generation students never attend any lectures or exams", "Professors therefore refuse to answer questions from any freshman", "Their parents, however, attend all university classes on their behalf"], "a": 0, "e": "Bổ sung một khó khăn thực tế nữa của sinh viên thế hệ đầu (vừa học vừa làm thêm trang trải chi phí)."}, {"s": "", "o": ["professors are paired with incoming freshmen from similar backgrounds", "practical advice and reassurance can walk the same path from day one", "freshmen have already graduated from university a year earlier", "mentors can offer practical advice and reassurance from day one"], "a": 3, "e": "Cụm phân từ hoàn thành 'Having walked the same path a year or two earlier' bổ nghĩa cho chủ ngữ 'mentors' (các anh chị khóa trên)."}, {"s": "", "o": ["which makes the entire academic community richer and more inclusive", "making the entire academic community richer and more inclusive", "the entire academic community becomes richer and more inclusive", "to make the entire academic community richer and more inclusive"], "a": 2, "e": "Sau mệnh đề trạng ngữ 'When universities recognise...' cần một mệnh đề chính hoàn chỉnh S + V."}]}]}, {"lv": 3, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "For over a century, electricity flowed in only one direction: from giant power stations through long transmission lines to homes and factories. Whenever a storm knocked down a main tower, whole districts were plunged into darkness, @1. Today, rooftop solar panels and battery storage are rewriting that model.\n\nHouseholds and schools that install solar panels become 'prosumers'—both consumers and producers of clean energy. At midday, when the sun is brightest, @2. Excess electricity can be stored in neighbourhood batteries or fed back into the local grid for credits. @3.\n\nIn remote island communes and mountain villages, solar microgrids have proved especially transformative. Rather than waiting years for costly high-voltage cables to cross rough terrain, @4. Clean, decentralised power is demonstrating @5.", "qs": [{"s": "", "o": ["to leave hospitals and households depend on noisy diesel generators", "left hospitals and households dependent on noisy diesel generators", "which leaving hospitals and households dependent on noisy diesel generators", "leaving hospitals and households dependent on noisy diesel generators"], "a": 3, "e": "Cụm phân từ hiện tại 'leaving + O + adj' diễn tả hệ quả của mệnh đề đứng trước."}, {"s": "", "o": ["more power than a building needs is generating rooftop panels", "generating more power than a building needs by rooftop panels", "rooftop panels often generate more power than a building needs", "a building needs to generate more sunlight than rooftop panels"], "a": 2, "e": "Sau cụm trạng ngữ thời gian 'At midday, when the sun is brightest,' cần mệnh đề chính có S + V."}, {"s": "", "o": ["Consequently, solar panels work best at midnight during heavy rainstorms", "This reduces peak strain on the national grid during hot summer afternoons", "Homeowners must therefore pay a fine whenever the sun shines brightly", "National power grids have completely banned energy storage batteries"], "a": 1, "e": "'This' quy chiếu việc điện mặt trời dư thừa lúc trưa nắng được hòa lưới/lưu trữ, giúp giảm tải giờ cao điểm mùa hè."}, {"s": "", "o": ["communities can generate their own reliable electricity right where they live", "costly high-voltage cables can generate their own communities right there", "generating their own reliable electricity is waited by communities", "rough terrain can install rooftop solar panels on its own"], "a": 0, "e": "Sau cụm 'Rather than waiting years...' cần chủ ngữ chỉ người/cộng đồng ('communities')."}, {"s": "", "o": ["how can energy security and environmental protection go hand in hand", "what energy security and environmental protection can go hand in hand", "energy security and environmental protection going hand in hand", "that energy security and environmental protection can go hand in hand"], "a": 3, "e": "Cấu trúc demonstrate + that + S + V (chứng minh rằng an ninh năng lượng và bảo vệ môi trường có thể song hành)."}]}]}, {"lv": 3, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Once dismissed as a slow vehicle of the past, the humble bicycle is making a remarkable comeback in twenty-first-century transport planning. In congested city centres, where cars crawl from traffic light to traffic light at ten kilometres per hour, @1. It burns no fuel, emits no exhaust and takes up a fraction of the parking space required by a car.\n\nFor years, however, the main barrier to cycling was not distance or effort, @2. Sharing narrow lanes with buses and trucks intimidates all but the bravest riders. @3.\n\nWhere municipalities have built continuous networks of protected bike lanes separated by kerbs or trees, cycling numbers have surged within months. Combined with metro stations and public bike-sharing schemes, @4. Investing in safe cycling infrastructure is one of the smartest ways @5.", "qs": [{"s": "", "o": ["a bicycle is often the fastest way to travel up to five kilometres", "travelling up to five kilometres is often the fastest bicycle", "cars are therefore much faster than bicycles in every traffic jam", "which makes a bicycle the fastest way to travel up to five kilometres"], "a": 0, "e": "Sau cụm trạng ngữ chỉ nơi chốn 'In congested city centres, where...,' cần mệnh đề chính có S + V."}, {"s": "", "o": ["so that safe, separated cycling lanes were lacking", "and the lack of safe, separated cycling lanes", "or lacking safe, separated cycling lanes", "but the lack of safe, separated cycling lanes"], "a": 3, "e": "Cấu trúc tương quan 'not A, but B' ('not distance or effort, but the lack of safe, separated cycling lanes')."}, {"s": "", "o": ["As a result, every resident already cycles fifty kilometres to work daily", "Buses and trucks, therefore, are much smaller and lighter than bicycles", "Parents, understandably, hesitate to let children cycle to school on unprotected roads", "Traffic lights have been removed from all major cities to speed up cars"], "a": 2, "e": "Cụ thể hóa tâm lý e ngại an toàn khi phải đi chung làn với xe buýt và xe tải ở câu trước."}, {"s": "", "o": ["solving the 'first and last mile' gap in public transit by bicycle", "the bicycle solves the 'first and last mile' gap in public transit", "public transit is combined with metro stations by the bicycle", "the 'first and last mile' gap is ridden to metro stations"], "a": 1, "e": "Cụm phân từ quá khứ 'Combined with metro stations...' bổ nghĩa cho chủ ngữ 'the bicycle'."}, {"s": "", "o": ["for cities to cut pollution while keeping residents active", "that cities cutting pollution while keeping residents active", "for cities cutting pollution while keep residents active", "which cities cut pollution while keeping residents active"], "a": 0, "e": "Cấu trúc the smartest way (for sb) to V ('the smartest ways for cities to cut pollution...')."}]}]}, {"lv": 3, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Linguists estimate that of the roughly seven thousand languages spoken in the world today, nearly half could fall silent by the end of this century. When an unwritten language disappears, humanity loses @1. Local names for medicinal plants, seasonal weather signs and folk epics are woven into the grammar and vocabulary of each tongue.\n\nIn the past, young people in minority communities were sometimes pressured to abandon their mother tongue @2. Yet bilingual research clearly shows that children can master a national language and an international language without giving up their heritage speech. @3.\n\nAcross Vietnam's northern highlands and Central Highlands, community elders and young linguists are now working together @4. By turning traditional epic poems into illustrated bilingual storybooks and audio apps, they make ancestral voices accessible to the smartphone generation. A language survives best @5.", "qs": [{"s": "", "o": ["that centuries of ecological knowledge and unique ways of seeing", "centuries of ecological knowledge and unique ways of seeing the world", "what centuries of ecological knowledge and unique ways of seeing", "ecological knowledge for centuries and unique ways to see"], "a": 1, "e": "Động từ ngoại 'loses' cần một cụm danh từ làm tân ngữ ('centuries of ecological knowledge and unique ways...')."}, {"s": "", "o": ["in the mistaken belief that it would hold them back at school", "believing mistakenly that it will hold them back at school", "which in the mistaken belief that it would hold them back", "because the mistaken belief that it would hold them back"], "a": 0, "e": "Cụm giới từ cố định 'in the (mistaken) belief that + S + V' (với niềm tin sai lầm rằng...)."}, {"s": "", "o": ["Folk epics and medicinal plants have no connection to human language", "Children, therefore, can only remember a maximum of five hundred words in total", "Consequently, schools have banned all foreign languages from the curriculum", "In fact, strong roots in a first language often make learning additional languages easier"], "a": 3, "e": "Khẳng định thêm lợi ích của việc giữ tiếng mẹ đẻ đối với việc học các ngôn ngữ khác."}, {"s": "", "o": ["so that record folk songs, proverbs and oral histories", "recording folk songs, proverbs and oral histories for fade", "to record folk songs, proverbs and oral histories before they fade", "recorded folk songs, proverbs and oral histories before fading"], "a": 2, "e": "To-infinitive chỉ mục đích: 'working together to record...'."}, {"s": "", "o": ["which it is spoken with pride at home, at school and online", "when it is spoken with pride at home, at school and online", "spoken with pride at home, at school and online when", "despite being spoken with pride at home, at school and online"], "a": 1, "e": "Mệnh đề trạng ngữ chỉ thời gian/điều kiện 'when it is spoken with pride...'."}]}]}, {"lv": 3, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "For residents of remote mountain communes or offshore islands, seeing a specialist doctor used to mean a full day of travel to a central city hospital. Patients often delayed check-ups @1. By the time they finally made the journey, minor conditions had sometimes become serious.\n\nTelemedicine is narrowing this geographical gap. Through high-definition video links and digital stethoscopes, doctors at provincial and national hospitals can examine patients @2. Local clinic nurses measure blood pressure and upload ultrasound scans in real time, @3. @4.\n\nOf course, a screen cannot perform surgery or replace every hands-on examination. Nevertheless, by catching illnesses early and guiding local treatment, @5.", "qs": [{"s": "", "o": ["so that the trip was costly and took them away from farm work", "although the trip was free and took only five minutes", "because the trip was costly and took them away from farm work", "unless the trip was costly and took them away from farm work"], "a": 2, "e": "Mệnh đề chỉ nguyên nhân 'because...' giải thích lý do người dân vùng sâu thường trì hoãn việc đi khám."}, {"s": "", "o": ["which are sitting in a commune health station hundreds of kilometres away", "who are sitting in a commune health station hundreds of kilometres away", "whose are sitting in a commune health station hundreds of kilometres away", "sat in a commune health station hundreds of kilometres away"], "a": 1, "e": "Mệnh đề quan hệ 'who are sitting...' bổ nghĩa cho danh từ chỉ người 'patients'."}, {"s": "", "o": ["allowing specialists to give accurate diagnoses within minutes", "allowed specialists to give accurate diagnoses within minutes", "that allows specialists giving accurate diagnoses within minutes", "to allow specialists give accurate diagnoses within minutes"], "a": 0, "e": "Cụm phân từ hiện tại 'allowing + O + to V' diễn tả kết quả của hành động đo huyết áp và gửi ảnh siêu âm theo thời gian thực."}, {"s": "", "o": ["Specialists at central hospitals therefore refuse to use computers", "Consequently, commune health stations have been closed across the country", "Patients now have to travel twice as far to buy basic medicine", "Elderly patients with chronic conditions no longer need to endure exhausting bus rides for routine prescriptions"], "a": 3, "e": "Nêu lợi ích thiết thực của khám chữa bệnh từ xa đối với bệnh nhân cao tuổi mắc bệnh mạn tính."}, {"s": "", "o": ["bringing quality healthcare closer to every citizen is telemedicine", "quality healthcare brings telemedicine closer to every screen", "telemedicine brings quality healthcare closer to every citizen", "every citizen is caught early by local treatment"], "a": 2, "e": "Cụm giới từ 'by catching illnesses early and guiding local treatment' bổ nghĩa cho chủ ngữ chính 'telemedicine'."}]}]}, {"lv": 3, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Instant translation apps can now turn a photographed restaurant menu or a spoken sentence into another language in less than a second. Faced with such impressive tools, some students wonder @1. If a phone can translate for us, why spend years memorising grammar and vocabulary?\n\nThe answer lies in the difference between exchanging information and building human relationships. A translation app can help a traveller order noodles or find a train platform, @2. When two people speak directly without a screen between them, tone of voice, humour and cultural nuance create immediate warmth. @3.\n\nFurthermore, learning a foreign language reshapes how we think. Stepping inside another grammar system teaches us @4. Technology may remove the barrier to basic survival abroad, @5.", "qs": [{"s": "", "o": ["is learning a foreign language still worth the effort", "that learning a foreign language is still worth the effort", "what learning a foreign language is still worth the effort", "whether learning a foreign language is still worth the effort"], "a": 3, "e": "Sau động từ 'wonder' (tự hỏi) cần mệnh đề danh từ bắt đầu bằng 'whether' + S + V."}, {"s": "", "o": ["so that it shares a joke and senses unspoken hesitation", "and it can easily share a joke or sense unspoken hesitation", "but it cannot share a joke or sense unspoken hesitation", "unless it shares a joke or senses unspoken hesitation"], "a": 2, "e": "Mệnh đề đối lập 'but...' chỉ ra giới hạn của ứng dụng dịch thuật trong giao tiếp cảm xúc."}, {"s": "", "o": ["Travellers therefore prefer talking to machines rather than local people", "No earpiece can replicate the trust built when a guest speaks the host's own tongue", "As a result, humour and tone of voice have disappeared from human speech", "Restaurant menus are now written only in computer code"], "a": 1, "e": "Làm rõ ý ở câu trước về sự gắn kết và tin cậy khi giao tiếp trực tiếp bằng ngôn ngữ của người bản xứ."}, {"s": "", "o": ["that our own way of expressing ideas is not the only one", "what our own way of expressing ideas is not the only one", "our own way of expressing ideas not being the only one", "how is our own way of expressing ideas not the only one"], "a": 0, "e": "Cấu trúc teach sb + that + S + V (dạy chúng ta rằng cách diễn đạt của riêng mình không phải là duy nhất)."}, {"s": "", "o": ["making human language unnecessary for genuine empathy", "so human language closes the door to genuine empathy", "because only human language removes the barrier to phones", "but only human language opens the door to genuine empathy"], "a": 3, "e": "Mệnh đề đối lập 'but only human language opens...' kết bài hàm súc, đối xứng với vế trước."}]}]}], "2": [{"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Anyone who has walked through a city centre on a summer afternoon knows that it feels hotter than the countryside nearby. This is no illusion: a city of one million people can be one to three degrees Celsius warmer than its surroundings, a phenomenon known as the urban heat island effect. The main cause lies in the materials of which cities are built. Concrete and asphalt <b>soak up</b> sunlight during the day and release it slowly at night, whereas soil and plants cool the air by letting water evaporate. The heat given off by vehicles, factories and air conditioners makes matters worse.\n\nThe consequences go well beyond discomfort. Warm nights deny the body a chance to recover, so illnesses caused by heat become more common during long heatwaves, and elderly people and young children are the most vulnerable. Hotter air also pushes up the demand for electricity as households switch on air conditioners, which in turn releases more heat into the streets. In addition, high temperatures speed up the chemical reactions that create smog, making the air harder to breathe.\n\nCities have therefore started to fight back. <b>[I]</b> Planting trees is the most popular response, because leaves provide shade and release water vapour that cools the surrounding air. <b>[II]</b> Some cities also encourage owners to cover roofs with soil and plants, or to paint them white so that they reflect sunlight instead of absorbing it. <b>[III]</b> Trees need space, water and years to grow, while green roofs are expensive to install and heavy for older buildings to carry. <b>[IV]</b> Even the position of greenery matters, since a handful of trees planted in the wrong place may cool very little.\n\nThis does not mean that cooling efforts are pointless. Researchers argue that the best results come from combining several measures and choosing them to suit local conditions rather than copying another city's plan. <b>They</b> also stress that the neighbourhoods most in need of shade, which are often the poorest, are usually the last to receive it. As temperatures rise and more people move into cities, deciding where to plant the next tree may matter as much as deciding to plant it at all.\n(Adapted from National Geographic)", "qs": [{"s": "The phrase <b>soak up</b> in paragraph 1 is closest in meaning to ______.", "o": ["give off", "take in", "put out", "use up"], "a": 1, "e": "soak up = absorb = take in (hấp thụ). Concrete and asphalt soak up sunlight = Bê tông và nhựa đường hấp thụ ánh nắng."}, {"s": "According to paragraph 1, the urban heat island effect is ______.", "o": ["mainly the result of how city materials absorb and release sunlight", "mostly produced by the cooling effect of air conditioners", "an illusion caused by comparing day and night temperatures", "a problem found only in cities with over a million residents"], "a": 0, "e": "Đoạn 1: 'The main cause lies in the materials of which cities are built. Concrete and asphalt soak up sunlight...'"}, {"s": "Which of the following is NOT implied in paragraph 2?", "o": ["Air conditioning can add to the heat that cities already suffer from.", "Warm nights can make it harder for the body to recover.", "Higher temperatures encourage the formation of smog.", "People of every age are affected by heat-related illness to the same degree."], "a": 3, "e": "Đoạn 2 nói người già và trẻ nhỏ là nhóm dễ tổn thương nhất ('the most vulnerable') → không thể suy ra mọi lứa tuổi bị ảnh hưởng như nhau."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>Yet each of these remedies comes with a price of its own.</b>", "o": ["[II]", "[IV]", "[III]", "[I]"], "a": 2, "e": "'Yet' tạo tương phản với lợi ích vừa nêu (trồng cây, mái xanh/sơn trắng) và câu kế tiếp ('Trees need space, water and years to grow...') giải thích cái giá đó → vị trí [III]."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Cooling measures for cities are generally too costly to be put into practice.", "Remedies for urban heat exist, but each of them has drawbacks of its own.", "Planting trees has proved to be more effective than painting roofs white.", "City governments should oblige owners to install green roofs on their buildings."], "a": 1, "e": "Đoạn 3 nêu các biện pháp hạ nhiệt và chỉ ra mỗi biện pháp đều có hạn chế/chi phí riêng → B."}, {"s": "The word <b>They</b> in paragraph 4 refers to ______.", "o": ["researchers", "measures", "cities", "neighbourhoods"], "a": 0, "e": "'Researchers argue that ... They also stress that...' → 'They' thay cho 'researchers'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Copying the plans of other cities guarantees good results.", "The poorest neighbourhoods already enjoy the greatest amount of shade.", "Planting trees is enough to stop global warming.", "Urban cooling should be planned with both effectiveness and fairness in mind."], "a": 3, "e": "Đoạn 4 nhấn mạnh kết hợp giải pháp phù hợp địa phương (hiệu quả) và chú ý các khu dân cư nghèo thiếu bóng mát nhất (công bằng)."}, {"s": "Which of the following is true according to the passage?", "o": ["Water released by plants raises the temperature of the surrounding air.", "Painting roofs white makes them absorb more sunlight.", "The effect of planting trees depends partly on where they are placed.", "Illnesses caused by heat are rare even during long heatwaves."], "a": 2, "e": "Cuối đoạn 3: 'Even the position of greenery matters, since a handful of trees planted in the wrong place may cool very little'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Urban heat will become less serious as more people move into cities.", "A city relying on only one cooling measure is unlikely to solve its heat problem completely.", "Rural residents suffer from heat more than people living in cities.", "Air conditioning should be banned in every large city."], "a": 1, "e": "Đoạn 4: 'the best results come from combining several measures' → chỉ dựa vào 1 biện pháp khó giải quyết trọn vẹn."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Cooling Our Cities: Easy Answers, Hard Choices", "Concrete Jungles: Why Summers Will Never End", "Trees Against Roofs: Who Wins the Heat Battle?", "The Rise of Air Conditioning in Modern Cities"], "a": 0, "e": "Bài đọc nêu nguyên nhân, hậu quả của đảo nhiệt đô thị, các giải pháp và những đánh đổi cần cân nhắc → A bao quát nhất."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Cities have long treated rooftops as wasted space: flat expanses of tar and concrete that absorb heat and serve no purpose beyond keeping rain out. Yet a growing number of architects argue that this <b>overlooked</b> surface could become one of the most valuable resources in the modern city.\n\nA green roof, covered with soil and vegetation, cuts the amount of heat that enters a building in summer and keeps warmth in during winter, so owners spend noticeably less on air conditioning and heating. Plants also catch rainwater, which eases the pressure on drains during storms. In addition, rooftop gardens provide a habitat for insects and birds that would otherwise find little shelter in dense districts.\n\n<b>[I]</b> Critics point out that such roofs are costly to build. <b>[II]</b> The structure must be reinforced to carry the extra weight, and a waterproof layer must be installed to prevent leaks. <b>[III]</b> Maintenance is also a concern, since plants need regular watering and pruning. <b>[IV]</b> Supporters reply that these expenses are recovered over time through lower energy bills and a longer roof lifespan.\n\nSome cities have therefore made green roofs mandatory for large new buildings, while others merely offer tax reductions to those who install <b>them</b>. Either way, the idea is gaining ground: the question is no longer whether rooftops can be used, but how soon.", "qs": [{"s": "The word <b>overlooked</b> in paragraph 1 is closest in meaning to ______.", "o": ["noticed", "neglected", "admired", "protected"], "a": 1, "e": "overlooked = bị bỏ qua, bị xem nhẹ = neglected."}, {"s": "According to paragraph 1, cities have traditionally regarded rooftops as ______.", "o": ["places for relaxation", "unused space of little value", "sources of energy", "areas reserved for gardens"], "a": 1, "e": "Đoạn 1: 'Cities have long treated rooftops as wasted space... serve no purpose beyond keeping rain out.'"}, {"s": "According to paragraph 2, a green roof can ______.", "o": ["replace heating systems entirely", "reduce energy spending", "keep rainwater from reaching the drains completely", "attract only birds"], "a": 1, "e": "Đoạn 2: 'owners spend noticeably less on air conditioning and heating'."}, {"s": "Which of the following is NOT mentioned in paragraph 2 as a benefit?", "o": ["Lower air-conditioning costs", "Less strain on drains in storms", "Shelter for wildlife", "Cleaner air for residents"], "a": 3, "e": "Đoạn 2 nêu giảm chi phí điều hòa, giảm áp lực thoát nước và nơi trú ẩn cho chim/côn trùng; không nhắc việc lọc sạch không khí cho cư dân."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>The initial outlay alone is enough to put many owners off.</b>", "o": ["[IV]", "[III]", "[II]", "[I]"], "a": 2, "e": "Câu 'Chi phí ban đầu đã đủ làm nhiều chủ nhà nản lòng' nối ngay sau câu mở đoạn 'Critics point out that such roofs are costly to build' → vị trí [II]."}, {"s": "The word <b>them</b> in paragraph 4 refers to ______.", "o": ["cities", "buildings", "green roofs", "tax reductions"], "a": 2, "e": "'install them' = lắp đặt những mái nhà xanh (green roofs)."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Green roofs are too expensive to be worth building.", "Green roofs face objections over expense, but supporters expect them to pay off.", "Maintenance is the only real obstacle to green roofs.", "Supporters admit that critics are completely right."], "a": 1, "e": "Đoạn 3 nêu ý kiến phản biện về chi phí xây dựng/bảo trì và lời đáp của người ủng hộ rằng chi phí sẽ được bù đắp theo thời gian."}, {"s": "Which of the following is true according to the passage?", "o": ["Every city requires green roofs on all new buildings.", "Supporters say green roofs make roofs last longer.", "Rooftop plants need no regular care.", "Architects reject the idea of rooftop gardens."], "a": 1, "e": "Cuối đoạn 3: 'through lower energy bills and a longer roof lifespan'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Green roofs are the cheapest option to build.", "Authorities may use policy to encourage adoption.", "Dense districts already have too many birds.", "Critics' concerns have been fully resolved."], "a": 1, "e": "Đoạn 4 nêu việc bắt buộc với tòa nhà lớn hoặc giảm thuế → chính quyền dùng chính sách để thúc đẩy."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Rooftops Reborn: From Wasted Space to Urban Asset", "Concrete Jungles: A City Without Hope", "Why Plants Cannot Survive on Roofs", "The End of Air Conditioning"], "a": 0, "e": "Tiêu đề A phản ánh trọn vẹn sự chuyển dịch từ không gian bỏ phí thành tài sản đô thị giá trị."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Where rivers meet the tropical sea, tangled roots rise above the mud at low tide. For centuries, coastal developers viewed mangrove swamps as wasteland to be cleared for shrimp ponds, resorts or ports. In recent decades, however, ecologists have shown that these <b>unassuming</b> coastal forests are among the most productive ecosystems on Earth.\n\nA healthy mangrove belt acts as a living breakwater. When typhoon waves roll in from the open sea, the dense network of trunks and aerial roots slows the water down and cuts wave height by up to two thirds. Behind the trees, coastal dykes suffer far less damage, and villages are spared the worst flooding. Below the surface, the muddy soil traps carbon up to four times more efficiently per hectare than tropical rainforests on land.\n\n<b>[I]</b> Mangroves are equally vital for local economies. <b>[II]</b> Calm, nutrient-rich water among the roots shelters young crabs, shrimp and fish from larger predators until they are big enough to swim out to sea. <b>[III]</b> When mangroves are cut down, offshore catches often drop within a few seasons, leaving fishing families with emptier nets. <b>[IV]</b>\n\nRestoring lost mangroves is not as simple as sticking seedlings into the sand. <b>They</b> thrive only when the right species is planted at the right tidal depth and local communities are paid to guard the young trees. Across Vietnam's coastline, from Quang Ninh to Ca Mau, mangrove restoration is proving that nature itself can be the strongest sea wall.", "qs": [{"s": "The word <b>unassuming</b> in paragraph 1 is closest in meaning to ______.", "o": ["dangerous", "modest", "artificial", "ancient"], "a": 1, "e": "unassuming = khiêm tốn, vẻ ngoài bình dị = modest."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["mangroves were once widely undervalued and cleared", "coastal developers have always protected mangrove swamps", "shrimp ponds naturally create new mangrove forests", "mangroves only grow in cold mountain rivers"], "a": 0, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'mangroves were once widely undervalued and cleared'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Reducing the height of storm waves", "Protecting coastal dykes from damage", "Storing large amounts of carbon in the soil", "Filtering salt out of drinking water wells"], "a": 3, "e": "Đoạn 2 đề cập 3 ý đầu; phương án D ('Filtering salt out of drinking water wells') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>In this way, a strip of coastal trees quietly sustains fisheries miles from the shore.</b>", "o": ["[II]", "[I]", "[IV]", "[III]"], "a": 2, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Fishermen prefer cutting down mangroves to catch larger predators.", "Mangrove forests provide crucial breeding grounds that support coastal fishing livelihoods.", "Young fish cannot survive in the muddy water around mangrove roots.", "Tourism has completely replaced fishing in coastal villages."], "a": 1, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Mangrove forests provide crucial breeding grounds that support coastal fishing livelihoods.'."}, {"s": "The word/phrase <b>They</b> in paragraph 4 refers to ______.", "o": ["mangrove seedlings", "coastal communities", "offshore catches", "shrimp ponds"], "a": 0, "e": "Trong ngữ cảnh đoạn 4, <b>They</b> quy chiếu cho 'mangrove seedlings'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Planting any tree species anywhere on the beach will succeed.", "Vietnam has no mangrove forests left in the south.", "Concrete sea walls are always cheaper and stronger than mangroves.", "Successful restoration requires both ecological care and community involvement."], "a": 3, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Successful restoration requires both ecological care and community involvement.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Large predators easily hunt young shrimp inside dense mangrove roots.", "Typhoon waves move faster when passing through mangrove roots.", "Mangrove soil stores more carbon per hectare than terrestrial rainforests.", "Mangrove restoration requires no knowledge of tidal depth."], "a": 2, "e": "Thông tin đúng theo bài đọc: 'Mangrove soil stores more carbon per hectare than terrestrial rainforests.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Shrimp ponds are the best way to protect coastal dykes from typhoons.", "Destroying mangroves can harm both coastal safety and fishermen's income.", "Mangroves release more carbon into the air than factories.", "Only northern provinces can grow mangrove trees."], "a": 1, "e": "Suy luận hợp lý từ toàn bài: 'Destroying mangroves can harm both coastal safety and fishermen's income.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Living Sea Walls: How Mangroves Protect Coasts and Livelihoods", "Why Tropical Fish Are Leaving the Ocean", "The History of Concrete Dykes in Asia", "How to Build a Coastal Resort"], "a": 0, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Living Sea Walls: How Mangroves Protect Coasts and Livelihoods'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Many students treat sleep as a luxury they can sacrifice whenever exams approach. Armed with mugs of strong coffee, they reread textbooks until two in the morning, convinced that every extra hour at the desk adds to their score. Neuroscientists, however, warn that cutting sleep short <b>undermines</b> the very memory processes students rely on.\n\nLearning does not end when we close a book. While we are awake, new facts and formulas are held temporarily in the hippocampus, a brain region with limited storage capacity. During deep slow-wave sleep, the brain replays the day's lessons and transfers them to the cortex for long-term storage. Without this nightly file transfer, new memories remain fragile and are easily overwritten the next day.\n\n<b>[I]</b> Sleep also clears space for fresh learning. <b>[II]</b> Experiments show that volunteers who nap or sleep a full night before studying remember significantly more vocabulary than those who stay awake for eighteen hours straight. <b>[III]</b> Moreover, rapid-eye-movement (REM) sleep links new concepts with older knowledge, helping students spot creative connections across different topics. <b>[IV]</b>\n\nStaying up all night before a test therefore strikes a double blow: it leaves the brain too tired to focus and robs <b>it</b> of the time needed to lock in what was studied. Far from being wasted hours, a full night's rest is the silent partner of effective study.", "qs": [{"s": "The word <b>undermines</b> in paragraph 1 is closest in meaning to ______.", "o": ["celebrates", "strengthens", "weakens", "measures"], "a": 2, "e": "undermines = làm suy yếu, phá hỏng = weakens."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["drinking coffee at night guarantees top exam grades", "many students mistakenly trade sleep for late-night cramming", "neuroscientists recommend studying until two in the morning", "exams should be held late at night"], "a": 1, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'many students mistakenly trade sleep for late-night cramming'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Erasing all childhood memories every night", "Replaying the day's lessons during deep sleep", "Transferring memories to the cortex for long-term storage", "Holding new facts temporarily in the hippocampus"], "a": 0, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Erasing all childhood memories every night') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>This explains why a tough problem that seemed impossible at midnight often looks clearer in the morning.</b>", "o": ["[III]", "[I]", "[II]", "[IV]"], "a": 3, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["REM sleep only occurs when students drink coffee.", "Volunteers who stay awake for eighteen hours remember vocabulary best.", "Sleep prepares the brain for new learning and helps connect ideas creatively.", "Napping during the day destroys long-term memory."], "a": 2, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Sleep prepares the brain for new learning and helps connect ideas creatively.'."}, {"s": "The word/phrase <b>it</b> in paragraph 4 refers to ______.", "o": ["the test", "the brain", "the textbook", "the desk"], "a": 1, "e": "Trong ngữ cảnh đoạn 4, <b>it</b> quy chiếu cho 'the brain'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Sleep is an active biological process essential for academic success.", "Students should stop revising altogether and only sleep.", "The hippocampus has unlimited space for permanent memories.", "Coffee can fully replace slow-wave sleep."], "a": 0, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Sleep is an active biological process essential for academic success.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Staying awake for eighteen hours improves concentration.", "Long-term memories are transferred from the cortex to the hippocampus during lunch.", "REM sleep prevents students from connecting different subjects.", "Memories stored only in the hippocampus are vulnerable to being overwritten."], "a": 3, "e": "Thông tin đúng theo bài đọc: 'Memories stored only in the hippocampus are vulnerable to being overwritten.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Slow-wave sleep happens while students are reading textbooks.", "Exams test only knowledge stored in the hippocampus.", "A student who sleeps well after revising is likely to recall more than one who crams all night.", "Creative problem-solving has no link to sleep quality."], "a": 2, "e": "Suy luận hợp lý từ toàn bài: 'A student who sleeps well after revising is likely to recall more than one who crams all night.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["How Coffee Became a Student's Best Friend", "The Night Shift of the Brain: Why Sleep Powers Learning", "Why Textbooks Should Be Shorter", "The History of University Exams"], "a": 1, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'The Night Shift of the Brain: Why Sleep Powers Learning'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "By 2050, nearlyseventy percent of the world's population will live in cities, and feeding billions of urban residents without clearing more forests is a pressing challenge. One bold response is vertical farming: growing crops indoors in stacked trays under carefully tuned LED lights. What once sounded like science fiction is now operating in warehouses from Singapore to Amsterdam.\n\nInside a vertical farm, every variable—light, temperature, humidity and nutrient mist—is controlled by computer sensors. Because lettuce, spinach and herbs grow in mineral-rich water or mist rather than soil, vertical farms use up to ninety-five percent less water than open fields. Protected from droughts, floods and pests, crops can be harvested year-round without chemical pesticides, and farms located inside cities cut transport miles <b>drastically</b>.\n\n<b>[I]</b> Despite these advantages, vertical farming is no silver bullet for global hunger. <b>[II]</b> Artificial lighting and climate control consume large amounts of electricity, which raises operating costs and carbon emissions unless renewable power is used. <b>[III]</b> Furthermore, while leafy greens and strawberries thrive on indoor shelves, staple crops such as rice, wheat and maize require too much space and energy to be grown profitably indoors. <b>[IV]</b>\n\nAgricultural economists therefore view vertical farms as a complement to traditional farming rather than a replacement for <b>it</b>. By supplying fresh greens to dense cities and arid regions, indoor farms can ease pressure on rural land while field farmers focus on staple grains.", "qs": [{"s": "The word <b>drastically</b> in paragraph 2 is closest in meaning to ______.", "o": ["rarely", "slowly", "secretly", "sharply"], "a": 3, "e": "drastically = mạnh mẽ, đáng kể = sharply."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["vertical farms can only be built in Singapore", "all forests will disappear by the year 2050", "vertical farming grows crops in stacked indoor layers under LED lights", "crops in vertical farms rely on natural sunlight"], "a": 2, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'vertical farming grows crops in stacked indoor layers under LED lights'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Saving up to ninety-five percent of water compared to open fields", "Producing staple grains like rice at the lowest cost", "Growing produce without chemical pesticides", "Harvesting crops throughout the year regardless of weather"], "a": 1, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Producing staple grains like rice at the lowest cost') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>As a result, a bag of indoor-grown salad often costs more at the supermarket than field-grown greens.</b>", "o": ["[III]", "[I]", "[II]", "[IV]"], "a": 0, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [III] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Consumers refuse to eat vegetables grown under LED lights.", "Vertical farms use no electricity at all during the winter.", "Rice and wheat are the most profitable crops for indoor shelves.", "High energy demand and crop limitations prevent vertical farming from solving hunger alone."], "a": 3, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'High energy demand and crop limitations prevent vertical farming from solving hunger alone.'."}, {"s": "The word/phrase <b>it</b> in paragraph 4 refers to ______.", "o": ["renewable power", "global hunger", "traditional farming", "arid land"], "a": 2, "e": "Trong ngữ cảnh đoạn 4, <b>it</b> quy chiếu cho 'traditional farming'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Traditional field farming will soon disappear completely.", "Vertical farming works best alongside conventional agriculture, not in place of it.", "Indoor farms should only be built in rural rice-growing villages.", "Leafy greens cannot survive in mineral-rich water."], "a": 1, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Vertical farming works best alongside conventional agriculture, not in place of it.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Vertical farms inside cities reduce the distance food travels to urban consumers.", "Open-field farming uses ninety-five percent less water than vertical farming.", "Vertical farms depend heavily on chemical pesticides to control insects.", "Staple grains like wheat require very little energy to grow indoors."], "a": 0, "e": "Thông tin đúng theo bài đọc: 'Vertical farms inside cities reduce the distance food travels to urban consumers.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Strawberries cannot grow under artificial lighting.", "Countries with plenty of farmland have banned lettuce and spinach.", "Vertical farms are unaffected by the price of electricity.", "Powering vertical farms with solar or wind energy would improve their environmental footprint."], "a": 3, "e": "Suy luận hợp lý từ toàn bài: 'Powering vertical farms with solar or wind energy would improve their environmental footprint.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["The End of Traditional Farmers", "Why Rice Will Soon Be Grown in City Warehouses", "Farming Upwards: The Promise and Limits of Vertical Agriculture", "How Pesticides Saved Modern Cities"], "a": 2, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Farming Upwards: The Promise and Limits of Vertical Agriculture'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Many consumers have experienced the frustration of a washing machine or smartphone that stops working just months after its warranty expires. When taken to a service desk, the owner is often told that repairing the fault will cost nearly as much as buying a new model. Critics argue that this is rarely an accident; it is the result of <b>deliberate</b> design choices that shorten product lifespans.\n\nManufacturers frequently seal batteries inside cases with strong glue, use proprietary screws that ordinary screwdrivers cannot turn, or stop selling spare circuit boards after three years. While companies claim these designs make devices thinner and more water-resistant, environmental groups point out the heavy toll: millions of tonnes of e-waste and wasted raw materials every year.\n\n<b>[I]</b> Public pushback has given rise to a global 'Right to Repair' movement. <b>[II]</b> New rules in Europe and several US states now require brands to design appliances that can be disassembled with standard tools and to keep spare parts in stock for up to ten years. <b>[III]</b> France has even introduced a mandatory 'repairability score' from 1 to 10 on price tags for laptops, phones and lawnmowers. <b>[IV]</b>\n\nEarly results show that when shoppers can see those scores clearly, <b>they</b> gravitate towards higher-rated models, pushing manufacturers to compete on durability rather than novelty alone. Extending the life of electronics by just two years could cut their lifetime carbon footprint by nearly a third.", "qs": [{"s": "The word <b>deliberate</b> in paragraph 1 is closest in meaning to ______.", "o": ["intentional", "accidental", "temporary", "generous"], "a": 0, "e": "deliberate = có chủ đích, cố ý = intentional."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["consumers prefer appliances that break down quickly", "warranties usually last for twenty years on smartphones", "service desks repair all broken washing machines for free", "repairs are often priced so high that owners buy a new device instead"], "a": 3, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'repairs are often priced so high that owners buy a new device instead'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Sealing batteries inside cases with strong glue", "Using special screws that standard tools cannot open", "Giving every buyer a free screwdriver kit", "Discontinuing spare parts after a few years"], "a": 2, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Giving every buyer a free screwdriver kit') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>Armed with this number, buyers can compare how easy a product is to fix before paying for it.</b>", "o": ["[I]", "[IV]", "[II]", "[III]"], "a": 1, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Governments are introducing laws and labels that make products easier to repair.", "France has banned the sale of all laptops and lawnmowers.", "Manufacturers voluntarily stopped using glue in smartphones fifty years ago.", "Repairability scores are kept secret from ordinary shoppers."], "a": 0, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Governments are introducing laws and labels that make products easier to repair.'."}, {"s": "The word/phrase <b>they</b> in paragraph 4 refers to ______.", "o": ["price tags", "scores", "manufacturers", "shoppers"], "a": 3, "e": "Trong ngữ cảnh đoạn 4, <b>they</b> quy chiếu cho 'shoppers'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Only washing machines can be repaired with standard tools.", "Extending a device's life has no effect on carbon emissions.", "Transparent repairability information can shift both consumer choices and company design.", "Consumers care only about screen size, never durability."], "a": 2, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Transparent rep
