window.EXTRA_P={"0": [{"lv": 1, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "Dear Ms Nguyen,\na. We would therefore be honoured if you could share your experience of studying abroad with them.\nb. The session would take place in the school hall at 9 a.m. on Saturday, 12 April, and lunch will be provided for all guests.\nc. On behalf of Hoa Binh High School, I am writing to invite you to our Alumni Day this spring.\nd. Please confirm your attendance by replying to this email before 5 April so that we can finalise the programme.\ne. Your achievements since graduating have been a great source of inspiration for many of our current students.\nYours sincerely,", "o": ["c - a - e - b - d", "e - c - a - b - d", "c - e - a - b - d", "c - e - b - a - d"], "a": 2, "e": "Trình tự thư mời: c (nêu mục đích viết thư) → e (lý do mời: thành tích truyền cảm hứng cho học sinh hiện tại) → a (đề nghị chia sẻ; 'therefore' nối với lý do ở e và 'them' = current students) → b (chi tiết buổi chia sẻ: 'The session...') → d (đề nghị xác nhận tham dự)."}, {"s": "a. Student: Yes, it's a blue notebook with my name on the cover.\nb. Student: Excuse me, I think I left my notebook in the classroom this morning.\nc. Teacher: Could you describe it? I'll check the lost-and-found box.", "o": ["a - b - c", "c - b - a", "b - a - c", "b - c - a"], "a": 3, "e": "b (học sinh báo để quên vở) → c (giáo viên yêu cầu mô tả để kiểm tra hộp đồ thất lạc; 'it' = my notebook) → a (học sinh mô tả: vở xanh có ghi tên)."}, {"s": "a. Remote working has become a common arrangement in many industries, allowing employees to carry out their duties from almost anywhere.\nb. The flexibility, however, comes at a price, as the boundary between professional and private life gradually disappears.\nc. Workers enjoy flexible schedules and save hours that would otherwise be wasted commuting, and many report that they concentrate better at home.\nd. Employers who adopt this model should therefore set clear working hours and encourage staff to switch off once they have ended.\ne. Messages that arrive late at night, for example, often leave people feeling obliged to respond immediately.", "o": ["a - b - c - d - e", "a - c - b - e - d", "c - a - e - b - d", "e - b - a - c - d"], "a": 1, "e": "a (giới thiệu làm việc từ xa) → c (lợi ích: lịch linh hoạt, tiết kiệm thời gian đi lại) → b ('The flexibility, however...' đối lập với lợi ích ở c) → e (ví dụ minh họa cho việc ranh giới công – tư mờ đi) → d ('therefore': kiến nghị dành cho nhà tuyển dụng)."}, {"s": "a. Mai: Mr Hung, I'm thinking about joining the debate club, but I'm not sure it's a good idea.\nb. Mr Hung: I think you should. It will help you speak more confidently in public.\nc. Mai: That sounds useful. I'll sign up this afternoon.\nd. Mai: But I'm afraid it will take too much time away from my studies.\ne. Mr Hung: Not really. The club only meets twice a week, so you can still manage your homework.", "o": ["a - b - d - e - c", "a - e - d - b - c", "d - b - a - e - c", "a - b - c - d - e"], "a": 0, "e": "Lượt thoại luân phiên Mai – Mr Hung: a (Mai nêu dự định) → b (Mr Hung khuyên nên tham gia) → d (Mai lo ngại, mở đầu bằng 'But') → e (Mr Hung trấn an: 'Not really...') → c (Mai kết: 'That sounds useful. I'll sign up')."}, {"s": "a. Within a year, the club's membership had tripled, and neighbouring schools began copying the idea.\nb. Parents and local businesses soon donated seeds, tools and free advice, which turned the empty yard into a thriving vegetable garden.\nc. For years, the yard behind Linden High School had been an unused patch of concrete and weeds.\nd. The turning point came when a group of science students asked the principal for permission to start a gardening club.\ne. Encouraged by this growing popularity, the principal decided to make gardening a regular part of the school curriculum.", "o": ["d - c - a - b - e", "a - c - d - b - e", "c - d - b - a - e", "c - b - d - e - a"], "a": 2, "e": "c (bối cảnh: sân trường bỏ hoang nhiều năm) → d ('The turning point': nhóm học sinh xin lập CLB làm vườn) → b (phụ huynh, doanh nghiệp hỗ trợ, khu vườn phát triển) → a ('Within a year': thành viên tăng gấp ba) → e ('this growing popularity' nối ý ở a; hiệu trưởng đưa vào chương trình)."}]}]}, {"lv": 1, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Diner: Excuse me, I've been waiting so long for my order.\nb. Diner: Thanks for your help.\nc. Waiter: I'm sorry! I'll check with the kitchen and get back to you immediately.", "o": ["a - b - c", "b - c - a", "c - b - a", "a - c - b"], "a": 3, "e": "a (khách phàn nàn chờ món lâu) → c (nhân viên xin lỗi và hứa kiểm tra ngay) → b (khách cảm ơn)."}, {"s": "a. Customer: What if I don't keep the original packaging?\nb. Customer: Great. I'll bring the item and receipt tomorrow.\nc. Customer: I'd like to exchange the electric fan I bought yesterday.\nd. Manager: Sold items can be exchanged within five days, but we don't give refunds.\ne. Manager: No problem, only your receipt is needed.", "o": ["c - d - a - e - b", "a - d - c - e - b", "c - e - a - d - b", "a - e - c - d - b"], "a": 0, "e": "c (khách nêu nhu cầu đổi quạt) → d (quản lý nêu quy định đổi hàng) → a (khách hỏi nếu mất vỏ hộp) → e (quản lý trả lời chỉ cần hóa đơn) → b (khách hẹn mang tới ngày mai)."}, {"s": "Dear Minh,\na. Would you like to come with me and try a beginner's pottery session this Sunday morning?\nb. Best of all, students get a thirty-percent discount if we book two places together before Friday.\nc. I've just found a wonderful craft workshop near West Lake that teaches traditional ceramic making.\nd. Let me know by Thursday evening if you're free so I can reserve our spots online.\ne. Each class lasts two hours, and participants can take home the mug or bowl they make.\nBest wishes, Lan", "o": ["c - e - a - b - d", "a - c - e - b - d", "c - a - d - e - b", "e - c - b - a - d"], "a": 0, "e": "c (giới thiệu xưởng gốm mới tìm thấy )."}, {"s": "a. For instance, sensors buried in the soil can measure moisture levels and water crops only when necessary.\nb. Digital technology is quietly reshaping traditional farming across the Mekong Delta.\nc. As a result, farmers save up to thirty percent of irrigation water while maintaining healthy yields.\nd. Smartphone apps also alert growers to pest outbreaks and sudden weather changes days in advance.\ne. These innovations show that modern agriculture relies as much on data as on hard physical labour.", "o": ["b - a - c - d - e", "a - b - c - d - e", "b - d - a - e - c", "c - b - a - d - e"], "a": 0, "e": "b (câu chủ đề: công nghệ số thay đổi nông nghiệp ĐBSCL) → a ('For instance': cảm biến độ ẩm đất) → c ('As a result': tiết kiệm 30% nước tưới) → d ('also': ứng dụng cảnh báo sâu bệnh, thời tiết) → e ('These innovations': kết luận)."}, {"s": "a. First, separate washable glass jars, paper cardboard and plastic bottles from food scraps.\nb. Household recycling is much simpler when every family member follows a clear routine.\nc. Finally, place the sorted bags at the collection point before 7 a.m. on scheduled days.\nd. Next, rinse food containers with a little water so that they do not attract insects or create bad odours.\ne. Once the items are clean and dry, flatten cardboard boxes and plastic bottles to save space in the bin.", "o": ["b - a - e - d - c", "a - b - d - e - c", "b - d - a - e - c", "b - a - d - e - c"], "a": 3, "e": "b (câu chủ đề) → a ('First': phân loại rác) → d ('Next': tráng sạch hộp đựng) → e ('Once the items are clean and dry': ép dẹp hộp giấy/chai nhựa) → c ('Finally': mang ra điểm thu gom)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Tourist: Thank you! Is it within walking distance?\nb. Tourist: Excuse me, could you tell me how to get to the Ethnology Museum?\nc. Local: It's quite far, so you'd better take bus number 14 from the stop across the street.", "o": ["b - a - c", "b - c and urban progress.\nc. Simple changes, such as shielding lamps so light points downward, can cut glare without compromising street safety.\nd. In many metropolises, artificial glow is so intense that residents can no longer see the Milky Way.\ne. Human health is affected too, as exposure to bright light after midnight suppresses melatonin and harms sleep quality.", "o": ["b - a - d - c - e", "b - d - a - e - c", "d - b - a - e - c", "a - b - d - e - c"], "a": 1, "e": "b (đèn đường sáng từng được coi là biểu tượng tiến bộ) → d (thực trạng ánh sáng nhân tạo che khuất bầu trời đêm) → a ('However': tác hại lên chim di cư và côn trùng) → e ('Human health is affected too': tác hại lên giấc ngủ con người) → c (giải pháp thiết kế chao đèn)."}, {"s": "a. At the repair café, retired engineers and skilled volunteers help visitors mend broken kettles, fans and bicycles for free.\nb. Instead of throwing faulty appliances away, residents of Greenview District now gather at the community centre every first Sunday.\nc. Beyond reducing electronic waste, the monthly event has brought neighbours of different generations closer together.\nd. Visitors are encouraged to watch closely and hold the tools themselves so they can handle minor repairs at home next time.\ne. Over the past six months, more than four hundred household items have been saved from landfill.", "o": ["b - a - d - e - c", "a - b - d - e - c", "b - e - a - c - d", "d - b - a - e - c"], "a": 0, "e": "b (bối cảnh: người dân tụ họp mỗi Chủ nhật đầu tháng thay vì vứt đồ hỏng) → a ('At the repair café': kỹ sư nghỉ hưu giúp sửa đồ miễn phí) → d (khuyến khích người dân tự tay học sửa) → e (kết quả 6 tháng cứu hơn 400 món đồ) → c ('Beyond reducing electronic waste': gắn kết các thế hệ)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Receptionist: Certainly. May I have your full name and phone number, please?\nb. Caller: Good morning, I'd like to book a dental check-up for Friday afternoon.\nc. Receptionist: Good morning, Smile Dental Clinic. How can I help you today?", "o": ["b - c - a", "c - b - a", "c - a - b", "a - c - b"], "a": 1, "e": "c (lễ tân chào và hỏi thông tin hỗ trợ) → b (khách nêu yêu cầu đặt lịch khám răng) → a (lễ tân xin họ tên và số điện thoại)."}, {"s": "a. Minh: Really? I thought cooking at home took too much time every evening.\nb. An: I've started bringing homemade lunch boxes to school instead of buying fast food.\nc. Minh: That sounds practical. Maybe I'll try prepping meals with my sister this weekend.\nd. An: Not if you prepare the ingredients on Sunday and store them in glass containers.\ne. An: Besides saving money, I feel much more energetic during afternoon classes.", "o": ["b - a - d - e - c", "b - e - a - d - c", "a - b - d - e - c", "b - d - a - e - c"], "a": 0, "e": "b (An kể bắt đầu mang cơm tự nấu) → a (Minh ngạc nhiên vì nghĩ nấu ăn tốn thời gian) → d (An giải thích cách sơ chế từ Chủ nhật) → e (An nêu thêm lợi ích tiết kiệm và khỏe khoắn) → c (Minh hưởng ứng)."}, {"s": "Dear Community Library Team,\na. All of the books are in clean condition and suitable for teenagers aged thirteen to eighteen.\nb. I am writing to ask whether your library is currently accepting donations of English storybooks and science magazines.\nc. Please let me know what time I can drop the boxes off at the reception desk.\nd. Now that I have graduated from high school, I would love to pass my collection of forty books on to younger readers.\ne. Thank you for maintaining such a welcoming space for students in our neighbourhood.\nBest regards, Pham Gia Huy", "o": ["b - d - c - a - e", "d - b - a - c - e", "b - a - c - d - e", "b - d - a - c - e"], "a": 3, "e": "b (mục đích thư: hỏi thư viện có nhận quyên góp sách không) → d (lý do quyên góp: vừa tốt nghiệp THPT, có 40 cuốn) → a ('All of the books...': mô tả tình trạng sách) → c (hỏi giờ mang sách tới) → e (lời cảm ơn kết thư)."}, {"s": "a. When mangrove forests are cleared for coastal development, waves strike the shore with full force and wash away fertile soil.\nb. Stretching along tropical coastlines, mangroves act as a natural shield against typhoons and rising tides.\nc. Their tangled roots trap sediment carried by rivers and slow down oncoming waves before they reach villages.\nd. Restoring these coastal forests is therefore one of the most cost-effective ways to protect seaside communities.\ne. In addition, the calm water among the roots serves as a nursery for young fish, crabs and shrimp.", "o": ["b - a - c - d - e", "c - b - a - e - d", "b - c - e - a - d", "a - b - c - e - d"], "a": 2, "e": "b (giới thiệu rừng ngập mặn như lá chắn tự nhiên) → c ('Their tangled roots': cơ chế cản sóng, giữ phù sa) → e ('In addition': nơi sinh sản của thủy sản) → a (hậu quả khi rừng ngập mặn bị chặt) → d ('therefore': kết luận cần khôi phục rừng)."}, {"s": "a. By the end of the afternoon, we had collected over thirty bags of plastic wrappers, bottles and fishing nets.\nb. Last Sunday, fifty volunteers from our youth union gathered at Sam Son Beach at dawn for a coastal clean-up.\nc. Several tourists staying nearby saw our team working and spontaneously joined in with gloves we lent them.\nd. Divided into five small groups, we walked along a three-kilometre stretch of sand with reusable sacks and tongs.\ne. Although everyone was tired, seeing the clean golden shoreline under the sunset made every step worthwhile.", "o": ["d - b - c - a - e", "b - d - c - a - e", "b - a - d - c - e", "b - c - d - a - e"], "a": 1, "e": "b (mở đầu: 50 tình nguyện viên tập trung lúc bình minh) → d (chia 5 nhóm đi dọc 3km bờ biển) → c (du khách thấy và tham gia cùng) → a ('By the end of the afternoon': thu gom hơn 30 bao rác) → e (cảm xúc kết thúc ngày tình nguyện)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Librarian: You can keep them for two weeks, and you can renew them online once.\nb. Student: Excuse me, how long can I borrow these reference books?\nc. Student: Great, thank you very much!", "o": ["b - c - a", "a - b - c", "b - a - c", "c - a - b"], "a": 2, "e": "b (học sinh hỏi thời hạn mượn sách) → a (thủ thư trả lời 2 tuần và gia hạn online 1 lần) → c (học sinh cảm ơn)."}, {"s": "a. Mom: Have you packed your ID card and exam permit in your pencil case, Con?\nb. Son: Oh, I left the permit on my desk after checking the room number! Thanks for reminding me, Mom.\nc. Mom: Better put it in your bag right now so you won't panic tomorrow morning.\nd. Son: I've already put my ID card, two pencils and an eraser in the clear folder.\ne. Mom: What about the exam permit? Did you put it in there too?", "o": ["a - b - d - e - c", "a - d - e - b - c", "d - a - e - b - c", "a - d - b - e - c"], "a": 1, "e": "a (mẹ hỏi đã cất CCCD và thẻ dự thi chưa) → d (con nói đã bỏ CCCD, bút chì, tẩy) → e (mẹ hỏi lại còn giấy báo dự thi thì sao) → b (con sực nhớ để trên bàn) → c (mẹ dặn cất ngay vào cặp)."}, {"s": "Dear Ms Lan,\na. Since my family is moving to Da Nang next month, I will have to leave the school choir at the end of this term.\nb. I am writing to thank you for your patient guidance during my two years in the Harmony Choir.\nc. Singing with the group has taught me not only vocal technique but also how to listen and blend with others.\nd. I wish you and the choir every success in the upcoming summer music festival.\ne. When I first joined in grade ten, I was too nervous to sing a solo line in front of my classmates.\nWarmest regards, Minh Chau", "o": ["b - e - c - a - d", "a - b - e - c - d", "b - a - e - c - d", "e - b - c - a - d"], "a": 0, "e": "b (mục đích thư cảm ơn cô Lan) → e (kỷ niệm khi mới vào lớp 10 còn nhút nhát) → c (những bài học trưởng thành từ dàn hợp xướng) → a (lý do chia tay vì chuyển vào Đà Nẵng) → d (lời chúc dàn hợp xướng)."}, {"s": "a. Without bees and butterflies transferring pollen between blossoms, many fruit trees and vegetable crops would fail to bear fruit.\nb. Yet widespread pesticide use and the loss of wildflower meadows have caused pollinator numbers to drop sharply.\nc. Pollinators play an indispensable role in both natural ecosystems and human food production.\nd. Planting native flowers on balconies and in city parks is a simple step citizens can take to provide them with nectar.\ne. Roughly one third of the food on our plates depends directly on the quiet work of these insects.", "o": ["e - c - a - b - d", "a - c - b - e - d", "c - b - a - e - d", "c - a - e - b - d"], "a": 3, "e": "c (vai trò thiết yếu của côn trùng thụ phấn) → a (giải thích cơ chế truyền phấn hoa) → e (dẫn chứng 1/3 lượng thức ăn phụ thuộc vào chúng) → b ('Yet': thực trạng suy giảm do thuốc trừ sâu và mất đồng cỏ) → d (giải pháp trồng hoa bản địa)."}, {"s": "a. Instead of paying with cash, commuters simply tap their bank card or scan a QR code at the ticket gate.\nb. Cashless payment has made travelling on public transport in major Vietnamese cities faster and more convenient.\nc. This system eliminates long queues at ticket booths during morning and evening rush hours.\nd. To ensure nobody is left behind, stations still maintain assistance counters for elderly passengers who prefer paper tickets.\ne. Moreover, automatic fare records help transport authorities track passenger flow and adjust bus schedules accurately.", "o": ["b - c - a - d - e", "a - b - c - e - d", "b - a - c - e - d", "b - a - d - c - e"], "a": 2, "e": "b (câu chủ đề: thanh toán không tiền mặt trên giao thông công cộng) → a (cách thức chạm thẻ/quét QR) → c ('This system': xóa bỏ cảnh xếp hàng mua vé) → e ('Moreover': giúp cơ quan quản lý điều phối lịch trình) → d (vẫn có quầy hỗ trợ người cao tuổi)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Shop assistant: We have it in medium and large. Would you like to try the medium on?\nb. Customer: Excuse me, do you have this cotton jacket in medium?\nc. Customer: Yes, please. Where is the fitting room?", "o": ["c - a - b", "a - b - c", "b - c - a", "b - a - c"], "a": 3, "e": "b (khách hỏi áo khoác cỡ M) → a (nhân viên báo có cỡ M và L, mời thử) → c (khách đồng ý và hỏi phòng thử đồ)."}, {"s": "a. Khoa: Have you heard about the school's 'Book Swap Corner' starting next Monday?\nb. Thảo: You bring any old book you've finished reading and exchange it for a token to pick another book.\nc. Khoa: How does it work? Do we have to pay a fee to join?\nd. Thảo: Yes! I've already selected five detective novels from my shelf to bring in.\ne. Khoa: That's brilliant. I'll sort through my bookshelf tonight.", "o": ["d - a - c - b - e", "a - c - d - b - e", "a - d - c - b - e", "a - d - b - c - e"], "a": 2, "e": "a (Khoa hỏi Thảo về Góc đổi sách) → d (Thảo hào hứng kể đã chọn 5 cuốn) → c (Khoa hỏi cách thức hoạt động) → b (Thảo giải thích quy trình đổi sách lấy thẻ) → e (Khoa khen hay và sẽ soạn sách tối nay)."}, {"s": "Dear Organising Committee,\na. I have worked as a bilingual guide at the provincial museum for two summers and enjoy helping visitors.\nb. I am writing to apply for the position of Student Ambassador for the ASEAN Youth Cultural Exchange this August.\nc. Thank you for considering my application, and I am available for an interview at your convenience.\nd. Through this role, I hope to introduce traditional Vietnamese water puppetry and folk games to international delegates.\ne. I have attached my CV and a recommendation letter from my English teacher for your review.\nYours faithfully, Le Hoang Nam", "o": ["a - b - d - e - c", "b - a - d - e - c", "b - d - a - c - e", "e - b - a - d - c"], "a": 1, "e": "b (nêu mục đích ứng tuyển Đại sứ Học sinh) → a (kinh nghiệm làm hướng dẫn viên song ngữ) → d ('Through this role': mong muốn đóng góp) → e (đính kèm CV và thư giới thiệu) → c (cảm ơn và sẵn sàng phỏng vấn)."}, {"s": "a. Audio guides and interactive screens now allow visitors to hear historical figures tell their stories in the first person.\nb. Museums were once quiet halls where visitors walked past glass cases and read long printed labels.\nc. As a result, young visitors spend more time exploring exhibits and remember historical events far more vividly.\nd. In recent years, however, curators have embraced storytelling and digital media to bring objects to life.\ne. Some galleries even provide virtual-reality headsets that reconstruct ancient palaces right before the viewer's eyes.", "o": ["b - d - a - e - c", "d - b - a - e - c", "b - a - d - c - e", "b - d - c - a - e"], "a": 0, "e": "b (bảo tàng trước đây tĩnh lặng với tủ kính) → d ('In recent years, however': đổi mới bằng công nghệ số) → a (thuyết minh tự động và màn hình tương tác) → e ('even': kính thực tế ảo tái hiện cung điện cổ) → c ('As a result': thu hút giới trẻ)."}, {"s": "a. Rather than memorizing isolated word lists, learners remember vocabulary better when they meet words in stories or podcasts.\nb. Context gives clues about tone, collocations and register that a simple two-word translation can never capture.\nc. Building a rich vocabulary in a foreign language requires more than flashcards and cramming.\nd. Reviewing new expressions in a personal notebook and using them in short sentences further strengthens long-term recall.\ne. When a learner sees how a phrase works in a real situation, the brain forms stronger associations.", "o": ["c - a - d - e - b", "a - c - b - e - d", "c - b - a - d - e", "c - a - e - b - d"], "a": 3, "e": "c (câu chủ đề: học từ vựng cần nhiều hơn là học vẹt) → a (học qua ngữ cảnh truyện/podcast) → e (cơ chế não bộ tạo liên kết khi gặp tình huống thật) → b (ngữ cảnh cung cấp sắc thái và cụm từ cố định) → d (ghi chép và đặt câu giúp nhớ lâu)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Passenger: Platform 4? Thank you so much!\nb. Station staff: The 9:30 express train to Hue departs from Platform 4, right over the bridge.\nc. Passenger: Excuse me, which platform does the express train to Hue leave from?", "o": ["c - b - a", "b - c - a", "c - a - b", "a - b - c"], "a": 0, "e": "c (hành khách hỏi sân ga tàu đi Huế) → b (nhân viên chỉ sân ga số 4) → a (hành khách xác nhận và cảm ơn)."}, {"s": "a. Hạnh: Why don't we organise a charity acoustic night in the schoolyard next month?\nb. Đức: That's a wonderful idea! The music club will definitely want to perform.\nc. Hạnh: Exactly. We can sell handmade bookmarks and lemonade at the entrance instead of charging for tickets.\nd. Đức: How should we raise funds if admission is free for students?\ne. Hạnh: We're looking for a creative way to raise money for flooded schools in the central provinces.", "o": ["e - a - d - b - c", "a - e - b - d - c", "e - b - a - d - c", "e - a - b - d - c"], "a": 3, "e": "e (Hạnh nêu mục tiêu gây quỹ ủng hộ trường vùng lũ) → a (Hạnh đề xuất đêm nhạc acoustic) → b (Đức tán thành) → d (Đức hỏi cách gây quỹ nếu vào cửa miễn phí) → c (Hạnh giải thích bán bookmark và nước chanh)."}, {"s": "Dear Customer Service Team,\na. However, when I opened the parcel this afternoon, I found that the lamp shade was cracked on one side.\nb. I am writing regarding order #VN4082, a ceramic desk lamp that I purchased from your online store on 2 May.\nc. Please let me know how I can return the damaged item and when the replacement will be dispatched.\nd. I have attached three clear photographs of the damaged shade and the original packaging box.\ne. As I need the lamp for my study room, I would prefer a replacement of the same model rather than a refund.\nYours faithfully, Hoang Bich Ngoc", "o": ["b - d - a - e - c", "a - b - d - e - c", "b - a - d - e - c", "b - a - e - c - d"], "a": 2, "e": "b (nêu mã đơn hàng và sản phẩm) → a ('However': phát hiện chao đèn bị nứt khi mở hộp) → d (đính kèm 3 ảnh chụp vết nứt) → e (mong muốn đổi sản phẩm mới thay vì hoàn tiền) → c (hỏi thủ tục gửi trả và thời gian nhận đèn mới)."}, {"s": "a. In addition to physical health, brisk walking outdoors lowers stress hormones and clears the mind after hours of screen work.\nb. Many people assume that staying fit requires expensive gym memberships and exhausting workouts.\nc. Walking for just thirty minutes a day at a steady pace can significantly reduce the risk of heart disease.\nd. Because it requires no special equipment beyond a pair of comfortable shoes, walking is a habit almost anyone can maintain.\ne. Medical studies, however, consistently show that moderate daily movement brings remarkable long-term benefits.", "o": ["e - b - c - a - d", "b - e - c - a - d", "b - c - e - d - a", "c - b - e - a - d"], "a": 1, "e": "b (quan niệm sai: tập thể dục phải tốn kém) → e ('Medical studies, however': vận động vừa phải hàng ngày rất hiệu quả) → c (cụ thể: đi bộ 30 phút/ngày giảm bệnh tim) → a ('In addition to physical health': giảm căng thẳng tinh thần) → d (dễ duy trì vì chỉ cần đôi giày êm)."}, {"s": "a. During the dry season, villagers used to walk three kilometres every day to fetch clean drinking water.\nb. Last autumn, a team of civil engineers helped the commune build a rainwater harvesting and filtration system.\nc. Large tanks connected to school and clinic roofs now store thousands of litres of rainwater during the monsoon months.\nd. Before reaching the taps, the water passes through layers of sand, gravel and activated charcoal.\ne. Thanks to the new system, children stay healthier and spend more time in class instead of carrying heavy water buckets.", "o": ["a - b - c - d - e", "b - a - c - d - e", "a - c - b - d - e", "c - d - a - b - e"], "a": 0, "e": "a (khó khăn trước đây vào mùa khô) → b ('Last autumn': kỹ sư giúp xây hệ thống thu và lọc nước mưa) → c (bồn lớn trữ nước mưa từ mái trường, trạm xá) → d (quy trình lọc qua cát, sỏi, than hoạt tính) → e ('Thanks to the new system': kết quả tích cực)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Mai: I'd love to, but I have a piano lesson at 4 p.m.\nb. Phong: How about Sunday morning then?\nc. Phong: Mai, are you free to play badminton this Saturday afternoon?", "o": ["a - c - b", "c - a - b", "c - b - a", "b - a - c"], "a": 1, "e": "c (Phong rủ Mai đánh cầu lông chiều thứ Bảy) → a (Mai cáo bận vì có giờ học piano) → b (Phong chuyển sang hẹn sáng Chủ nhật)."}, {"s": "a. Waiter: Certainly. Our grilled mushroom pasta and tofu salad are both completely plant-based.\nb. Diner: Could you tell me if the pasta sauce contains any dairy cream?\nc. Diner: Excuse me, do you have any vegetarian dishes on the menu today?\nd. Waiter: No, the chef uses olive oil, garlic and fresh herbs, so it's dairy-free.\ne. Diner: Wonderful! I'll have the grilled mushroom pasta, please.", "o": ["c - a - b - d - e", "a - c - b - d - e", "c - b - a - d - e", "c - a - d - b - e"], "a": 0, "e": "c (khách hỏi món chay) → a (nhân viên giới thiệu mì nấm nướng và salad đậu phụ) → b (khách hỏi kỹ hơn về sốt mì có kem sữa không) → d (nhân viên xác nhận dùng dầu ô liu, không sữa) → e (khách gọi món)."}, {"s": "Dear Uncle Tam,\na. My parents and I are planning to visit Hue for three days during the first week of July.\nb. Thank you so much for the lovely congratulatory card and the fountain pen you sent for my graduation.\nc. I will definitely use the pen when I start my university lectures this September.\nd. We hope we can take you and Aunt Hoa out for dinner by the Perfume River while we are there.\ne. Hearing your encouraging words made me feel much more confident about the new journey ahead.\nWith love, Minh", "o": ["e - b - c - a - d", "a - b - c - e - d", "b - c - a - d - e", "b - e - c - a - d"], "a": 3, "e": "b (cảm ơn chú Tâm tặng thiệp và bút máy) → e (lời động viên của chú giúp thêm tự tin) → c ('the pen': hứa sẽ dùng bút khi vào đại học) → a (kế hoạch cùng bố mẹ vào Huế tháng 7) → d ('while we are there': mong mời chú thím ăn tối)."}, {"s": "a. When listeners hear a story told in a warm human voice, they often picture the scenes more vividly than when watching a screen.\nb. Despite the rise of short video platforms, audio podcasts have grown steadily in popularity among young learners.\nc. Because episodes can be downloaded in advance, commuters can learn about science, history or languages while on the bus.\nd. This combination of convenience and mental engagement explains why audio storytelling continues to thrive.\ne. Unlike video, audio leaves the eyes free and turns routine chores or travel time into productive learning moments.", "o": ["b - c - a - d - e", "e - b - c - a - d", "b - e - c - a - d", "a - b - e - c - d"], "a": 2, "e": "b (câu chủ đề: podcast ngày càng phổ biến dù video ngắn lên ngôi) → e ('Unlike video': giải phóng đôi mắt, tận dụng thời gian di chuyển) → c (tải trước để nghe trên xe buýt) → a (giọng kể kích thích trí tưởng tượng) → d ('This combination...': câu kết)."}, {"s": "a. First, turn off the main power switch before touching any person or appliance near the flooded area.\nb. Knowing basic electrical safety rules during heavy rain and flooding can save lives.\nc. If water has already entered the ground floor, move essential electronics to a higher shelf while your hands are dry.\nd. Never step into standing water if a power cord or wall socket is submerged beneath the surface.\ne. Finally, wait for a qualified electrician to inspect the wiring before switching the electricity back on.", "o": ["a - b - d - c - e", "b - a - d - c - e", "b - d - c - e - a", "b - c - a - d - e"], "a": 1, "e": "b (câu chủ đề: quy tắc an toàn điện mùa mưa lũ) → a ('First': ngắt cầu dao tổng) → d (tuyệt đối không bước vào nước ngập có ổ cắm/dây điện) → c (di chuyển thiết bị lên cao khi tay khô) → e ('Finally': chờ thợ điện kiểm tra trước khi bật lại)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Lan: Congratulations! All your hard practice over the past months really paid off.\nb. Huy: Guess what! I just won second prize in the provincial English eloquence contest.\nc. Huy: Thank you, Lan! Your feedback on my pronunciation helped me a lot.", "o": ["b - c - a", "a - b - c", "b - a - c", "c - a - b"], "a": 2, "e": "b (Huy khoe tin đạt giải Nhì hùng biện tiếng Anh) → a (Lan chúc mừng) → c (Huy cảm ơn Lan đã góp ý phát âm)."}, {"s": "a. Receptionist: Would you prefer a room facing the sea or one overlooking the quiet garden?\nb. Guest: Good afternoon. I have a reservation under the name Nguyen Thanh Tung for two nights.\nc. Guest: The garden view sounds lovely and peaceful. Does the rate include breakfast?\nd. Receptionist: Welcome, Mr Tung. I've found your booking. We can offer you a complimentary upgrade today.\ne. Receptionist: Yes, buffet breakfast is served from 6:30 to 10:00 a.m. on the ground floor.", "o": ["b - a - d - c - e", "b - d - a - c - e", "d - b - a - c - e", "b - d - c - a - e"], "a": 1, "e": "b (khách báo tên đặt phòng) → d (lễ tân chào đón và báo nâng hạng phòng) → a (lễ tân hỏi chọn hướng biển hay hướng vườn) → c (khách chọn hướng vườn và hỏi ăn sáng) → e (lễ tân xác nhận giờ buffet sáng)."}, {"s": "Dear Members of the Photography Club,\na. Please bring your camera or smartphone fully charged, along with a hat and a reusable water bottle.\nb. We are excited to announce our monthly photo walk, which will take place at Hanoi Botanical Garden this Sunday, 18 May.\nc. After the walk, we will print the ten best shots for our end-of-term school exhibition.\nd. Our theme this month is 'Morning Light and Urban Nature', focusing on dew, leaves and birds.\ne. All participants should gather at the main park entrance by 6:15 a.m. so we can catch the soft early sunlight.\nBest wishes, Club President", "o": ["b - d - e - a - c", "d - b - e - a - c", "b - e - a - d - c", "a - b - d - e - c"], "a": 0, "e": "b (thông báo buổi dạo chụp ảnh tại Bách Thảo) → d ('Our theme this month': chủ đề Ánh nắng sớm và Thiên nhiên đô thị) → e (giờ tập trung 6:15 sáng để đón nắng sớm) → a (dặn chuẩn bị máy ảnh, mũ, bình nước) → c ('After the walk': chọn 10 bức đẹp nhất triển lãm)."}, {"s": "a. When artisanal villages combine traditional craftsmanship with modern eco-friendly packaging, their products appeal to global buyers.\nb. Across Vietnam, centuries-old craft villages produce bamboo baskets, silk scarves and hand-painted ceramics.\nc. Online marketplaces now allow weavers and potters to sell directly to customers overseas without relying solely on middlemen.\nd. As a result, young artisans can earn a stable income in their hometowns while keeping ancestral skills alive.\ne. For many years, however, artisans struggled to compete with cheap mass-produced plastic goods.", "o": ["b - e - c - d - a", "e - b - a - c - d", "b - a - e - c - d", "b - e - a - c - d"], "a": 3, "e": "b (giới thiệu làng nghề truyền thống Việt Nam) → e ('For many years, however': khó khăn cạnh tranh với đồ nhựa giá rẻ) → a (đổi mới mẫu mã, bao bì sinh thái) → c (kết hợp sàn thương mại điện tử) → d ('As a result': nghệ nhân trẻ có thu nhập ổn định và giữ nghề)."}, {"s": "a. Studies show that students who sleep fewer than six hours before an exam perform worse on problem-solving tasks.\nb. During deep sleep, the brain consolidates newly learned information and transfers it from short-term to long-term memory.\nc. Staying up all night before a big test is a habit many students mistakenly believe will boost their grades.\nd. Getting a full night's rest after a focused evening review is therefore far more effective than cramming until dawn.\ne. Fatigue also slows reaction time and makes it easy to misread simple instructions on the question paper.", "o": ["c - a - b - d - e", "b - c - a - e - d", "c - b - a - e - d", "d - c - b - a - e"], "a": 2, "e": "c (thói quen thức trắng đêm ôn thi) → b (vai trò của giấc ngủ sâu trong việc củng cố trí nhớ) → a (nghiên cứu chỉ ra ngủ dưới 6 tiếng làm giảm khả năng giải quyết vấn đề) → e ('also': mệt mỏi khiến đọc nhầm đề) → d ('therefore': ngủ đủ giấc hiệu quả hơn học nhồi nhét)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Coach: Don't worry, start with ten minutes of slow jogging and stretch carefully beforehand.\nb. Student: Coach, I'd like to join the 5km fun run, but I haven't trained much recently.\nc. Student: Thanks, Coach! I'll start practising this afternoon.", "o": ["c - a - b", "a - b - c", "b - c - a", "b - a - c"], "a": 3, "e": "b (học sinh muốn tham gia chạy 5km nhưng lo chưa tập nhiều) → a (huấn luyện viên khuyên khởi đầu 10 phút chạy chậm và giãn cơ) → c (học sinh cảm ơn)."}, {"s": "a. Trang: Have you tried the new bike-sharing station outside the city library?\nb. Kiên: Yes, I rode one home yesterday. You just scan the QR code on the handlebar to unlock it.\nc. Trang: How much does it cost for a thirty-minute ride?\nd. Kiên: Only five thousand dong, and the first fifteen minutes are free for students.\ne. Trang: That's cheaper than a bus ticket! I'll register for an account today.", "o": ["b - a - c - d - e", "a - c - b - d - e", "a - b - c - d - e", "a - b - d - c - e"], "a": 2, "e": "a (Trang hỏi về trạm xe đạp công cộng) → b (Kiên kể đã đi hôm qua và cách mở khóa QR) → c (Trang hỏi giá 30 phút) → d (Kiên báo giá 5.000đ) → e (Trang khen rẻ và sẽ đăng ký)."}, {"s": "Dear Ms Huong,\na. Would it be possible for my group to submit the slides on Thursday morning instead?\nb. I am writing on behalf of Group 3 regarding our geography presentation scheduled for this week.\nc. Unfortunately, two members of our team came down with flu yesterday and have not been able to record their parts.\nd. We have already completed the research data and maps, and we only need one extra day to finalise the slides.\ne. We sincerely apologise for any inconvenience and appreciate your understanding.\nYours sincerely, Nguyen Hoang Long", "o": ["c - b - d - a - e", "b - c - d - a - e", "b - a - c - d - e", "b - c - a - e - d"], "a": 1, "e": "b (thay mặt Nhóm 3 viết thư về bài thuyết trình Địa lý) → c (lý do: 2 thành viên bị cúm) → d (đã xong dữ liệu và bản đồ, chỉ cần thêm 1 ngày) → a (xin phép nộp slide sáng thứ Năm) → e (xin lỗi và cảm ơn cô)."}, {"s": "a. Trees planted along sidewalks and canals absorb carbon dioxide while filtering fine dust from vehicle exhaust.\nb. As urban populations expand, pocket parks and green corridors have become essential for livable cities.\nc. Even a small corner park with benches and shade trees gives office workers and seniors a place to recharge.\nd. City planners now recognise that green space is not a luxury decoration, but critical public health infrastructure.\ne. Furthermore, permeable soil in parks absorbs heavy rainfall and reduces flash flooding on nearby streets.", "o": ["b - a - e - c - d", "a - b - c - e - d", "b - c - a - d - e", "d - b - a - e - c"], "a": 0, "e": "b (công viên nhỏ và hành lang xanh rất cần thiết khi đô thị mở rộng) → a (cây xanh hấp thụ CO2 và lọc bụi mịn) → e ('Furthermore': đất công viên thấm nước mưa giảm ngập) → c (giá trị nghỉ ngơi cho người dân) → d (kết luận: hạ tầng y tế công cộng thiết yếu)."}, {"s": "a. At first, many stallholders hesitated because they feared fabric bags would cost more than thin plastic ones.\nb. Two years ago, Hoi An launched a campaign to reduce single-use plastic bags at its central market.\nc. Youth volunteers visited every stall to explain the programme and distributed free woven reed baskets to shoppers.\nd. Today, the market is noticeably cleaner, and visitors praise the town for preserving both its heritage and environment.\ne. Within six months, over eighty percent of vendors had switched to paper wrappers, banana leaves and reusable bags.", "o": ["b - e - c - a - d", "a - b - c - e - d", "b - c - a - d - e", "b - a - c - e - d"], "a": 3, "e": "b (2 năm trước Hội An phát động giảm túi nilon ở chợ) → a ('At first': tiểu thương ngần ngại vì sợ tốn chi phí) → c (tình nguyện viên giải thích và phát giỏ cói) → e ('Within six months': hơn 80% chuyển sang lá chuối, túi giấy) → d ('Today': chợ sạch đẹp, được du khách khen ngợi)."}]}]}, {"lv": 2, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Technician: Let me check the power cable first. Oh, the plug is slightly loose.\nb. Teacher: Excuse me, the projector in Room 204 isn't turning on.\nc. Teacher: How silly of me! Thank you for coming so quickly.", "o": ["b - a - c", "a - b - c", "b - c - a", "c - a - b"], "a": 0, "e": "b (giáo viên báo máy chiếu phòng 204 không lên) → a (kỹ thuật viên kiểm tra thấy phích cắm lỏng) → c (giáo viên cảm ơn)."}, {"s": "a. Linh: I'm thinking of buying a gift for my grandmother's seventieth birthday. Any suggestions?\nb. Nam: Does she enjoy gardening or reading in the morning?\nc. Linh: She loves tending her orchid pots on the veranda every morning.\nd. Nam: Then a lightweight watering can and a pair of soft gardening gloves would be thoughtful.\ne. Linh: That's spot on! She mentioned last week that her old watering can was too heavy.", "o": ["a - b - d - c - e", "a - c - b - d - e", "b - a - c - d - e", "a - b - c - d - e"], "a": 3, "e": "a (Linh xin gợi ý quà mừng thọ bà) → b (Nam hỏi sở thích của bà) → c (Linh kể bà thích chăm hoa lan) → d (Nam gợi ý bình tưới nhẹ và găng tay làm vườn) → e (Linh khen chuẩn ý)."}, {"s": "Dear Green Club Members,\na. Each class is invited to design one poster using recycled cardboard, old magazines or dried leaves.\nb. To celebrate World Environment Day on 5 June, our club is organising an eco-poster exhibition in the main lobby.\nc. The three most creative posters will receive book vouchers and be displayed in the school library all year.\nd. All entries must be submitted to the Youth Union office no later than 5 p.m. on 1 June.\ne. Through this activity, we hope to inspire practical habits for saving water and electricity at school.\nWarm regards, Green Club Committee", "o": ["b - a - d - c - e", "a - b - e - d - c", "b - e - a - d - c", "e - b - a - d - c"], "a": 2, "e": "b (thông báo triển lãm poster nhân Ngày Môi trường Thế giới) → e ('Through this activity': mục đích truyền cảm hứng tiết kiệm điện nước) → a (thể lệ thiết kế bằng vật liệu tái chế) → d (hạn nộp 1/6) → c (giải thưởng cho 3 poster sáng tạo nhất)."}, {"s": "a. When we write by hand, the brain must plan each letter stroke and summarise key ideas on the spot.\nb. Typing notes on a laptop allows students to record almost every word a lecturer says.\nc. Psychologists have found that students who take handwritten notes often understand conceptual questions better.\nd. Consequently, the slower speed of handwriting actually forces deeper mental processing.\ne. In contrast, rapid typing can easily turn into mindless transcription without real comprehension.", "o": ["c - b - e - a - d", "b - e - c - a - d", "b - c - a - e - d", "a - b - e - c - d"], "a": 1, "e": "b (gõ phím giúp chép gần như từng lời giảng) → e ('In contrast': gõ nhanh dễ thành chép máy móc không hiểu sâu) → c (nghiên cứu tâm lý: viết tay hiểu câu hỏi khái niệm tốt hơn) → a (giải thích cơ chế não bộ khi viết tay) → d ('Consequently': tốc độ chậm hơn lại giúp xử lý sâu hơn)."}, {"s": "a. Visitors can rent bamboo bicycles to pedal quietly along the rice paddies and stilt-house lanes.\nb. Nestled in a lush valley in Hoa Binh province, Mai Chau has become a model for community-based eco-tourism.\nc. Instead of building concrete high-rise hotels, local Thai families welcome guests into traditional wooden homestays.\nd. In the evening, hosts serve home-grown sticky rice in bamboo tubes and perform traditional xoe dances.\ne. This approach preserves local architecture and ensures that tourism revenue stays directly with village households.", "o": ["b - c - a - d - e", "c - b - a - d - e", "b - a - c - e - d", "a - b - c - d - e"], "a": 0, "e": "b (giới thiệu Mai Châu là hình mẫu du lịch sinh thái cộng đồng) → c (ở nhà sàn gỗ truyền thống thay vì khách sạn bê tông) → a (ban ngày đạp xe tre qua cánh đồng lúa) → d ('In the evening': thưởng thức cơm lam và múa xòe) → e ('This approach': bảo tồn kiến trúc và giữ nguồn thu cho dân bản)."}]}]}, {"lv": 3, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Security guard: Visitors need to sign in at the gate and wear a visitor badge, please.\nb. Parent: Good morning, I have an appointment with Ms Hoa, the form teacher of Class 12A1.\nc. Parent: Certainly. Here is my ID card.", "o": ["a - b - c", "b - a - c", "b - c - a", "c - a - b"], "a": 1, "e": "b (phụ huynh báo có hẹn với cô Hoa chủ nhiệm 12A1) → a (bảo vệ hướng dẫn ký sổ và đeo thẻ khách) → c (phụ huynh đồng ý và đưa CCCD)."}, {"s": "a. Hà: I'm worried about the group interview for the youth leadership camp next Saturday.\nb. Quân: They usually care more about how you listen to teammates than who talks the loudest.\nc. Hà: Really? I thought I had to speak first on every question to stand out.\nd. Quân: Not at all. Building on someone else's idea politely shows real teamwork.\ne. Hà: That makes me feel much less pressured. Thanks for the tip, Quân!", "o": ["a - b - c - d - e", "a - c - b - d - e", "b - a - c - d - e", "a - b - d - c - e"], "a": 0, "e": "a (Hà lo lắng về buổi phỏng vấn nhóm) → b (Quân chia sẻ giám khảo chú trọng kỹ năng lắng nghe) → c (Hà ngạc nhiên vì tưởng phải giành nói trước) → d (Quân giải thích cách phát triển ý của bạn cùng nhóm) → e (Hà thấy nhẹ nhõm và cảm ơn)."}, {"s": "Dear Dr Hoang,\na. Many students in our school struggle with exam anxiety and irregular sleep during the final semester.\nb. On behalf of the Student Counseling Club at Chu Van An High School, I am writing to invite you to give a talk on stress management.\nc. The workshop is planned for Saturday, 24 May, from 8:30 to 10:30 a.m. in our main auditorium.\nd. We believe your practical advice as a clinical psychologist would be invaluable to our twelfth graders.\ne. Please let us know if this date suits your schedule, or suggest an alternative morning that works for you.\nYours sincerely, Tran Thanh Mai", "o": ["d - b - a - c - e", "a - b - d - c - e", "b - c - a - d - e", "b - a - d - c - e"], "a": 3, "e": "b (thư mời TS Hoàng nói chuyện về quản lý căng thẳng) → a (nêu thực trạng học sinh lo âu mùa thi) → d (tin rằng lời khuyên của bác sĩ rất quý giá cho khối 12) → c (thời gian và địa điểm dự kiến) → e (mong bác sĩ phản hồi lịch phù hợp)."}, {"s": "a. When we check our bank balance or send an email over public Wi-Fi, hackers on the same network may intercept unencrypted data.\nb. Free wireless networks in cafés, airports and shopping malls offer undeniable convenience for travellers.\nc. Enabling two-factor authentication on important accounts provides an extra layer of defence even if a password is leaked.\nd. Cyber-security experts therefore advise users to avoid logging into banking apps over open public networks.\ne. Behind that convenience, however, lies a serious risk to personal privacy and financial security.", "o": ["b - a - e - c - d", "e - b - a - d - c", "b - e - a - d - c", "b - e - d - a - c"], "a": 2, "e": "b (Wi-Fi miễn phí ở quán cà phê, sân bay rất tiện lợi) → e ('Behind that convenience, however': ẩn chứa rủi ro bảo mật) → a (cụ thể: tin tặc có thể chặn dữ liệu chưa mã hóa) → d ('therefore': chuyên gia khuyên tránh đăng nhập ngân hàng trên mạng mở) → c (bật xác thực 2 yếu tố để tăng bảo vệ)."}, {"s": "a. Next, hold the burned area under cool, gently running tap water for at least fifteen to twenty minutes.\nb. First-aid knowledge for minor kitchen burns can prevent infection and reduce scarring.\nc. Never apply toothpaste, butter or ice directly to a burn, as these home remedies trap heat and damage delicate tissue.\nd. First, move the injured person away from the heat source and carefully remove any rings or watches before swelling starts.\ne. Once the skin has cooled, cover it loosely with a sterile non-stick bandage and seek medical help if blisters are large.", "o": ["d - b - a - c - e", "b - d - a - c - e", "b - a - d - c - e", "b - d - c - a - e"], "a": 1, "e": "b (câu chủ đề: kiến thức sơ cứu bỏng nhẹ) → d ('First': tách khỏi nguồn nhiệt, tháo nhẫn/đồng hồ) → a ('Next': xả nước mát 15-20 phút) → c (cảnh báo không bôi kem đánh răng, bơ, đá lạnh) → e ('Once the skin has cooled': băng vô trùng nhẹ nhàng)."}]}]}, {"lv": 3, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Cashier: That will be forty-five thousand dong. Would you like a paper bag?\nb. Customer: No, thanks. I brought my own cloth bag.\nc. Customer: I'd like to pay for these two notebooks and a box of blue pens, please.", "o": ["c - b - a", "a - c - b", "c - a - b", "b - a - c"], "a": 2, "e": "c (khách tính tiền 2 quyển vở và hộp bút) → a (thu ngân báo giá 45.000đ và hỏi túi giấy) → b (khách từ chối vì đã mang túi vải)."}, {"s": "a. Dũng: Why did you choose industrial electricity at a vocational college instead of university?\nb. Hiếu: Because the programme offers 70 percent hands-on lab practice and a paid internship in the second year.\nc. Dũng: What about job prospects after you graduate?\nd. Hiếu: Manufacturing plants in our province are recruiting skilled technicians right away with competitive salaries.\ne. Dũng: That's a very clear and practical career path, Hiếu!", "o": ["a - c - b - d - e", "a - b - c - d - e", "b - a - c - d - e", "a - b - d - c - e"], "a": 1, "e": "a (Dũng hỏi lý do Hiếu chọn cao đẳng nghề điện công nghiệp) → b (Hiếu giải thích có 70% thực hành và thực tập hưởng lương) → c (Dũng hỏi triển vọng việc làm) → d (Hiếu nêu nhu cầu tuyển dụng kỹ thuật viên tại các nhà máy) → e (Dũng khen hướng đi thực tế)."}, {"s": "Dear Neighbours of Block B,\na. The maintenance team will clean the rooftop water tanks between 9:00 a.m. and 1:00 p.m. this Wednesday, 14 May.\nb. During these four hours, the tap water supply to all apartments from floor 1 to floor 15 will be temporarily shut off.\nc. We kindly advise households to store enough water on Tuesday evening for cooking and daily use.\nd. We apologise for the temporary inconvenience and thank you for your cooperation in keeping our building's water clean.\ne. Once the supply is restored at 1:00 p.m., please let your tap run for one minute if the water appears slightly cloudy.\nSincerely, Building Management Board", "o": ["a - b - c - e - d", "b - a - c - e - d", "a - c - b - d - e", "c - a - b - e - d"], "a": 0, "e": "a (thông báo lịch thau rửa bể nước mái ngày 14/5) → b ('During these four hours': tạm cắt nước tầng 1-15) → c (khuyên các hộ tích trữ nước tối thứ Ba) → e ('Once the supply is restored': hướng dẫn xả vòi 1 phút khi có nước lại) → d (xin lỗi và cảm ơn cư dân)."}, {"s": "a. Instead of discarding bruised apples or day-old bread, partnered supermarkets upload discounted 'surprise bags' to a mobile app each evening.\nb. Globally, nearly one third of all food produced for human consumption is lost or wasted along the supply chain.\nc. Food-rescue apps have emerged as a clever digital bridge between local bakeries, grocers and budget-conscious consumers.\nd. Users reserve a bag on their phone and collect it thirty minutes before closing time at half the original price.\ne. The model creates a win-win outcome: shops recover costs, families save money, and edible food stays out of landfill.", "o": ["a - c - d - b - e", "c - b - a - d - e", "b - a - c - e - d", "b - c - a - d - e"], "a": 3, "e": "b (thực trạng 1/3 lương thực toàn cầu bị lãng phí) → c (ứng dụng giải cứu thực phẩm ra đời làm cầu nối) → a (siêu thị đăng các túi thực phẩm giảm giá cuối ngày) → d (người dùng đặt trên điện thoại và nhận trước giờ đóng cửa) → e ('The model creates a win-win outcome': kết luận lợi ích 3 bên)."}, {"s": "a. First, verify whether the story appears on reputable news agencies rather than relying on a single screenshot.\nb. False rumours and edited images can spread across social networks within minutes during emergencies.\nc. Before hitting the 'share' button, every internet user should pause and apply a three-step fact-checking habit.\nd. Second, check the publication date, as old photos from past events are frequently reposted out of context.\ne. Finally, ask yourself whether the headline uses extreme emotional language designed to provoke anger or fear.", "o": ["b - a - d - e - c", "c - b - a - d - e", "b - c - a - d - e", "a - d - e - b - c"], "a": 2, "e": "b (bối cảnh tin giả lan nhanh trên mạng xã hội) → c (cần áp dụng thói quen kiểm chứng 3 bước trước khi chia sẻ) → a ('First': kiểm tra nguồn báo chí chính thống) → d ('Second': kiểm tra ngày đăng) → e ('Finally': cảnh giác với tiêu đề kích động cảm xúc)."}]}]}, {"lv": 3, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Friend: Let me help you carry that box of books up to the third floor.\nb. Student: That's very kind of you! These dictionaries are heavier than they look.\nc. Friend: Anytime! Let's take the stairs on the left.", "o": ["c - b - a", "b - a - c", "a - c - b", "a - b - c"], "a": 3, "e": "a (người bạn ngỏ ý giúp bê thùng sách lên tầng 3) → b (học sinh cảm ơn vì thùng từ điển rất nặng) → c (người bạn đáp lại thân thiện)."}, {"s": "a. Thảo: Are you going to watch the folk music performance at the walking street tonight?\nb. Minh: Yes! My cousin is playing the bamboo flute in the opening piece at 7:30 p.m.\nc. Thảo: Really? Let's get there by 7:00 p.m. so we can find seats near the stage.\nd. Minh: Good idea. The street gets very crowded on Saturday nights.\ne. Thảo: Shall we meet in front of the post office at 6:45 p.m.?", "o": ["b - a - c - d - e", "a - c - b - d - e", "a - b - c - d - e", "a - b - d - c - e"], "a": 2, "e": "a (Thảo hỏi Minh có đi xem biểu diễn nhạc dân tộc tối nay không) → b (Minh nói có vì anh họ biểu diễn sáo trúc lúc 7:30) → c (Thảo rủ đến lúc 7:00 để có chỗ gần sân khấu) → d (Minh đồng tình vì tối thứ Bảy rất đông) → e (Thảo chốt hẹn 6:45 trước bưu điện)."}, {"s": "Dear Mr Lewis,\na. During the exchange week, our students were deeply touched by the warmth of the host families in Melbourne.\nb. Now that our delegation has safely returned to Hanoi, I am writing to thank you for coordinating our sister-school visit.\nc. The joint science project on river water quality also sparked lively discussions that our classes are keen to continue online.\nd. We look forward to welcoming your students and teachers to our campus in Vietnam next autumn.\ne. Please convey our heartfelt gratitude to the principal and all the teachers involved.\nWarm regards, Pham Van Khanh", "o": ["a - b - c - d - e", "b - a - c - e - d", "b - c - d - a - e", "d - b - a - c - e"], "a": 1, "e": "b (báo đoàn đã về Hà Nội an toàn và cảm ơn ông Lewis) → a (kỷ niệm ấn tượng với các gia đình bản xứ ở Melbourne) → c ('also': dự án khoa học chung về nước sông) → e (nhờ chuyển lời cảm ơn tới thầy hiệu trưởng và giáo viên) → d (mong đón đoàn trường bạn sang Việt Nam mùa thu tới)."}, {"s": "a. When cities replace asphalt parking lots with shaded plazas and wide pavements, local shops often see more foot traffic, not less.\nb. For decades, urban streets were widened primarily to move as many private cars as possible.\nc. Pedestrians who walk or cycle at a leisurely pace are far more likely to stop for a coffee or browse a bookshop than drivers rushing past.\nd. Today, however, many mayors are reclaiming central avenues for pedestrians, cyclists and outdoor cafés.\ne. Designing streets for people rather than cars therefore strengthens both community life and local small businesses.", "o": ["b - d - a - c - e", "d - b - a - c - e", "b - a - d - e - c", "a - c - b - d - e"], "a": 0, "e": "b (nhiều thập kỷ trước đường phố mở rộng ưu tiên ô tô) → d ('Today, however': nhiều thành phố dành lại phố trung tâm cho người đi bộ, xe đạp) → a (thay bãi đỗ xe bằng quảng trường rợp bóng cây giúp cửa hàng đông khách hơn) → c (giải thích: người đi bộ/xe đạp dễ ghé quán hơn người lái xe) → e ('therefore': kết luận)."}, {"s": "a. Because salt water conducts electricity and corrodes metal, technicians must seal every joint against harsh ocean storms.\nb. Offshore wind farms are emerging as a powerful source of clean energy for countries with long coastlines.\nc. Out at sea, winds blow more strongly and steadily than on land, allowing giant turbines to generate electricity day and night.\nd. Despite these engineering challenges, falling technology costs have made offshore wind increasingly competitive with fossil fuels.\ne. Installing turbines miles from the shore, however, requires specialized vessels and deep underwater foundations.", "o": ["a - e - b - c - d", "c - b - e - a - d", "b - e - c - d - a", "b - c - e - a - d"], "a": 3, "e": "b (điện gió ngoài khơi nổi lên như nguồn năng lượng sạch) → c (lợi thế gió ngoài khơi mạnh và đều hơn trên đất liền) → e ('however': thách thức lắp đặt xa bờ) → a (chi tiết kỹ thuật chống ăn mòn nước mặn) → d ('Despite these engineering challenges': chi phí giảm giúp cạnh tranh tốt)."}]}]}, {"lv": 3, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Bus driver: Yes, this bus stops right in front of the National Library. Hop on!\nb. Student: Excuse me, does Bus 32 go past the National Library?\nc. Student: Thank you! Here is my bus pass.", "o": ["b - a - c", "a - b - c", "b - c - a", "c - a - b"], "a": 0, "e": "b (học sinh hỏi xe buýt 32 có qua Thư viện Quốc gia không) → a (tài xế xác nhận dừng ngay trước cổng) → c (học sinh cảm ơn và xuất trình thẻ xe buýt)."}, {"s": "a. Ngọc: Did you notice the new water refill stations installed on each floor of our school?\nb. Lâm: Yes! I stopped buying bottled water this week and just bring my stainless-steel flask.\nc. Ngọc: How many plastic bottles do you think our school will save each month?\nd. Lâm: The Youth Union estimated around ten thousand bottles if half the students use the stations.\ne. Ngọc: That's incredible. I'll remind our classmates to bring their own bottles tomorrow.", "o": ["a - b - d - c - e", "a - c - b - d - e", "b - a - c - d - e", "a - b - c - d - e"], "a": 3, "e": "a (Ngọc hỏi về trạm tiếp nước uống mới lắp ở các tầng) → b (Lâm nói đã ngừng mua nước đóng chai và mang bình cá nhân) → c (Ngọc hỏi ước tính số chai nhựa tiết kiệm mỗi tháng) → d (Lâm nêu con số 10.000 chai) → e (Ngọc ấn tượng và sẽ nhắc cả lớp)."}, {"s": "Dear Ms Tuyet,\na. Under your supervision, I learned how to catalogue books, assist young readers and organise weekend storytelling sessions.\nb. I am writing to ask if you would kindly act as a referee for my university scholarship application.\nc. The scholarship committee requires a short online evaluation form to be submitted before 20 June.\nd. Having volunteered at the district library for the past eighteen months, I feel you know my work ethic well.\ne. I would be happy to send you my updated CV and personal statement for reference.\nYours sincerely, Doan Minh Anh", "o": ["b - c - a - d - e", "d - b - a - c - e", "b - d - a - c - e", "a - d - b - c - e"], "a": 2, "e": "b (mục đích thư: xin cô Tuyết làm người giới thiệu cho hồ sơ học bổng) → d (lý do: đã làm tình nguyện viên thư viện 18 tháng) → a ('Under your supervision': những kỹ năng đã học được dưới sự hướng dẫn của cô) → c (thông tin biểu mẫu trực tuyến hạn 20/6) → e (sẵn sàng gửi CV và bài luận)."}, {"s": "a. Instead of following a fixed textbook pace, adaptive software identifies which grammar points a student finds tricky and offers targeted exercises.\nb. Artificial intelligence is beginning to support classroom teachers by personalising homework and practice tasks.\nc. Meanwhile, teachers save hours of routine grading and can devote more attention to speaking activities and emotional support.\nd. Used wisely, digital tools do not replace human educators; rather, they free teachers to do what machines cannot.\ne. Students who master a topic quickly can move ahead to creative projects without feeling bored.", "o": ["a - b - e - c - d", "b - a - e - c - d", "b - c - a - d - e", "d - b - a - e - c"], "a": 1, "e": "b (AI bắt đầu hỗ trợ giáo viên cá nhân hóa bài tập) → a (phần mềm thích ứng nhận diện điểm ngữ pháp yếu để giao bài phù hợp) → e (học sinh nắm bài nhanh có thể chuyển sang dự án sáng tạo) → c ('Meanwhile': giáo viên tiết kiệm thời gian chấm bài) → d (kết luận: công cụ số giải phóng giáo viên thay vì thay thế họ)."}, {"s": "a. When earthworms tunnel through the soil, they create tiny air channels that help plant roots breathe and absorb rainwater.\nb. Healthy soil is far more than lifeless dirt; a single teaspoon of garden earth contains millions of beneficial microorganisms.\nc. Excessive use of chemical fertilizers, however, can acidify the ground and wipe out these underground helpers.\nd. Adding composted leaves and rotating crops each season restores organic matter and keeps the soil fertile for decades.\ne. Fungi and bacteria break down fallen leaves into nutrients that crops need to grow strong and resist disease.", "o": ["b - e - a - c - d", "e - b - a - c - d", "b - c - e - a - d", "a - b - e - c - d"], "a": 0, "e": "b (đất khỏe mạnh chứa hàng triệu vi sinh vật có lợi) → e (nấm và vi khuẩn phân hủy lá rụng thành chất dinh dưỡng) → a (giun đất tạo khe thoáng khí và giữ nước mưa) → c ('however': lạm dụng phân hóa học làm hại hệ sinh vật đất) → d (giải pháp bón phân hữu cơ và luân canh)."}]}]}, {"lv": 3, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Clerk: Would you like to send it by standard mail or express delivery?\nb. Customer: Express delivery, please. It needs to arrive in Ho Chi Minh City by tomorrow afternoon.\nc. Customer: Good morning, I'd like to send this document envelope to Ho Chi Minh City.", "o": ["a - c - b", "c - a - b", "c - b - a", "b - a - c"], "a": 1, "e": "c (khách muốn gửi phong bì tài liệu đi TP.HCM) → a (nhân viên bưu điện hỏi gửi thường hay chuyển phát nhanh) → b (khách chọn chuyển phát nhanh)."}, {"s": "a. Mai: Why are you carrying a cloth fan and a bamboo cup to the rehearsal, Lan?\nb. Lan: Our drama club decided to make this year's school play a zero-waste production.\nc. Mai: What about the stage costumes and props? Don't those require buying new materials?\nd. Lan: We borrowed vintage clothes from our grandparents and painted old cardboard boxes for the castle walls.\ne. Mai: That's so resourceful! I can't wait to see the show on Friday.", "o": ["a - b - c - d - e", "a - c - b - d - e", "b - a - c - d - e", "a - b - d - c - e"], "a": 0, "e": "a (Mai hỏi sao Lan mang quạt vải và cốc tre đi tập kịch) → b (Lan kể CLB kịch làm vở diễn không rác thải) → c (Mai hỏi về trang phục và đạo cụ sân khấu) → d (Lan kể mượn đồ cũ của ông bà và vẽ bìa các-tông) → e (Mai khen sáng tạo)."}, {"s": "Dear Minh,\na. My aunt gave us four tickets to the National Symphony Orchestra's outdoor concert at Hoan Kiem Lake this Saturday evening.\nb. The orchestra will perform famous film soundtracks arranged for strings, flutes and percussion.\nc. Since I know how much you love film music, I immediately thought of inviting you to join us.\nd. The concert starts at 8:00 p.m., so let's meet by the fountain at 7:30 p.m. to get good seats.\ne. Let me know by Friday noon if you can make it!\nBest, Khôi", "o": ["b - a - c - d - e", "c - a - b - d - e", "a - c - d - b - e", "a - b - c - d - e"], "a": 3, "e": "a (cô của Khôi tặng 4 vé hòa nhạc ngoài trời tối thứ Bảy) → b (dàn nhạc sẽ chơi nhạc phim nổi tiếng) → c ('Since I know how much you love film music': nghĩ ngay tới việc mời Minh) → d (giờ bắt đầu 8:00 tối, hẹn gặp 7:30 ở đài phun nước) → e (nhắc Minh báo lại trước trưa thứ Sáu)."}, {"s": "a. When young people cook with their grandparents, they inherit not only family recipes but also stories of how previous generations overcame hardship.\nb. In many modern households, busy schedules have replaced shared family cooking with quick takeaway meals.\nc. A simple dish like braised fish or sour soup often carries regional memories that no commercial restaurant can replicate.\nd. Recording these traditional recipes in a family notebook is a meaningful way to preserve cultural identity at home.\ne. Food anthropologists point out that the kitchen has historically been the main classroom for passing down local culture.", "o": ["b - a - c - e - d", "e - b - a - c - d", "b - e - a - c - d", "c - b - e - a - d"], "a": 2, "e": "b (lịch trình bận rộn khiến nhiều gia đình gọi đồ ăn nhanh thay vì nấu nướng cùng nhau) → e (nhà nhân học ẩm thực chỉ ra căn bếp là nơi truyền dạy văn hóa) → a (nấu ăn cùng ông bà giúp thừa hưởng cả công thức lẫn câu chuyện gia đình) → c (món ăn giản dị mang ký ức vùng miền) → d (ghi lại công thức vào sổ tay gia đình để giữ gìn bản sắc)."}, {"s": "a. When the tide rises and falls twice a day, underwater turbines spin and generate a steady stream of electricity.\nb. Unlike solar and wind power, which depend on sunny skies or breezy weather, ocean tides follow the predictable pull of the moon.\nc. Engineers can therefore forecast exactly how much power a tidal station will produce months or even years in advance.\nd. Although high construction costs currently limit tidal projects to a few coastal straits, durable composite blades are lowering maintenance expenses.\ne. This reliability makes tidal energy an attractive partner for balancing renewable power grids.", "o": ["a - b - c - e - d", "b - a - c - e - d", "b - c - a - d - e", "e - b - a - c - d"], "a": 1, "e": "b (khác với điện mặt trời và gió, thủy triều tuân theo lực hút mặt trăng có thể dự báo) → a (cơ chế tua-bin ngầm quay khi thủy triều lên xuống) → c ('therefore': kỹ sư dự báo chính xác sản lượng điện trước hàng tháng/năm) → e ('This reliability': giúp cân bằng lưới điện tái tạo) → d (dù chi phí xây dựng còn cao, vật liệu mới đang giúp giảm phí bảo trì)."}]}]}, {"lv": 3, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Instructor: Keep your back straight and look forward, not down at the pedals.\nb. Learner: Like this? Oh, it feels much easier to balance now!\nc. Learner: Why do I keep wobbling whenever I turn the handlebars?", "o": ["c - b - a", "a - c - b", "c - a - b", "b - a - c"], "a": 2, "e": "c (người tập hỏi sao cứ bị loạng choạng khi bẻ lái) → a (người hướng dẫn dặn giữ thẳng lưng và nhìn về phía trước) → b (người tập làm theo và thấy giữ thăng bằng dễ hơn)."}, {"s": "a. Phương: I'd like to improve my English listening skills this summer, but movies without subtitles are still too fast for me.\nb. Hải: Have you tried listening to six-minute graded news podcasts first?\nc. Phương: Not yet. Do they come with transcripts so I can check unfamiliar words?\nd. Hải: Yes, and you can slow the audio speed to 0.8x on the first listen, then play it at normal speed.\ne. Phương: That sounds much more manageable. Could you send me the link tonight?", "o": ["a - c - b - d - e", "a - b - c - d - e", "b - a - c - d - e", "a - b - d - c - e"], "a": 1, "e": "a (Phương muốn luyện nghe nhưng xem phim không phụ đề còn quá nhanh) → b (Hải gợi ý nghe podcast tin tức 6 phút phân cấp) → c (Phương hỏi có kèm lời thoại transcript không) → d (Hải xác nhận có và chỉ mẹo chỉnh tốc độ 0.8x) → e (Phương thấy hợp lý và xin link)."}, {"s": "Dear Volunteers,\na. On Saturday morning, we will repaint the reading room walls and assemble four new wooden bookshelves.\nb. Thank you for signing up for our 'Bright Classrooms' trip to Ban Mai Primary School this weekend.\nc. The coach will depart promptly at 6:00 a.m. from the Youth Cultural House, so please arrive fifteen minutes early.\nd. Since we will be working with paint and tools, please wear comfortable old clothes and closed-toe shoes.\ne. We look forward to a rewarding weekend of teamwork and community service with all of you.\nWarm regards, Project Coordinator", "o": ["b - c - a - d - e", "a - b - c - d - e", "b - a - d - c - e", "c - b - a - d - e"], "a": 0, "e": "b (cảm ơn tình nguyện viên đăng ký chuyến đi 'Lớp học Tươi sáng') → c (giờ xe khởi hành 6:00 sáng) → a (công việc sáng thứ Bảy: sơn phòng đọc và lắp 4 kệ sách) → d ('Since we will be working with paint and tools': dặn mặc đồ cũ và giày kín mũi) → e (lời chúc cuối thư)."}, {"s": "a. When athletes visualise executing a jump or a penalty kick in vivid detail, the same motor pathways in the brain fire as during physical movement.\nb. Mental rehearsal has become a standard part of training for Olympic competitors and concert musicians alike.\nc. Combined with physical practice, guided imagery builds confidence and helps performers stay calm under intense pressure.\nd. Of course, imagining success in an armchair can never substitute for hours of disciplined training on the field.\ne. Neuroscientists have discovered that the brain does not fully separate vividly imagined actions from real ones.", "o": ["d - b - e - a - c", "e - b - a - c - d", "b - a - e - c - d", "b - e - a - d - c"], "a": 3, "e": "b (tập luyện trong tâm trí là phần chuẩn mực của VĐV Olympic và nghệ sĩ) → e (nhà thần kinh học khám phá não bộ phản ứng tương tự với hành động tưởng tượng sống động) → a (ví dụ VĐV hình dung cú nhảy/sút phạt kích hoạt vùng vận động) → d ('Of course': không thể thay thế hoàn toàn khổ luyện thể chất) → c ('Combined with physical practice': kết hợp cả hai giúp tự tin dưới áp lực)."}, {"s": "a. Because bamboo grows back from its existing root system after harvesting, farmers do not need to replant it every year.\nb. Reaching full height in just three to five years, bamboo is one of the fastest-growing renewable plants on Earth.\nc. Its dense underground roots also bind hillside soil tightly, preventing landslides during heavy tropical rains.\nd. Architects and engineers are therefore turning to treated bamboo as a sustainable alternative to steel and slow-growing timber.\ne. Pound for pound, mature bamboo stems have a tensile strength comparable to mild steel while remaining light and flexible.", "o": ["b - e - a - d - c", "a - b - c - e - d", "b - a - c - e - d", "d - b - a - c - e"], "a": 2, "e": "b (tre là một trong những loài thực vật tái tạo mọc nhanh nhất) → a (tự mọc lại từ gốc sau thu hoạch mà không cần trồng lại) → c ('Its dense underground roots also': giữ đất sườn đồi chống sạt lở) → e (độ bền kéo tương đương thép nhẹ nhưng dẻo dai) → d ('therefore': kiến trúc sư chọn tre xử lý làm vật liệu bền vững)."}]}]}, {"lv": 3, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Tour guide: Please keep your ticket stub; you'll need to show it at the ancient citadel gate.\nb. Visitor: Got it. What time will our group meet back at the bus?\nc. Tour guide: We'll gather by the flagpole at 11:15 a.m. for lunch.", "o": ["c - b - a", "b - a - c", "a - c - b", "a - b - c"], "a": 3, "e": "a (hướng dẫn viên dặn giữ cuống vé để qua cổng hoàng thành) → b (du khách hỏi giờ tập trung lại ở xe) → c (hướng dẫn viên hẹn 11:15 tại cột cờ)."}, {"s": "a. Yến: Have you decided whether to take the computer science course or the graphic design workshop?\nb. Khang: I chose graphic design because I want to create posters and digital illustrations for school events.\nc. Yến: Don't you need an expensive drawing tablet to join that workshop?\nd. Khang: Not at all. The instructor said beginners can start with paper sketches and free vector software in the computer lab.\ne. Yến: Really? Count me in then—I'd love to learn poster design too!", "o": ["b - a - c - d - e", "a - c - b - d - e", "a - b - c - d - e", "a - b - d - c - e"], "a": 2, "e": "a (Yến hỏi Khang chọn khóa khoa học máy tính hay thiết kế đồ họa) → b (Khang chọn thiết kế đồ họa) → c (Yến hỏi có cần mua bảng vẽ đắt tiền không) → d (Khang giải thích chỉ cần phác thảo giấy và phần mềm miễn phí ở phòng máy) → e (Yến hào hứng xin tham gia cùng)."}, {"s": "Dear Ms. Tran,\na. Having read your recent article on youth entrepreneurship in Vietnam Investment Review, our students were deeply inspired.\nb. On behalf of the Economics Club at Le Quy Don High School, I would like to invite you to be a guest judge at our 'Green Start-up Pitch' on 25 May.\nc. Five student teams will present practical business ideas for reducing plastic waste in local markets.\nd. The event runs from 2:00 to 4:30 p.m. on Sunday afternoon, and each team will receive five minutes of feedback from the judges.\ne. We would be truly honoured by your presence and hope your schedule permits you to join us.\nYours sincerely, Vo Minh Tri", "o": ["a - b - c - d - e", "b - a - c - d - e", "b - c - d - a - e", "c - b - a - d - e"], "a": 1, "e": "b (mời bà Trần làm giám khảo cuộc thi Green Start-up Pitch) → a (lý do mời: học sinh rất ngưỡng mộ bài viết của bà về khởi nghiệp trẻ) → c (nội dung cuộc thi: 5 đội trình bày ý tưởng giảm rác nhựa) → d (thời gian từ 2:00-4:30 chiều Chủ nhật) → e (lời kết trang trọng)."}, {"s": "a. When we laugh with friends, the brain releases endorphins that relax blood vessels and reduce levels of cortisol, the primary stress hormone.\nb. Proverbs in many cultures remind us that laughter is the best medicine, and modern clinical research largely agrees.\nc. Even anticipating a funny film or a lively chat with close friends can lift mood and strengthen immune response.\nd. Making time for humour and warm social connection is therefore an essential part of preventive healthcare.\ne. Beyond these chemical changes, shared laughter builds trust and diffuses tension during difficult conversations.", "o": ["b - a - e - c - d", "a - b - e - c - d", "b - e - a - d - c", "d - b - a - e - c"], "a": 0, "e": "b (tục ngữ và nghiên cứu y học đều đồng tình tiếng cười là liều thuốc quý) → a (cơ chế sinh học: tiết endorphin, giảm hormone căng thẳng cortisol) → e ('Beyond these chemical changes': gắn kết niềm tin và xoa dịu căng thẳng xã hội) → c (ngay cả sự mong chờ cuộc trò chuyện vui cũng tăng miễn dịch) → d ('therefore': kết luận)."}, {"s": "a. To protect fragile stalactites and underground rivers, park authorities strictly cap the number of visitors allowed inside Son Doong each year.\nb. Discovered by a local resident in 1991 and fully surveyed in 2009, Son Doong in Quang Binh is the largest natural cave passage on Earth.\nc. Every expedition must carry out all waste and stay on marked trails so the cave's unique ecosystem remains untouched.\nd. Inside its vast chambers, beams of sunlight through collapsed ceilings nourish a thriving primeval jungle hundreds of metres underground.\ne. This conservation-first model ensures that the natural wonder generates sustainable livelihoods for local porters without being spoiled by mass tourism.", "o": ["a - c - b - d - e", "d - b - a - c - e", "b - a - d - c - e", "b - d - a - c - e"], "a": 3, "e": "b (giới thiệu hang Sơn Đoòng lớn nhất thế giới) → d ('Inside its vast chambers': rừng nguyên sinh dưới lòng đất nhờ hố sụt đón nắng) → a ('To protect fragile stalactites': giới hạn nghiêm ngặt số lượng khách mỗi năm) → c (quy định mang toàn bộ chất thải ra ngoài và đi đúng lối) → e ('This conservation-first model': vừa bảo tồn vừa tạo sinh kế bền vững)."}]}]}, {"lv": 3, "secs": [{"h": "Sắp xếp hội thoại, thư và đoạn văn (5 câu)", "qs": [{"s": "a. Vet: Just keep him indoors for two days and make sure he drinks plenty of clean water.\nb. Pet owner: Doctor, is there anything special I should do after my puppy's vaccination?\nc. Pet owner: Thank you, Doctor. I'll keep a close eye on him.", "o": ["b - a - c", "a - b - c", "b - c - a", "c - a - b"], "a": 0, "e": "b (chủ nuôi hỏi bác sĩ thú y cách chăm cún sau tiêm phòng) → a (bác sĩ dặn giữ trong nhà 2 ngày và uống đủ nước) → c (chủ nuôi cảm ơn)."}, {"s": "a. Bình: Why are you setting an alarm for 9:30 p.m. when you don't go to bed until 10:30?\nb. Châu: That's my 'digital sunset' alarm—when it rings, I plug my phone in the living room and stop scrolling.\nc. Bình: Doesn't it feel strange not having your phone next to your pillow?\nd. Châu: It did for the first three nights, but now I fall asleep in ten minutes and wake up much fresher.\ne. Bình: I should try that too; I always end up watching short videos until midnight.", "o": ["a - b - d - c - e", "a - c - b - d - e", "b - a - c - d - e", "a - b - c - d - e"], "a": 3, "e": "a (Bình hỏi sao Châu đặt báo thức 9:30 tối) → b (Châu giải thích đó là giờ 'hoàng hôn kỹ thuật số' để cất điện thoại ngoài phòng khách) → c (Bình hỏi không để điện thoại cạnh gối có thấy lạ không) → d (Châu kể 3 đêm đầu hơi lạ nhưng giờ ngủ rất nhanh và khỏe) → e (Bình muốn học theo)."}, {"s": "Dear Alumni Network,\na. All funds raised will go directly towards buying twenty new desktop computers for our school's coding lab.\nb. As Hoa Sen High School celebrates its fiftieth anniversary this November, we are launching the 'Digital Wings' scholarship and equipment fund.\nc. Every donor's name will be inscribed on a commemorative plaque at the entrance of the renovated computer room.\nd. Whether you graduated five years ago or forty years ago, your support will help current students gain vital digital skills.\ne. Details on how to contribute and attend the anniversary gala can be found on our official school portal.\nWith warm gratitude, Principal's Office", "o": ["b - d - c - a - e", "a - b - d - c - e", "b - a - d - c - e", "d - b - a - c - e"], "a": 2, "e": "b (nhân kỷ niệm 50 năm thành lập trường, phát động quỹ 'Digital Wings') → a ('All funds raised': mục đích mua 20 máy tính mới cho phòng thực hành lập trình) → d (kêu gọi các thế hệ cựu học sinh đồng hành) → c (ghi danh nhà hảo tâm tại phòng máy) → e (hướng dẫn xem chi tiết trên cổng thông tin trường)."}, {"s": "a. When libraries lend out sewing machines, telescopes, musical instruments and camping gear, residents can try new hobbies without buying costly items they may use only twice.\nb. Across many cities, public libraries are expanding beyond books to create 'Libraries of Things'.\nc. Sharing infrequently used equipment across a whole neighbourhood cuts manufacturing demand and keeps clutter out of small apartments.\nd. Borrowers simply reserve an item with their library card, use it for a week, and return it clean for the next neighbour.\ne. This quiet revolution turns the traditional library into a practical hub for sustainable, circular living.", "o": ["a - b - d - c - e", "b - a - d - c - e", "b - d - a - e - c", "c - b - a - d - e"], "a": 1, "e": "b (thư viện công cộng mở rộng thành 'Thư viện Đồ vật') → a (cho mượn máy khâu, kính thiên văn, nhạc cụ, lều trại) → d (quy trình mượn bằng thẻ thư viện trong 1 tuần) → c (lợi ích: giảm nhu cầu sản xuất và tiết kiệm diện tích căn hộ nhỏ) → e ('This quiet revolution': kết luận)."}, {"s": "a. Because highlands coffee trees thrive best under partial shade, planting fruit and timber trees among coffee rows cools the soil and conserves moisture.\nb. For years, intensive monoculture farming left many hillside coffee plantations vulnerable to drought and soil erosion.\nc. Fallen leaves from the shade trees also decompose into natural humus, reducing the need for synthetic fertilizers.\nd. Farmers in Dak Lak who have adopted this agroforestry model now harvest not only higher-quality coffee beans but also avocados and macadamia nuts.\ne. Diversifying crops on the same plot thus protects both the mountain ecosystem and the farmer's yearly income.", "o": ["b - a - c - d - e", "a - b - c - d - e", "b - d - a - c - e", "d - b - a - c - e"], "a": 0, "e": "b (độc canh cà phê nhiều năm khiến đất đồi dễ hạn hán và xói mòn) → a (xen canh cây ăn quả và cây gỗ che bóng giúp làm mát đất, giữ ẩm) → c ('Fallen leaves... also': lá rụng tạo mùn tự nhiên giảm phân hóa học) → d (nông dân Đắk Lắk thu hoạch cả cà phê chất lượng cao lẫn bơ, mắc-ca) → e ('thus': kết luận lợi ích kép)."}]}]}], "1": [{"lv": 2, "secs": [{"h": "Điền cụm từ / câu vào đoạn văn (5 câu)", "p": "Few industries illustrate the hidden price of convenience as clearly as fashion. When a shop window displays a shirt cheaper than a sandwich, it is tempting @1. A closer look often tells a different story. Many of the garments sold on the high street are made from synthetic fibres @2 with every wash and drift into rivers and oceans. It is hard to say whether a five-pound dress is a bargain. What is certain is that someone, somewhere, pays for it, whether the worker in the factory or the environment itself. @3.\n\nWe tend to blame shoppers, since they are the ones who hand over the money. Yet customers are constantly told that last season's colours are outdated, @4 every few weeks. Clothes that were once worn for years are now thrown away after a handful of wearings, and most of them reach landfill or an incinerator within a year. @5. It lies in garments built to last, repaired when damaged and passed on when no longer wanted.\n\nIn short, cheap clothing is not cheap at all; its price has simply been postponed. That is why buying fewer and better pieces deserves serious thought, since a bargain that is worn twice has rarely been a bargain at all.\n(Adapted from BBC News)", "qs": [{"s": "", "o": ["concluding that fashion has at last become affordable to everyone", "for us concluding that fashion has at last become affordable to everyone", "that fashion has at last become affordable to everyone to conclude", "to conclude that fashion has at last become affordable to everyone"], "a": 3, "e": "Cấu trúc It is + adj + to V: 'it is tempting to conclude that...' (thật dễ để kết luận rằng...). A dùng V-ing, B có 'for us concluding', C đặt 'to conclude' sai vị trí."}, {"s": "", "o": ["which tiny pieces break off", "their tiny pieces that break off", "whose tiny pieces break off", "tiny pieces breaking off of which"], "a": 2, "e": "'synthetic fibres whose tiny pieces break off with every wash' – whose + N chỉ sở hữu (những mảnh nhỏ của sợi tổng hợp)."}, {"s": "", "o": ["A low price tag, in other words, hides far more than it reveals", "A low price tag, in other words, reveals far more than it hides", "In other words, hides far more than a low price tag reveals it", "A low price tag, in othe
