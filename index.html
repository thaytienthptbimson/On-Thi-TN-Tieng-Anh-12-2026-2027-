airability information can shift both consumer choices and company design.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Standard screwdrivers can easily open every proprietary screw.", "Companies argue that sealed designs help make devices slimmer and more water-resistant.", "Europe has outlawed the sale of spare parts for household appliances.", "Keeping a laptop for two extra years increases its carbon footprint."], "a": 1, "e": "Thông tin đúng theo bài đọc: 'Companies argue that sealed designs help make devices slimmer and more water-resistant.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Products with low repairability scores may lose customers to more durable rivals.", "Right to Repair laws force consumers to fix circuit boards without manuals.", "Electronic waste is declining because phones now last only six months.", "Manufacturers prefer France's scoring system to be hidden."], "a": 0, "e": "Suy luận hợp lý từ toàn bài: 'Products with low repairability scores may lose customers to more durable rivals.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["How to Glue a Battery Shut", "Why Thinner Smartphones Are Always Better", "The History of Washing Machines", "Built to Last: How the Right to Repair Is Reshaping Consumer Tech"], "a": 3, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Built to Last: How the Right to Repair Is Reshaping Consumer Tech'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "For thousands of years, every human generation looked up on a clear night and saw the glowing band of the Milky Way. Today, satellite images show that more than eighty percent of the world's population lives under skies veiled by artificial glow. Unshielded streetlamps, illuminated billboards and empty office towers left lit until dawn have turned night into permanent twilight.\n\nBiologists warn that light pollution is far more than an astronomical regret; it <b>disrupts</b> ecosystems evolved over millions of years. Newly hatched sea turtles, which instinctively crawl towards the bright horizon over the ocean, are drawn inland by beachfront hotel lights and die of exhaustion. Migratory songbirds navigate by the stars, yet bright skyscrapers disorient them, causing millions of fatal collisions each autumn.\n\n<b>[I]</b> Human health pays a price as well. <b>[II]</b> Our circadian clock relies on the contrast between bright daylight and dark nights to regulate sleep, hormone release and cell repair. <b>[III]</b> Exposure to blue-rich white LED light late in the evening suppresses melatonin, making restful sleep harder to achieve. <b>[IV]</b>\n\nUnlike chemical pollution in rivers or plastic in soil, light pollution vanishes the instant a switch is flipped. By fitting streetlamps with downward shields, using warm amber bulbs and dimming unused buildings after midnight, cities can cut energy bills while restoring the night sky. When authorities adopt <b>these measures</b>, both wildlife and residents sleep better.", "qs": [{"s": "The word <b>disrupts</b> in paragraph 2 is closest in meaning to ______.", "o": ["protects", "disturbs", "creates", "celebrates"], "a": 1, "e": "disrupts = làm gián đoạn, xáo trộn = disturbs."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["over eighty percent of people live under artificially brightened night skies", "the Milky Way has disappeared from outer space", "satellite images can only be taken during the daytime", "office towers turn off all lights at 6 p.m. worldwide"], "a": 0, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'over eighty percent of people live under artificially brightened night skies'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Drawing baby sea turtles away from the ocean", "Disorienting migratory birds that navigate by the stars", "Causing birds to collide with brightly lit buildings", "Helping nocturnal insects breed twice as fast"], "a": 3, "e": "Đoạn 2 đề cập 3 ý đầu; phương án D ('Helping nocturnal insects breed twice as fast') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>Shift workers and residents whose bedroom windows face bright streetlamps are especially affected.</b>", "o": ["[II]", "[I]", "[IV]", "[III]"], "a": 2, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Blue-rich LED light helps the brain produce more melatonin at midnight.", "Artificial light at night interferes with the human body's natural biological clock and sleep.", "Humans no longer need darkness to repair cells or regulate hormones.", "Only astronomers are affected by bright streetlamps."], "a": 1, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Artificial light at night interferes with the human body's natural biological clock and sleep.'."}, {"s": "The word/phrase <b>these measures</b> in paragraph 4 refers to ______.", "o": ["shielding lamps, using warm bulbs and dimming unused buildings", "chemical pollution in rivers and plastic in soil", "beachfront hotel lights and illuminated billboards", "satellite images of the Milky Way"], "a": 0, "e": "Trong ngữ cảnh đoạn 4, <b>these measures</b> quy chiếu cho 'shielding lamps, using warm bulbs and dimming unused buildings'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Warm amber bulbs consume ten times more electricity than unshielded lamps.", "Cities must turn off all streetlamps and leave streets unsafe.", "Sea turtles can only survive if beachfront hotels are demolished.", "Light pollution is one of the easiest environmental problems to reverse with smart lighting design."], "a": 3, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Light pollution is one of the easiest environmental problems to reverse with smart lighting design.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Migratory songbirds fly only during midday sunlight.", "Light pollution remains in the air for decades after lamps are switched off.", "Baby sea turtles naturally head towards the bright horizon over the sea.", "Blue-rich white light boosts melatonin production before bed."], "a": 2, "e": "Thông tin đúng theo bài đọc: 'Baby sea turtles naturally head towards the bright horizon over the sea.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Eliminating light pollution requires centuries of soil cleanup.", "Better lamp design can simultaneously save electricity and protect wildlife.", "Cities that shield streetlamps spend more money on power.", "Circadian rhythms work independently of daylight and darkness."], "a": 1, "e": "Suy luận hợp lý từ toàn bài: 'Better lamp design can simultaneously save electricity and protect wildlife.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Reclaiming the Night: The Hidden Costs of Light Pollution and How to Fix It", "Why Sea Turtles Prefer Beachfront Hotels", "The Invention of the Electric Bulb", "How Satellites Photograph the Sun"], "a": 0, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Reclaiming the Night: The Hidden Costs of Light Pollution and How to Fix It'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Whenever a tropical downpour hits a modern metropolis, rainwater has nowhere to go. Sealed beneath kilometres of impermeable concrete, tar and tiled plazas, the ground cannot absorb the sudden deluge. Storm drains quickly overflow, turning underpasses and ground-floor shops into muddy rivers while paradoxically leaving the city's underground aquifers parched.\n\nTo break this cycle, hydrologists and urban planners are redesigning metropolises as 'sponge cities'. Instead of rushing every drop of rainwater out through concrete pipes as fast as possible, a sponge city <b>retains</b>, filters and reuses water where it falls. Permeable pavements allow rain to seep into gravel beds below, and sunken rain gardens along roadsides hold runoff during peak storms.\n\n<b>[I]</b> Restored wetlands and city lakes act as giant natural reservoirs. <b>[II]</b> During heavy monsoon storms, floodwater is channelled into these parks rather than residential streets. <b>[III]</b> Reed beds and aquatic plants naturally filter out oil and street dust, and the cleaned water can later be used to irrigate parks or flush public toilets during the dry season. <b>[IV]</b>\n\nTransforming an existing concrete city is neither quick nor cheap, and sponge features alone cannot stop catastrophic typhoons without traditional drainage tunnels. Yet cities that combine grey pipes with green infrastructure find <b>themselves</b> far more resilient to both floods and droughts.", "qs": [{"s": "The word <b>retains</b> in paragraph 2 is closest in meaning to ______.", "o": ["boils", "rejects", "keeps", "wastes"], "a": 2, "e": "retains = giữ lại, lưu giữ = keeps."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["city storm drains are always wide enough for tropical downpours", "impermeable surfaces prevent rainwater from soaking into the ground", "concrete pavements help refill underground aquifers quickly", "modern cities never experience droughts"], "a": 1, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'impermeable surfaces prevent rainwater from soaking into the ground'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Paving over all remaining city lakes with asphalt", "Building sunken rain gardens along roadsides", "Storing and reusing rainwater locally", "Using permeable pavements that let water seep through"], "a": 0, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Paving over all remaining city lakes with asphalt') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>Once the rain subsides, paths and sports fields on the higher edges of the park reopen within hours.</b>", "o": ["[IV]", "[I]", "[II]", "[III]"], "a": 3, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [III] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Public toilets in sponge cities cannot use filtered water.", "Reed beds pollute rainwater with oil and street dust.", "Urban wetlands and parks can store floodwater and purify it for later reuse.", "Parks must be permanently closed if they hold rainwater."], "a": 2, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Urban wetlands and parks can store floodwater and purify it for later reuse.'."}, {"s": "The word/phrase <b>themselves</b> in paragraph 4 refers to ______.", "o": ["traditional drainage tunnels", "cities that combine grey pipes with green infrastructure", "catastrophic typhoons", "reed beds and aquatic plants"], "a": 1, "e": "Trong ngữ cảnh đoạn 4, <b>themselves</b> quy chiếu cho 'cities that combine grey pipes with green infrastructure'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["The most effective flood defence blends natural sponge landscapes with engineered drainage.", "Sponge cities have no need for underground drainage pipes.", "Transforming an old city into a sponge city costs nothing.", "Sponge cities only help during floods, never during dry seasons."], "a": 0, "e": "Từ đoạn 4 có thể rút ra kết luận: 'The most effective flood defence blends natural sponge landscapes with engineered drainage.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Permeable pavements block water from reaching gravel beds.", "Impermeable concrete allows rainwater to recharge aquifers directly.", "Sponge cities aim to push rainwater out to sea as fast as possible.", "Aquatic plants in wetlands help remove street pollutants from stormwater."], "a": 3, "e": "Thông tin đúng theo bài đọc: 'Aquatic plants in wetlands help remove street pollutants from stormwater.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Sponge cities are designed only for cold desert climates.", "Flooding occurs only in rural villages without concrete roads.", "Green infrastructure can turn stormwater from a hazard into a useful resource.", "Grey pipes alone are sufficient to refill underground water tables."], "a": 2, "e": "Suy luận hợp lý từ toàn bài: 'Green infrastructure can turn stormwater from a hazard into a useful resource.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Why Concrete Is the Best Material for Parks", "Sponge Cities: Working with Nature to Tame Urban Floods", "The History of Underground Tunnels", "How to Predict Tropical Typhoons"], "a": 1, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Sponge Cities: Working with Nature to Tame Urban Floods'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Plastic was invented in the twentieth century as a miracle material—light, waterproof, cheap and almost indestructible. Ironically, the very durability that made plastic so useful has turned it into a planetary headache. Rather than biodegrading like wood or paper, discarded plastic breaks down under sunlight and friction into microscopic particles smaller than five millimetres, known as microplastics.\n\nScientists have now detected these <b>pervasive</b> specks in the deepest ocean trenches, Arctic snow, table salt and bottled water. Surprisingly, two of the largest everyday sources are right in our homes and streets: synthetic clothing and car tyres. Every time a polyester jacket is washed, thousands of tiny plastic fibres wash down the drain; every time a car brakes, microscopic tyre dust is swept by rain into rivers.\n\n<b>[I]</b> Researchers are still investigating what long-term effects microplastics have inside the human body. <b>[II]</b> Laboratory studies show that the tiniest particles can cross cell membranes and carry chemical additives with them. <b>[III]</b> Because everyone is exposed to microplastics daily, finding an unexposed control group for medical studies is nearly impossible. <b>[IV]</b>\n\nWaiting decades for final medical proof, however, would be unwise when practical steps can cut exposure right now. Fitting washing machines with microfibre filters, choosing natural fabrics like cotton or linen, and heating food in glass or ceramic bowls rather than plastic containers can substantially reduce the particles <b>we</b> ingest.", "qs": [{"s": "The word <b>pervasive</b> in paragraph 2 is closest in meaning to ______.", "o": ["expensive", "rare", "fragile", "widespread"], "a": 3, "e": "pervasive = lan tràn khắp nơi, phổ biến = widespread."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["microplastics are larger than five centimetres", "plastic decomposes completely within five years like paper", "plastic breaks into tiny fragments instead of biodegrading naturally", "sunlight turns plastic back into natural wood"], "a": 2, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'plastic breaks into tiny fragments instead of biodegrading naturally'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Synthetic clothes shedding fibres in washing machines", "Cooking rice in stainless-steel pots", "Plastic breaking down under sunlight and friction", "Car tyres releasing dust when braking"], "a": 1, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Cooking rice in stainless-steel pots') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>This scientific uncertainty makes it challenging to set exact safety limits, yet experts urge caution.</b>", "o": ["[IV]", "[I]", "[II]", "[III]"], "a": 0, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Microplastics cannot pass through cell membranes.", "Scientists have proved that microplastics are completely harmless to human cells.", "Half of the world's population has never been exposed to microplastics.", "Studying the health impact of microplastics is difficult, though lab findings raise concern."], "a": 3, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Studying the health impact of microplastics is difficult, though lab findings raise concern.'."}, {"s": "The word/phrase <b>we</b> in paragraph 4 refers to ______.", "o": ["laboratory scientists only", "washing machines", "human beings / consumers", "chemical additives"], "a": 2, "e": "Trong ngữ cảnh đoạn 4, <b>we</b> quy chiếu cho 'human beings / consumers'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Nothing can be done about microplastics until fifty more years of research are completed.", "Consumers and manufacturers can take sensible measures today to reduce microplastic intake.", "Heating food in plastic containers removes microplastics.", "Natural fabrics like cotton shed more plastic fibres than polyester."], "a": 1, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Consumers and manufacturers can take sensible measures today to reduce microplastic intake.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Washing synthetic garments releases thousands of microscopic fibres into wastewater.", "Microplastics have only been found in industrial cities, never in Arctic snow.", "Car tyres are made entirely of biodegradable paper.", "Glass bowls release microplastics when heated."], "a": 0, "e": "Thông tin đúng theo bài đọc: 'Washing synthetic garments releases thousands of microscopic fibres into wastewater.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Plastic was designed to dissolve in rainwater.", "Banning table salt would eliminate all microplastics from the ocean.", "Washing machines already trap one hundred percent of synthetic fibres.", "Everyday habits in laundry and kitchen storage influence how many microplastics enter our bodies and waterways."], "a": 3, "e": "Suy luận hợp lý từ toàn bài: 'Everyday habits in laundry and kitchen storage influence how many microplastics enter our bodies and waterways.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["The Invention of Car Tyres", "Why Polyester Is Stronger Than Cotton", "Invisible Fragments: Where Microplastics Come From and How to Cut Them", "Exploring the Deepest Ocean Trenches"], "a": 2, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Invisible Fragments: Where Microplastics Come From and How to Cut Them'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Almost every student knows the feeling: an important essay is due in three days, yet you suddenly feel an urgent need to tidy your bookshelf, reorganise folders on your computer or check social media. For a long time, this habit—known as procrastination—was dismissed as simple laziness or poor time-management skills. Modern psychology, however, paints a more <b>nuanced</b> picture.\n\nResearchers who study self-regulation argue that procrastination is fundamentally an emotional problem, not a scheduling one. We put off a task not because we cannot read a clock, but because the task triggers uncomfortable feelings: fear of failure, perfectionism, boredom or uncertainty about where to begin. Cleaning the desk offers instant relief from that anxiety, so the brain rewards the avoidance.\n\n<b>[I]</b> Unfortunately, the relief is short-lived. <b>[II]</b> As the deadline creeps closer, guilt and stress intensify, making the assignment look even more intimidating than before. <b>[III]</b> Harshly scolding yourself for procrastinating actually worsens this cycle, since self-criticism adds another layer of negative emotion to escape from. <b>[IV]</b>\n\nBreaking the cycle requires lowering the emotional barrier to starting. Instead of sitting down to 'write a ten-page report', commit to working for just ten minutes on a rough outline. Once <b>that tiny step</b> is taken, the brain realizes the task is survivable, and momentum often takes over naturally.", "qs": [{"s": "The word <b>nuanced</b> in paragraph 1 is closest in meaning to ______.", "o": ["subtle and detailed", "careless and rude", "outdated and false", "loud and obvious"], "a": 0, "e": "nuanced = tinh tế, có nhiều sắc thái sâu sắc = subtle and detailed."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["modern psychologists agree that procrastinators cannot read clocks", "students only procrastinate when they have no homework", "tidying a bookshelf is the best way to write an essay", "procrastination was traditionally blamed on laziness or bad scheduling"], "a": 3, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'procrastination was traditionally blamed on laziness or bad scheduling'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Fear of failing at the task", "Perfectionism", "Having too much physical energy", "Uncertainty about how to start"], "a": 2, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Having too much physical energy') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>Studies show that students who forgive themselves for delaying on the first test procrastinate less on the next one.</b>", "o": ["[I]", "[IV]", "[II]", "[III]"], "a": 1, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Procrastination creates a vicious cycle of stress that self-blame only makes worse.", "Scolding yourself harshly is the fastest way to finish an essay.", "Deadlines eliminate all feelings of guilt and anxiety.", "Avoidance brings permanent peace of mind."], "a": 0, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Procrastination creates a vicious cycle of stress that self-blame only makes worse.'."}, {"s": "The word/phrase <b>that tiny step</b> in paragraph 4 refers to ______.", "o": ["scolding yourself for delaying", "writing a ten-page report in one sitting", "tidying the bookshelf", "working for just ten minutes on a rough outline"], "a": 3, "e": "Trong ngữ cảnh đoạn 4, <b>that tiny step</b> quy chiếu cho 'working for just ten minutes on a rough outline'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Perfectionists never put off their assignments.", "Buying a more expensive planner will automatically cure procrastination.", "Managing emotions and starting with small, low-pressure steps is key to overcoming procrastination.", "Students should wait until the last hour before starting any project."], "a": 2, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Managing emotions and starting with small, low-pressure steps is key to overcoming procrastination.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Self-criticism reduces anxiety and helps students start immediately.", "Procrastination is driven by the desire to escape unpleasant emotions linked to a task.", "Tidying the desk makes the essay deadline disappear.", "Psychologists view procrastination as purely a time-management issue."], "a": 1, "e": "Thông tin đúng theo bài đọc: 'Procrastination is driven by the desire to escape unpleasant emotions linked to a task.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Making the first step of a project small and clear reduces the urge to avoid it.", "Students who aim for perfection on the first draft start the earliest.", "Negative emotions have no influence on study habits.", "Ten minutes of work is never enough to build momentum."], "a": 0, "e": "Suy luận hợp lý từ toàn bài: 'Making the first step of a project small and clear reduces the urge to avoid it.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["The Benefits of Last-Minute Cramming", "How to Organise Your Bookshelf in Ten Minutes", "Why Clocks and Calendars Do Not Work", "Why We Wait: The Emotional Roots of Procrastination and How to Start"], "a": 3, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Why We Wait: The Emotional Roots of Procrastination and How to Start'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Across the Red River Delta and central Vietnam, hundreds of villages have specialised in a single craft for centuries—from Bat Trang ceramics and Van Phuc silk to Phu Vinh bamboo weaving. For generations, skills were passed from parent to child around the courtyard kiln or loom. In the late twentieth century, however, cheap factory-made plastic and synthetic goods flooded the market, pushing many traditional workshops to the brink of <b>decline</b>.\n\nYoung villagers left for industrial zones in search of steady wages, leaving elderly artisans worried that ancestral techniques would vanish with them. Traditional middlemen also took the lion's share of profits, so weavers and potters earned very little even when their baskets or vases were sold in city boutiques.\n\n<b>[I]</b> Over the past decade, a quiet revival has taken place. <b>[II]</b> Returning university graduates have teamed up with master artisans to blend heritage techniques with contemporary minimalist design. <b>[III]</b> By telling the story behind each handmade piece on e-commerce platforms and short videos, workshops now sell directly to eco-conscious buyers in Europe, Japan and North America. <b>[IV]</b>\n\nCrucially, workshops are also opening their doors to experiential tourism, where visitors spend an afternoon shaping clay or dyeing silk with natural indigo. When travellers try a craft with <b>their</b> own hands, they gain a deep appreciation for the patience required and become ambassadors for living heritage.", "qs": [{"s": "The word <b>decline</b> in paragraph 1 is closest in meaning to ______.", "o": ["expansion", "deterioration", "celebration", "invention"], "a": 1, "e": "decline = sự suy thoái, mai một = deterioration."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["mass-produced goods once threatened the survival of traditional craft villages", "craft villages in Vietnam were founded only ten years ago", "plastic goods are handmade in traditional courtyard kilns", "every craft village produces the exact same product"], "a": 0, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'mass-produced goods once threatened the survival of traditional craft villages'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Young people leaving villages for factory jobs", "Elderly artisans fearing skills would be lost", "Middlemen taking most of the retail profit", "A shortage of clay and bamboo in Vietnam"], "a": 3, "e": "Đoạn 2 đề cập 3 ý đầu; phương án D ('A shortage of clay and bamboo in Vietnam') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>A bamboo lamp that once fetched a few dollars at a local market can now command a fair price abroad as sustainable home decor.</b>", "o": ["[II]", "[I]", "[IV]", "[III]"], "a": 2, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["University graduates refuse to return to their home villages.", "Combining modern design and digital marketing has helped craft villages reach global customers directly.", "Middlemen are still the only way for artisans to sell products.", "Foreign buyers prefer plastic goods over handmade bamboo lamps."], "a": 1, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Combining modern design and digital marketing has helped craft villages reach global customers directly.'."}, {"s": "The word/phrase <b>their</b> in paragraph 4 refers to ______.", "o": ["visitors' / travellers'", "middlemen's", "factories'", "platforms'"], "a": 0, "e": "Trong ngữ cảnh đoạn 4, <b>their</b> quy chiếu cho 'visitors' / travellers''."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Only elderly people are interested in handmade ceramics.", "Craft villages must reject the internet to remain authentic.", "Experiential tourism damages the reputation of master artisans.", "Tradition survives best when it adapts creatively to new markets and engages the public."], "a": 3, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Tradition survives best when it adapts creatively to new markets and engages the public.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Experiential tourists only watch videos and never touch clay or silk.", "Van Phuc is famous for making plastic household goods.", "Direct online sales allow artisans to keep a fairer share of the value they create.", "Traditional crafts require no patience or training."], "a": 2, "e": "Thông tin đúng theo bài đọc: 'Direct online sales allow artisans to keep a fairer share of the value they create.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Handmade goods can compete with plastic only by becoming cheaper than plastic.", "Global demand for sustainable, eco-friendly products offers an opportunity for traditional crafts.", "Young people have no role to play in preserving heritage.", "Natural indigo dye can only be used in industrial factories."], "a": 1, "e": "Suy luận hợp lý từ toàn bài: 'Global demand for sustainable, eco-friendly products offers an opportunity for traditional crafts.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Old Hands, New Markets: How Vietnam's Craft Villages Are Thriving Again", "Why Plastic Replaced Bamboo Forever", "The History of Industrial Zones", "How to Build a Ceramic Kiln"], "a": 0, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Old Hands, New Markets: How Vietnam's Craft Villages Are Thriving Again'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "A neatly mown lawn of short green grass has long been the standard ideal for city parks, schoolyards and road verges. Yet to a honeybee, bumblebee or butterfly, a closely cropped lawn is virtually a green desert: it offers neither nectar for food nor tall stems for shelter. As cities expand and countryside hedgerows shrink, insect populations have fallen at an alarming rate.\n\nThis decline matters far beyond the beauty of butterflies in spring. Roughly three quarters of the world's food crops depend, at least in part, on animal pollination to produce fruit, seeds and nuts. Without <b>industrious</b> insects moving pollen from flower to flower, harvests of apples, tomatoes, coffee and pumpkins would drop sharply, driving up food prices and narrowing human diets.\n\n<b>[I]</b> Encouragingly, cities are discovering that they can become unexpected sanctuaries for pollinators. <b>[II]</b> Instead of mowing park grass every week, municipalities from London to Seoul are leaving sunny corners unmown until late summer so native wildflowers can bloom and set seed. <b>[III]</b> Bus shelter roofs planted with sedum and thyme form 'bee corridors' that allow insects to hop from one green patch to another across busy avenues. <b>[IV]</b>\n\nAt first, some residents mistake uncut wildflower meadows for municipal neglect. When councils put up small wooden signs explaining that 'this meadow is feeding our bees' and mow a neat border around the edge, complaints quickly turn into neighbourhood pride. Caring for <b>these tiny neighbours</b> begins with rethinking what a tidy park looks like.", "qs": [{"s": "The word <b>industrious</b> in paragraph 2 is closest in meaning to ______.", "o": ["poisonous", "lazy", "hard-working", "invisible"], "a": 2, "e": "industrious = cần mẫn, chăm chỉ = hard-working."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["honeybees prefer short green grass over wildflowers", "closely mown lawns provide almost no food or shelter for pollinators", "insect populations are rising rapidly in every city", "schoolyards are the main producers of coffee beans"], "a": 1, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'closely mown lawns provide almost no food or shelter for pollinators'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Producing synthetic fertilizers in park soil", "Supporting harvests of apples, tomatoes and coffee", "Keeping human diets diverse and affordable", "Helping three quarters of food crops produce fruit and seeds"], "a": 0, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Producing synthetic fertilizers in park soil') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>Even a three-metre strip of clover and daisies along a canal bank can attract dozens of bee species within a single season.</b>", "o": ["[IV]", "[I]", "[II]", "[III]"], "a": 3, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [III] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Wildflowers can only grow in remote mountain forests.", "Cities must pave over all road verges to protect bus shelters.", "Simple changes in urban park management and green roofs can create vital habitats for pollinators.", "Mowing grass every day is the best way to help butterflies."], "a": 2, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Simple changes in urban park management and green roofs can create vital habitats for pollinators.'."}, {"s": "The word/phrase <b>these tiny neighbours</b> in paragraph 4 refers to ______.", "o": ["park maintenance trucks", "pollinating insects such as bees and butterflies", "wooden signs", "bus shelter roofs"], "a": 1, "e": "Trong ngữ cảnh đoạn 4, <b>these tiny neighbours</b> quy chiếu cho 'pollinating insects such as bees and butterflies'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Public communication and small design cues help residents support biodiversity-friendly parks.", "Residents always hate wildflowers even when their purpose is explained.", "Urban meadows require spraying chemical pesticides every week.", "Only rural farmers can help protect honeybees."], "a": 0, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Public communication and small design cues help residents support biodiversity-friendly parks.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Bee corridors on bus stops prevent insects from crossing avenues.", "A neatly mown lawn offers abundant nectar for bumblebees.", "All food crops on Earth are pollinated solely by the wind.", "Leaving park corners unmown until late summer allows native flowers to bloom and feed insects."], "a": 3, "e": "Thông tin đúng theo bài đọc: 'Leaving park corners unmown until late summer allows native flowers to bloom and feed insects.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Bees cannot fly higher than ten centimetres above the ground.", "Cutting down all city flowers will lower supermarket fruit prices.", "What looks 'messy' to human eyes can actually be a rich habitat for wildlife.", "Mowing parks less often increases fuel and labour costs."], "a": 2, "e": "Suy luận hợp lý từ toàn bài: 'What looks 'messy' to human eyes can actually be a rich habitat for wildlife.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Why Every Lawn Should Be Mown Twice a Week", "Letting Parks Bloom: How Urban Meadows Are Saving Our Pollinators", "The History of Bus Shelters in Europe", "How to Grow Coffee Indoors"], "a": 1, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Letting Parks Bloom: How Urban Meadows Are Saving Our Pollinators'."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "When people talk about urban pollution, they usually picture grey smog hanging over a highway or plastic bottles floating in a canal. Yet another form of pollution surrounds us every day, invisible and odourless: unwanted noise. From pneumatic drills and honking motorbikes to aircraft engines, chronic noise has become the background soundtrack of modern life.\n\nOur ears never truly switch off, even while we sleep. Evolved to alert our ancestors to approaching predators, the human auditory system triggers a subtle stress response whenever a loud sound occurs. Over years of exposure, traffic noise above sixty-five decibels keeps blood pressure elevated and raises the risk of heart disease. In schools located beside busy roads or flight paths, children score <b>markedly</b> lower on reading comprehension tests than peers in quiet classrooms.\n\n<b>[I]</b> The problem extends beneath the waves as well. <b>[II]</b> Sound travels four times faster in water than in air, and the rumble of cargo ships, oil exploration and sonar has filled the oceans with acoustic fog. <b>[III]</b> Whales and dolphins, which rely on echolocation clicks and songs to find mates, hunt food and navigate across dark seas, find their communication range shrunk by up to ninety percent. <b>[IV]</b>\n\nFortunately, acoustic pollution fades the moment its source is quietened. Electric buses, low-noise porous asphalt, double-glazed classroom windows and slower ship propellers near whale habitats are already proving effective. Treating quiet as a shared public resource allows both human communities and marine life to <b>recover</b>.", "qs": [{"s": "The word <b>markedly</b> in paragraph 2 is closest in meaning to ______.", "o": ["accidentally", "secretly", "hardly", "noticeably"], "a": 3, "e": "markedly = rõ rệt, đáng kể = noticeably."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["traffic noise only affects people who work at airports", "human ears completely shut down during deep sleep", "noise pollution is an invisible hazard often overlooked compared to air or plastic pollution", "modern cities are much quieter than ancient villages"], "a": 2, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'noise pollution is an invisible hazard often overlooked compared to air or plastic pollution'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Triggering stress responses even during sleep", "Improving children's ability to memorise vocabulary", "Lowering reading comprehension scores in noisy schools", "Raising blood pressure and heart disease risk"], "a": 1, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Improving children's ability to memorise vocabulary') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>In severe cases, sudden military or industrial blasts can drive disoriented whales onto shallow beaches.</b>", "o": ["[IV]", "[I]", "[II]", "[III]"], "a": 0, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Cargo ships have made the ocean quieter over the past century.", "Sound travels four times slower in water than in air.", "Whales and dolphins use eyesight rather than sound to navigate dark seas.", "Underwater noise from human shipping and industry severely disrupts marine animals that depend on sound."], "a": 3, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Underwater noise from human shipping and industry severely disrupts marine animals that depend on sound.'."}, {"s": "The word <b>recover</b> in paragraph 4 is closest in meaning to ______.", "o": ["build more highways", "produce louder engine noise", "regain health and normal functioning", "swim onto shallow beaches"], "a": 2, "e": "Trong đoạn 4, 'recover' có nghĩa là hồi phục trạng thái khỏe mạnh/bình thường ('regain health and normal functioning')."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Noise pollution lingers in the environment for hundreds of years after engines stop.", "Technical and planning solutions can significantly reduce noise on land and at sea.", "Electric buses are louder than diesel trucks.", "Double-glazed windows make classrooms noisier."], "a": 1, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Technical and planning solutions can significantly reduce noise on land and at sea.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Whales rely on sound to navigate, find food and communicate across long distances.", "Human ears stop sending signals to the brain as soon as we close our eyes.", "Children in noisy schools read faster than those in quiet schools.", "Sound cannot travel through ocean water."], "a": 0, "e": "Thông tin đúng theo bài đọc: 'Whales rely on sound to navigate, find food and communicate across long distances.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Porous asphalt is designed to make car tyres louder.", "Slowing cargo ships near whale habitats increases underwater noise.", "Reading comprehension depends only on classroom lighting, never sound.", "Switching to electric public transport benefits cities by cutting both exhaust fumes and street noise."], "a": 3, "e": "Suy luận hợp lý từ toàn bài: 'Switching to electric public transport benefits cities by cutting both exhaust fumes and street noise.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["The Invention of the Jet Engine", "Why Whales Sing Only in Summer", "The Unseen Clamour: How Noise Pollution Affects Humans and Marine Life", "How to Build a Louder Loudspeaker"], "a": 2, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'The Unseen Clamour: How Noise Pollution Affects Humans and Marine Life'."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Anyone who has spent an afternoon with a four-year-old knows that children are natural scientists, asking 'Why is the sky blue?' or 'Where do birds sleep?' dozens of times a day. Yet by the time students reach late adolescence, classroom observations show that the number of spontaneous questions drops sharply. Pressured to memorise right answers for tests, many learners begin to view admitting 'I don't know' as a sign of weakness.\n\nBrain-imaging experiments reveal why that shift is such a loss. When a person's curiosity is <b>sparked</b> by a surprising puzzle, the brain releases dopamine—the same chemical messenger linked to reward and motivation—and activity surges in the hippocampus. Intriguingly, participants not only remember the answer to the question they were curious about, but also retain incidental details they saw at the same time.\n\n<b>[I]</b> Curiosity acts like a mental magnet that prepares the brain to absorb information. <b>[II]</b> Even a dry topic becomes memorable when a teacher opens a lesson with an unexpected mystery rather than a list of definitions. <b>[III]</b> Conversely, when students are handed formulas without first wondering what problem those formulas solve, knowledge remains shallow and is quickly forgotten after the exam. <b>[IV]</b>\n\nCultivating curiosity does not require expensive laboratory equipment. It begins in classrooms and homes where thoughtful questions are praised as much as correct answers. When young people keep <b>that habit</b> alive, learning stops being a chore and becomes a lifelong adventure.", "qs": [{"s": "The word <b>sparked</b> in paragraph 2 is closest in meaning to ______.", "o": ["triggered", "extinguished", "delayed", "ignored"], "a": 0, "e": "sparked = được khơi gợi, kích hoạt = triggered."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["admitting 'I don't know' is a sign of poor intelligence", "four-year-old children never ask questions about nature", "memorising test answers makes teenagers ask more questions", "older students often ask fewer questions because they fear looking ignorant"], "a": 3, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'older students often ask fewer questions because they fear looking ignorant'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Releasing dopamine in the brain", "Increasing activity in the hippocampus", "Erasing incidental details seen at the same time", "Helping people remember the answer to the puzzle"], "a": 2, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Erasing incidental details seen at the same time') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>In other words, wondering 'why' opens the door of memory before the explanation even arrives.</b>", "o": ["[I]", "[II]", "[III]", "[IV]"], "a": 1, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [II] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Starting with a compelling question makes lessons far more memorable than presenting facts alone.", "Teachers should only give lists of definitions without examples.", "Formulas are easiest to remember when students do not know their purpose.", "Curiosity prevents students from passing exams."], "a": 0, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Starting with a compelling question makes lessons far more memorable than presenting facts alone.'."}, {"s": "The word/phrase <b>that habit</b> in paragraph 4 refers to ______.", "o": ["hiding what you do not know", "memorising definitions without understanding", "buying expensive laboratory equipment", "asking thoughtful questions and wondering why"], "a": 3, "e": "Trong ngữ cảnh đoạn 4, <b>that habit</b> quy chiếu cho 'asking thoughtful questions and wondering why'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Dopamine makes it harder for the hippocampus to store memories.", "Only four-year-olds are biologically capable of feeling curiosity.", "Encouraging questions in daily learning nurtures both deeper understanding and lifelong motivation.", "Correct answers should be banned from classrooms."], "a": 2, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Encouraging questions in daily learning nurtures both deeper understanding and lifelong motivation.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Participants in brain studies forgot everything they saw while curious.", "People remember information better when their curiosity has been aroused beforehand.", "Adolescents naturally ask more classroom questions than four-year-olds.", "Curiosity requires costly scientific instruments to develop."], "a": 1, "e": "Thông tin đúng theo bài đọc: 'People remember information better when their curiosity has been aroused beforehand.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["A teacher who welcomes students' questions is likely to foster deeper retention of the subject.", "Students learn best when they are afraid to make mistakes.", "Dopamine is released only when students are bored.", "Formulas should never be explained in science classes."], "a": 0, "e": "Suy luận hợp lý từ toàn bài: 'A teacher who welcomes students' questions is likely to foster deeper retention of the subject.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["The Chemistry of Boredom", "Why Four-Year-Olds Talk Too Much", "How to Memorise Definitions Overnight", "The Power of 'Why': How Curiosity Primes the Brain for Learning"], "a": 3, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'The Power of 'Why': How Curiosity Primes the Brain for Learning'."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "While solar panels and wind turbines capture energy from the sky above, another vast clean power source lies directly beneath our feet. A few kilometres below the Earth's crust, rock is heated by the planet's core to hundreds of degrees Celsius. Tapping this underground warmth—known as geothermal energy—has heated homes and baths in volcanic regions like Iceland, Japan and New Zealand for generations.\n\nUnlike sunshine or wind, which fluctuate with the time of day and the weather, subterranean heat is <b>constant</b> twenty-four hours a day, three hundred and sixty-five days a year. A geothermal power plant pipes hot underground water or steam to the surface to spin turbines, then injects the cooled water back deep into the rock to be reheated in a closed loop. Because the footprint on the surface is compact, farmland and forests around the plant remain largely undisturbed.\n\n<b>[I]</b> Historically, geothermal power was limited to places where hot water naturally bubbled close to the surface near tectonic fault lines. <b>[II]</b> New drilling technologies borrowed from the energy industry, however, are changing the map. <b>[III]</b> Engineers can now drill deeper into hot dry granite almost anywhere, circulate water through microscopic fractures, and harvest clean steam. <b>[IV]</b>\n\nHigh upfront drilling costs and the need to monitor minor ground vibrations carefully mean that geothermal expansion requires strict geological oversight. Yet as renewable grids seek a steady partner to back up solar and wind on calm nights, the heat beneath <b>them</b> offers one of the most reliable answers.", "qs": [{"s": "The word <b>constant</b> in paragraph 2 is closest in meaning to ______.", "o": ["unpredictable", "steady", "freezing", "temporary"], "a": 1, "e": "constant = liên tục, ổn định = steady."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["geothermal energy draws heat from deep beneath the Earth's surface", "geothermal power depends on sunny skies and strong winds", "only Iceland has hot rock beneath its crust", "underground heat disappears during the winter months"], "a": 0, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'geothermal energy draws heat from deep beneath the Earth's surface'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Operating twenty-four hours a day all year round", "Reinjecting cooled water back underground in a closed loop", "Occupying a relatively small area of land on the surface", "Consuming large quantities of coal and diesel"], "a": 3, "e": "Đoạn 2 đề cập 3 ý đầu; phương án D ('Consuming large quantities of coal and diesel') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>These enhanced geothermal systems could unlock clean baseload power for countries far from active volcanoes.</b>", "o": ["[II]", "[I]", "[IV]", "[III]"], "a": 2, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Geothermal energy can still only be used next to active volcanoes.", "Advances in deep drilling are expanding geothermal energy beyond traditional volcanic zones.", "Drilling into granite is impossible with modern tools.", "Tectonic fault lines have disappeared from the Earth."], "a": 1, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Advances in deep drilling are expanding geothermal energy beyond traditional volcanic zones.'."}, {"s": "The word/phrase <b>them</b> in paragraph 4 refers to ______.", "o": ["renewable grids", "upfront drilling costs", "active volcanoes", "calm nights"], "a": 0, "e": "Trong ngữ cảnh đoạn 4, <b>them</b> quy chiếu cho 'renewable grids'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Drilling deep wells is the cheapest form of construction.", "Geothermal plants require no geological monitoring at all.", "Solar and wind energy make geothermal power completely unnecessary at night.", "With proper geological management, geothermal energy can provide dependable round-the-clock clean power."], "a": 3, "e": "Từ đoạn 4 có thể rút ra kết luận: 'With proper geological management, geothermal energy can provide dependable round-the-clock clean power.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Subterranean heat stops flowing whenever it rains.", "Geothermal power plants must clear vast areas of forest to operate.", "Cooled water from a geothermal plant is pumped back underground to be reheated.", "Enhanced geothermal systems work only in Iceland."], "a": 2, "e": "Thông tin đúng theo bài đọc: 'Cooled water from a geothermal plant is pumped back underground to be reheated.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Geothermal energy produces more air pollution than coal plants.", "Combining geothermal plants with solar and wind can help stabilise a country's electricity supply.", "Hot dry granite cannot transfer heat to water.", "Drilling costs for geothermal wells have always been zero."], "a": 1, "e": "Suy luận hợp lý từ toàn bài: 'Combining geothermal plants with solar and wind can help stabilise a country's electricity supply.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Heat Beneath Our Feet: The Quiet Rise of Geothermal Power", "Why Volcanoes Are Too Dangerous to Study", "How Wind Turbines Spin in the Dark", "A Tourist Guide to Hot Springs"], "a": 0, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Heat Beneath Our Feet: The Quiet Rise of Geothermal Power'."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "In many rural communes and suburban housing estates, a child's only contact with books is the set of standard textbooks carried to school each morning. Once homework is finished, entertainment often means scrolling through short videos on a parent's phone. Recognising this gap, a grassroots movement of teachers, alumni and volunteers has been setting up small, self-managed community bookshelves in village cultural houses and apartment lobbies.\n\nUnlike traditional reference libraries with locked glass cabinets and strict borrowing hours, these neighbourhood corners are designed to be <b>inviting</b> and accessible. Colourful low shelves allow seven-year-olds to reach picture books on their own, while bamboo mats and floor cushions encourage children to sit and read together after school. Borrowing is based on an honour system: readers simply write their name and the book title in a shared notebook.\n\n<b>[I]</b> Skeptics initially warned that unguarded books would quickly go missing or be torn. <b>[II]</b> Experience across hundreds of reading corners has proved the opposite. <b>[III]</b> When children are trusted to act as 'junior librarians' who tidy the shelves and remind friends to return books, loss rates remain below two percent. <b>[IV]</b>\n\nTo keep interest fresh, neighbouring villages rotate boxes of fifty books every two months and hold Saturday storytelling circles led by grandparents or high school volunteers. By bringing stories within walking distance of every doorstep, <b>these modest shelves</b> are nurturing a love of reading that lasts far beyond exam season.", "qs": [{"s": "The word <b>inviting</b> in paragraph 2 is closest in meaning to ______.", "o": ["expensive", "frightening", "welcoming", "locked"], "a": 2, "e": "inviting = thân thiện, thu hút, mời gọi = welcoming."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["rural children dislike reading picture books", "many children outside city centres have limited access to non-textbook reading materials", "every apartment lobby has had a library for fifty years", "textbooks are the only books ever printed in Vietnam"], "a": 1, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'many children outside city centres have limited access to non-textbook reading materials'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Heavy padlocks on every glass bookcase", "Bamboo mats and cushions for comfortable reading", "A simple notebook honour system for borrowing", "Low shelves that young children can reach easily"], "a": 0, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Heavy padlocks on every glass bookcase') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>In fact, families often donate extra books from home, leaving the shelves fuller at the end of the year than at the start.</b>", "o": ["[III]", "[I]", "[II]", "[IV]"], "a": 3, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Junior librarians are paid high salaries by the local government.", "Unguarded community libraries lose all their books within a week.", "Trusting children with responsibility keeps book losses remarkably low and builds community ownership.", "Skeptics were right that children tear up every book."], "a": 2, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Trusting children with responsibility keeps book losses remarkably low and builds community ownership.'."}, {"s": "The word/phrase <b>these modest shelves</b> in paragraph 4 refers to ______.", "o": ["standard school textbooks", "the small community bookshelves", "locked glass cabinets", "parents' smartphones"], "a": 1, "e": "Trong ngữ cảnh đoạn 4, <b>these modest shelves</b> quy chiếu cho 'the small community bookshelves'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Rotating book collections and involving local volunteers keep community reading spaces lively.", "A library can only succeed if it has ten thousand books from day one.", "Grandparents should not be allowed near storytelling circles.", "Once a child reads fifty books, the library closes."], "a": 0, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Rotating book collections and involving local volunteers keep community reading spaces lively.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Books are kept behind locked glass doors at all times.", "Community bookshelves charge a high monthly fee to every child.", "Loss rates at junior-librarian corners exceed fifty percent.", "Rotating book boxes between villages helps keep the reading selection fresh without high costs."], "a": 3, "e": "Thông tin đúng theo bài đọc: 'Rotating book boxes between villages helps keep the reading selection fresh without high costs.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Smartphones have made picture books illegal in suburban estates.", "Children will only read if forced by strict fines.", "Giving children a sense of ownership over a shared space encourages responsible behaviour.", "Rotating books between villages is too complicated to work."], "a": 2, "e": "Suy luận hợp lý từ toàn bài: 'Giving children a sense of ownership over a shared space encourages responsible behaviour.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Why Glass Cabinets Are Essential for Libraries", "Books at the Doorstep: How Neighbourhood Shelves Are Growing Young Readers", "The History of School Textbooks", "How to Repair Torn Pages"], "a": 1, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Books at the Doorstep: How Neighbourhood Shelves Are Growing Young Readers'."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "When Japanese engineer Eiji Nakatsu set out to redesign the Shinkansen bullet train in the 1990s, he faced a stubborn problem: every time the train exited a narrow tunnel at three hundred kilometres per hour, compressed air created a thunderous sonic boom that disturbed residents half a kilometre away. An avid birdwatcher, Nakatsu looked not to aircraft textbooks, but to the kingfisher—a bird that dives from air into water with <b>scarcely</b> a splash.\n\nBy shaping the train's nose after the kingfisher's streamlined beak, his team eliminated the tunnel boom, cut electricity use by fifteen percent and made the train ten percent faster. This approach—studying nature's time-tested structures and processes to solve human engineering challenges—is known as biomimicry.\n\n<b>[I]</b> Over 3.8 billion years of evolution, living organisms have solved problems of energy efficiency, waterproofing and temperature control without burning fossil fuels or producing toxic waste. <b>[II]</b> In Zimbabwe, architect Mick Pearce modelled an office complex on the self-cooling mounds of African termites, whose network of vents keeps the nest at a steady temperature despite scorching desert days. <b>[III]</b> The building uses ninety percent less energy for air conditioning than conventional glass towers nearby. <b>[IV]</b>\n\nFrom Velcro fasteners inspired by burdock seeds to hospital surfaces modelled on sharkskin that naturally repel bacteria, nature's library of designs is vast. Protecting biodiversity is therefore not only an ethical duty; every species lost is a volume of engineering wisdom burned before <b>we</b> have learned to read it.", "qs": [{"s": "The word <b>scarcely</b> in paragraph 1 is closest in meaning to ______.", "o": ["completely", "loudly", "frequently", "hardly"], "a": 3, "e": "scarcely a splash = hầu như không bắn nước = hardly."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["kingfishers make a loud sonic boom when diving into water", "the Shinkansen was slowed down to fifty kilometres per hour", "the kingfisher's beak inspired a quieter, more efficient bullet-train nose", "Nakatsu copied the nose of a military jet"], "a": 2, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'the kingfisher's beak inspired a quieter, more efficient bullet-train nose'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Eliminating the loud tunnel boom", "Allowing the train to travel underwater", "Increasing the train's speed by ten percent", "Reducing electricity consumption by fifteen percent"], "a": 1, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Allowing the train to travel underwater') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>Natural airflow draws cool night air through the floors and releases warm air through rooftop chimneys.</b>", "o": ["[III]", "[I]", "[II]", "[IV]"], "a": 0, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [III] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Living organisms always produce toxic waste to control temperature.", "Termite mounds require electric air conditioners to stay cool.", "Glass towers use ninety percent less energy than termite-inspired buildings.", "Evolution has produced energy-efficient natural designs, such as termite mounds, that inspire green architecture."], "a": 3, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Evolution has produced energy-efficient natural designs, such as termite mounds, that inspire green architecture.'."}, {"s": "The word/phrase <b>we</b> in paragraph 4 refers to ______.", "o": ["hospital bacteria", "termites and kingfishers", "humanity / engineers and scientists", "burdock seeds"], "a": 2, "e": "Trong ngữ cảnh đoạn 4, <b>we</b> quy chiếu cho 'humanity / engineers and scientists'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Engineers have already copied every design that exists in nature.", "Conserving wildlife also preserves irreplaceable biological blueprints for future innovation.", "Sharkskin attracts bacteria to hospital walls.", "Biodiversity has no connection to technology or medicine."], "a": 1, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Conserving wildlife also preserves irreplaceable biological blueprints for future innovation.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Biomimicry looks to natural organisms for sustainable solutions to design problems.", "The Zimbabwe office building uses ten times more power than neighbouring glass towers.", "Velcro was invented by studying kingfisher feathers.", "Bullet trains create louder booms when shaped like a beak."], "a": 0, "e": "Thông tin đúng theo bài đọc: 'Biomimicry looks to natural organisms for sustainable solutions to design problems.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Extinct species leave behind complete engineering manuals.", "Nature's designs always require more fossil fuels than human machines.", "Only birds can inspire transport engineering.", "Observing how animals and plants adapt to their environments can lead to cleaner technologies."], "a": 3, "e": "Suy luận hợp lý từ toàn bài: 'Observing how animals and plants adapt to their environments can lead to cleaner technologies.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Why Termites Build Tall Mounds", "The History of Japanese Railways", "Nature's Blueprint: How Biomimicry Turns Evolution into Innovation", "How to Watch Birds in Winter"], "a": 2, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Nature's Blueprint: How Biomimicry Turns Evolution into Innovation'."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Ten years ago, waiting ten minutes at a bus stop or sitting in a train carriage meant staring out of the window and letting your thoughts wander. Today, the moment a thirty-second pause appears in our schedule, our hand reaches almost automatically for a smartphone. We have eliminated nearly every pocket of unstructured quiet from waking life.\n\nPsychologists warn that this constant digital stimulation comes with an unseen cost. When external inputs stop, the brain does not actually go idle; instead, it switches on what neuroscientists call the 'default mode network'. In this <b>reflective</b> state, the mind sifts through recent experiences, imagines future scenarios and links distant ideas that rarely meet during focused work.\n\n<b>[I]</b> Many breakthroughs in science, music and literature have arrived not at a busy desk, but during a quiet walk, a shower or a train ride. <b>[II]</b> In one famous experiment, volunteers who spent fifteen minutes doing a mundane task—such as copying numbers from a phone directory—came up with significantly more creative uses for everyday objects afterwards than volunteers who went straight to the puzzle. <b>[III]</b> Mild boredom, it turns out, nudges the restless brain to invent its own entertainment. <b>[IV]</b>\n\nWhen we fill every spare minute with somebody else's videos and headlines, we crowd out our own original thoughts. Leaving our phone in our bag while waiting in a queue or walking home gives the mind the breathing room <b>it</b> needs to surprise us.", "qs": [{"s": "The word <b>reflective</b> in paragraph 2 is closest in meaning to ______.", "o": ["thoughtful", "exhausted", "aggressive", "noisy"], "a": 0, "e": "reflective = trầm tư, suy ngẫm = thoughtful."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["smartphones were invented to encourage daydreaming", "people ten years ago never rode buses or trains", "waiting at a bus stop today takes three hours", "smartphones have filled almost every brief pause in modern daily life"], "a": 3, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'smartphones have filled almost every brief pause in modern daily life'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Reviewing recent experiences", "Planning and imagining future situations", "Shutting down all electrical activity in the brain", "Connecting distant ideas creatively"], "a": 2, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Shutting down all electrical activity in the brain') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>By contrast, participants who scrolled through their phones during the break showed no creative boost at all.</b>", "o": ["[I]", "[III]", "[II]", "[IV]"], "a": 1, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [III] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Quiet, mildly boring intervals stimulate daydreaming and boost creative problem-solving.", "Copying phone numbers is the only way to become a famous musician.", "Breakthroughs in science happen only when checking social media.", "Boredom permanently damages the default mode network."], "a": 0, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Quiet, mildly boring intervals stimulate daydreaming and boost creative problem-solving.'."}, {"s": "The word/phrase <b>it</b> in paragraph 4 refers to ______.", "o": ["somebody else's phone", "our bag", "the queue", "the mind / the brain"], "a": 3, "e": "Trong ngữ cảnh đoạn 4, <b>it</b> quy chiếu cho 'the mind / the brain'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["The default mode network works only while we are typing emails.", "We should throw away our smartphones and never read news again.", "Allowing ourselves occasional screen-free pauses is essential for reflection and creativity.", "Waiting in a queue is harmful to mental health."], "a": 2, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Allowing ourselves occasional screen-free pauses is essential for reflection and creativity.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Volunteers who did a boring task first performed worse on the creativity test.", "The brain's default mode network becomes active when we are not focused on external tasks.", "When external stimulation stops, the brain becomes completely inactive.", "Constant phone scrolling helps people connect distant ideas better."], "a": 1, "e": "Thông tin đúng theo bài đọc: 'The brain's default mode network becomes active when we are not focused on external tasks.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Children and students whose schedules leave no unscheduled downtime may have fewer chances for independent creative thought.", "Boredom should be avoided at all costs by watching short videos.", "Scientific discoveries never require focused study.", "Phone directories are more entertaining than music."], "a": 0, "e": "Suy luận hợp lý từ toàn bài: 'Children and students whose schedules leave no unscheduled downtime may have fewer chances for independent creative thought.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Why Waiting for Buses Is a Waste of Time", "How to Read Faster on Your Commute", "The History of the Telephone Directory", "In Praise of Quiet Pauses: Why Unplugged Daydreaming Fuels Creativity"], "a": 3, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'In Praise of Quiet Pauses: Why Unplugged Daydreaming Fuels Creativity'."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Every day, urban markets, school canteens and household kitchens generate tonnes of vegetable peelings, coffee grounds, eggshells and leftover rice. When this wet organic waste is tied up in plastic bags and buried in deep landfills without oxygen, bacteria break it down into methane—a greenhouse gas nearly thirty times more potent than carbon dioxide over a century.\n\nYet what becomes a climate problem in a landfill is actually pure gold for exhausted farmland. Through aerobic composting—mixing food scraps with dry leaves and turning the pile so air can circulate—microorganisms transform kitchen waste into dark, crumbly humus that smells like forest earth. Spread over fields, compost <b>replenishes</b> organic carbon, helps sandy soil hold water and reduces the need for chemical fertilizers.\n\n<b>[I]</b> Several Asian cities have shown how quickly household composting can scale up. <b>[II]</b> In Seoul, residents place food scraps into smart neighbourhood bins that weigh each bag and charge a small fee by weight, cutting municipal food waste entries to landfills from ninety-eight percent to less than five percent in two decades. <b>[III]</b> Nearer home, many Vietnamese schools and apartment blocks now use compact vermicomposting boxes, where earthworms quietly turn canteen fruit peels into liquid fertilizer for rooftop vegetables. <b>[IV]</b>\n\nClosing the loop between the dinner plate and the farm field does not require high-tech factories alone. When citizens separate organic scraps at the kitchen sink, <b>they</b> turn everyday rubbish into the foundation of next season's harvest.", "qs": [{"s": "The word <b>replenishes</b> in paragraph 2 is closest in meaning to ______.", "o": ["exhausts", "restores", "pollutes", "freezes"], "a": 1, "e": "replenishes = bổ sung lại, làm đầy lại = restores."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["burying organic waste in oxygen-free landfills produces methane gas", "vegetable peelings never decompose in nature", "methane is thirty times weaker than carbon dioxide", "plastic bags turn into forest earth inside landfills"], "a": 0, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'burying organic waste in oxygen-free landfills produces methane gas'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Returning organic carbon to the soil", "Helping soil retain moisture", "Reducing reliance on chemical fertilizers", "Increasing methane emissions from open fields"], "a": 3, "e": "Đoạn 2 đề cập 3 ý đầu; phương án D ('Increasing methane emissions from open fields') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>The collected organic matter is then processed into animal feed, biogas and compost for urban farms.</b>", "o": ["[II]", "[I]", "[III]", "[IV]"], "a": 2, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [III] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Seoul now buries ninety-eight percent of its food waste in landfills.", "Both city-wide policies and small school worm-composting systems can successfully divert food waste into useful resources.", "Earthworms can only survive in giant industrial factories.", "School canteens in Vietnam produce no fruit peels at all."], "a": 1, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Both city-wide policies and small school worm-composting systems can successfully divert food waste into useful resources.'."}, {"s": "The word/phrase <b>they</b> in paragraph 4 refers to ______.", "o": ["citizens", "high-tech factories", "organic scraps", "earthworms"], "a": 0, "e": "Trong ngữ cảnh đoạn 4, <b>they</b> quy chiếu cho 'citizens'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Kitchen waste should be burned in open street bins.", "Only chemical fertilizers can make vegetables grow.", "Composting requires burying plastic bags deep underground.", "Sorting food waste at home is a practical step that links urban households to sustainable agriculture."], "a": 3, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Sorting food waste at home is a practical step that links urban households to sustainable agriculture.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Seoul's pay-by-weight bins increased landfill waste to ninety-eight percent.", "Burying food waste without oxygen produces clean oxygen gas.", "Aerobic composting requires air circulation and a mix of wet scraps and dry leaves.", "Compost makes sandy soil lose water faster."], "a": 2, "e": "Thông tin đúng theo bài đọc: 'Aerobic composting requires air circulation and a mix of wet scraps and dry leaves.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Methane gas is beneficial for cooling the atmosphere.", "Separating wet organic waste from dry recyclables makes both composting and recycling cleaner and more effective.", "Earthworms refuse to eat fruit peels.", "Urban markets cannot participate in composting programmes."], "a": 1, "e": "Suy luận hợp lý từ toàn bài: 'Separating wet organic waste from dry recyclables makes both composting and recycling cleaner and more effective.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["From Peel to Soil: How Composting Turns Kitchen Waste into Farm Wealth", "Why Landfills Are the Best Place for Leftovers", "The Chemistry of Plastic Bags", "How to Grow Coffee in Seoul"], "a": 0, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'From Peel to Soil: How Composting Turns Kitchen Waste into Farm Wealth'."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 1 (10 câu)", "p": "Long before modern meteorology and concrete engineering existed, communities across Southeast Asia learned to live alongside seasonal floods and tropical heat. One of their most enduring inventions is the traditional wooden or bamboo stilt house. Raised one to two metres above the ground on sturdy pillars, these homes reflect centuries of climate wisdom that contemporary architects are now <b>revisiting</b> with fresh respect.\n\nEvery feature of a stilt house serves a clear environmental purpose. Elevating the living floor keeps families and grain stores dry when monsoon rivers overflow their banks, allowing floodwater to pass harmlessly underneath rather than battering solid brick walls. In hot, humid weather, cool breezes circulate beneath the raised floorboards and rise through gaps in the woven walls, while the steep thatched or tiled roof sheds heavy rain quickly and shades the verandas.\n\n<b>[I]</b> In recent decades, many rural and suburban families replaced stilt houses with ground-level concrete box homes, viewing brick as a symbol of modernity. <b>[II]</b> During severe autumn floods in central Vietnam, however, ground-floor brick houses often trap rising water inside, forcing residents onto roofs. <b>[III]</b> In response, young Vietnamese architectural studios have designed low-cost 'amphibious' and elevated houses that combine reinforced concrete pillars or floating bamboo drums with traditional natural ventilation. <b>[IV]</b>\n\nThese modern adaptations prove that heritage architecture is not a museum relic frozen in the past. By marrying ancestral climate knowledge with modern structural safety, builders can create homes that keep <b>their occupants</b> safe, cool and connected to local culture.", "qs": [{"s": "The word <b>revisiting</b> in paragraph 1 is closest in meaning to ______.", "o": ["forgetting", "demolishing", "re-examining", "forbidding"], "a": 2, "e": "revisiting = xem xét lại, tìm hiểu lại = re-examining."}, {"s": "According to paragraph 1, it is stated that ______.", "o": ["stilt houses were invented only ten years ago by modern meteorologists", "traditional stilt houses were ingeniously adapted to tropical heat and floods", "Southeast Asian villages never experienced seasonal floods in the past", "stilt houses are built two metres underground"], "a": 1, "e": "Dựa vào thông tin trực tiếp ở đoạn 1: 'traditional stilt houses were ingeniously adapted to tropical heat and floods'."}, {"s": "Which of the following is NOT mentioned in paragraph 2?", "o": ["Trapping heat inside the house during summer afternoons", "Allowing cool air to circulate beneath the floor", "Shedding heavy rain quickly via steep roofs", "Keeping living spaces above seasonal floodwater"], "a": 0, "e": "Đoạn 2 đề cập 3 ý đầu; phương án nhiễu ('Trapping heat inside the house during summer afternoons') không xuất hiện hoặc trái với đoạn 2."}, {"s": "Where in paragraph 3 does the following sentence best fit?\n<b>Built with local materials, hundreds of these flood-resilient homes have already sheltered families safely through recent storms.</b>", "o": ["[III]", "[I]", "[II]", "[IV]"], "a": 3, "e": "Câu chèn liên kết mạch logic trực tiếp với nội dung tại vị trí [IV] trong đoạn 3."}, {"s": "Which of the following best summarises paragraph 3?", "o": ["Young architects have banned the use of bamboo and ventilation.", "Ground-level brick box houses are always safer than elevated homes in floods.", "Modern architects are blending traditional elevated design with new materials to build flood-safe homes.", "Residents prefer houses that trap floodwater indoors."], "a": 2, "e": "Tóm tắt chuẩn xác ý chính của đoạn 3: 'Modern architects are blending traditional elevated design with new materials to build flood-safe homes.'."}, {"s": "The word/phrase
