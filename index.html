let S;try{S=JSON.parse(localStorage.tn26)}catch(e){}S=S||{d:{},u:0};

function rng(s){let a=0;for(const c of s)a=Math.imul(a^c.charCodeAt(0),2654435761)>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ===== DỰNG BÀI ===== */
function gEx(t,i){ // 20 câu = 5 câu/cấp độ, rút tuần hoàn từ ngân hàng
 const rr=rng('x'+t+i);if(window.EXTRA_G&&EXTRA_G[t]&&EXTRA_G[t][i])return[{qs:EXTRA_G[t][i].map((x,k)=>{if(typeof x!='string')return x;const a=x.split('|'),o=a.slice(1,5),ix=[0,1,2,3];for(let j=3;j>0;j--){const m=rr()*(j+1)|0;[ix[j],ix[m]]=[ix[m],ix[j]]}return{s:a[0],o:ix.map(j=>o[j]),a:ix.indexOf(+a[5]),l:k/5|0}})}];
 const b=G[t].concat((window.EXTRA_B&&EXTRA_B[t])||[]).map(x=>x.split('|')).map(a=>({l:+a[0],s:a[1],o:a.slice(2,6),a:+a[6]})),r=rng(t+i),qs=[];
 for(let k=0;k<20;k++){let L=b.filter(x=>x.l==(k/5|0));if(!L.length)L=b;const q=L[(i*5+k%5)%L.length],ix=[0,1,2,3].sort(()=>r()-.5);qs.push({s:q.s,o:ix.map(j=>q.o[j]),a:ix.indexOf(q.a),l:k/5|0})}

let tab=0,last;const HUE=[232,168,28,340,265,196,100,12];

function home(){
 const D=['g','p','t'].map(cnt),T=TOT.map(f=>f()),all=D.reduce((a,b)=>a+b)/T.reduce((a,b)=>a+b);
 let h=`<div class=hero><div class=hin><div><h1>Ôn thi tốt nghiệp Tiếng Anh</h1><p>Năm học 2026-2027, bám cấu trúc đề mẫu 40 câu</p></div>${ring(all)}</div></div><div class=steps>`+['Ngữ pháp','Dạng bài','Đề mẫu'].map((x,i)=>`<button class="step ${tab==i?'on':''} ${i&&!S.u?'lk':''}" onclick="nav(${i})"><b>${i&&!S.u?'🔒 ':''}${x}</b><small>${D[i]}/${T[i]} bài</small><div class=mini><i style="width:${T[i]?D[i]/T[i]*100:0}%"></i></div></button>`).join('')+'</div><main>';
 if(tab==0){const rest=gTot()-gDone();
  h+=rest?`<div class=note><span>Làm đủ <b>${gTot()} bài</b> để mở khóa Dạng bài và Đề mẫu. Còn <b>${rest}</b> bài.</span></div>`:S.u?'':`<div class=note><span>Bạn đã hoàn thành phần ngữ pháp.</span><button class=btn onclick="nav(1)">Nhập mật khẩu</button></div>`;

  topics.forEach((t,ti)=>{let d=0,g='';for(let i=0;i<10;i++){const r=S.d['g:'+t+':'+i];d+=!!r;g+=tile(i+1,r,`runG('${t}',${i})`)}
   h+=`<div class=card style="--h:${HUE[ti%8]}"><div class=row><h2>${TN[t]}</h2><span>${d}/10 bài</span></div><div class=mini><i style="width:${d*10}%"></i></div><div class=grid>${g}</div></div>`});h+='</div>'}
 if(tab==1){h+='<div class=leg>'+LV.map((l,i)=>`<span style="--k:var(${LC[i]})">${l}</span>`).join('')+'</div><div class=cols>';
  PT.forEach((n,ty)=>{const b=pBank(ty);let g='',d=0;for(let i=0;i<20;i++){const r=S.d['p:'+ty+':'+i];d+=!!r;g+=tile(i+1,r,`runP(${ty},${i})`,b[i]&&b[i].lv,!b[i])}
   h+=`<div class=card style="--h:${HUE[(ty+3)%8]}"><div class=row><h2>${n}</h2><span>${b.length}/20 bài có đề</span></div><div class=mini><i style="width:${d*5}%"></i></div><div class=grid>${g}</div></div>`});h+='</div>'}
 if(tab==2){let g='';for(let i=0;i<20;i++)g+=tile('Đề '+(i+1),S.d['t:'+i],`runT(${i})`);
  h+=`<div class=note><span>Mỗi đề gồm 6 dạng bài, 40 câu, làm trong 50 phút. Hết giờ hệ thống tự nộp bài.</span></div><div class=card style="--h:232"><div class=grid>${g}</div></div>`}
 $('#app').innerHTML=h+'</main>';scrollTo(0,0)}
const runG=(t,i)=>quiz(TN[t]+', bài '+(i+1),gEx(t,i),'g:'+t+':'+i);
const runP=(ty,i)=>quiz(PT[ty]+', bài '+(i+1),pEx(ty,i).secs,'p:'+ty+':'+i);
const runT=i=>{const s=tEx(i);s.length?quiz('Đề mẫu '+(i+1),s,'t:'+i,50):toast('Chưa có dữ liệu cho đề này.')};

let tm;
function quiz(title,secs,key,min){
 last=[title,secs,key,min];let n=0,h='';
 secs.forEach(s=>{const base=n;if(s.h)h+=`<h3 class=sh>${s.h}</h3>`;
  h+=`<div class="sec ${s.p?'has':''}">`+(s.p?`<div class=ps>${s.p.replace(/@(\d+)/g,(m,d)=>'<b>('+(base+ +d)+') ____</b>')}</div>`:'')+'<div>';
  s.qs.forEach(q=>{q.n=n++;h+=`<div class=q id=q${q.n}><div class=qh><span class=qn>${q.n+1}</span><div class=s>${q.s||'Chọn đáp án cho chỗ trống ('+(q.n+1)+')'}</div></div>`+q.o.map((o,j)=>`<label><input type=radio name=r${q.n} value=${j}><span><b>${'ABCD'[j]}</b><span>${o}</span></span></label>`).join('')+'</div>'});h+='</div></div>'});
 const all=secs.flatMap(s=>s.qs);let end=0,left=(min||0)*60;
 $('#app').innerHTML=`<div class=top><div class=tb><button class="btn g" onclick="leave()">Thoát</button><h2>${title}</h2>${min?`<span class=pill id=tmr>${min}:00</span>`:''}<span class=pill id=cnt>0/${all.length}</span><button class=btn id=sub>Nộp bài</button></div><div class=chips id=chips>${all.map(q=>`<button class=chip data-n=${q.n} aria-label="Câu ${q.n+1}">${q.n+1}</button>`).join('')}</div><div class=bar2><i id=pb></i></div></div><div class=wrap><div id=res></div><div id=body>${h}</div><button class=btn id=sub2 style="width:100%">Nộp bài</button></div>`;
 scrollTo(0,0);const ch=[...document.querySelectorAll('.chip')],sel=q=>document.querySelector(`input[name=r${q.n}]:checked`);
 const upd=()=>{let a=0;all.forEach(q=>{const c=!!sel(q);a+=c;ch[q.n].classList.toggle('a',c)});$('#cnt').textContent=a+'/'+all.length;$('#pb').style.width=a/all.length*100+'%'};
 $('#body').onchange=upd;$('#chips').onclick=e=>{const k=e.target.dataset.n;if(k!=null)$('#q'+k).scrollIntoView({behavior:'smooth',block:'center'})};
 const fin=()=>{if(end)return;end=1;clearInterval(tm);let sc=0,bl=0;const lc=[0,0,0,0],lt=[0,0,0,0];
  all.forEach(q=>{const c=sel(q),ok=c&&+c.value==q.a;sc+=!!ok;bl+=!c;if(q.l!=null){lt[q.l]++;lc[q.l]+=!!ok}
   const bx=$('#q'+q.n);bx.classList.add('fin');if(!ok){bx.classList.add('bad');if(!c)bx.querySelector('.s').insertAdjacentHTML('beforeend','<span class=tag>Chưa làm, đáp án đúng được tô xanh.</span>')}
   ch[q.n].classList.remove('a');ch[q.n].classList.add(ok?'ok':'no');
   bx.querySelectorAll('label').forEach((l,j)=>{l.querySelector('input').disabled=true;if(j==q.a)l.classList.add('ok');else if(c&&+c.value==j)l.classList.add('no')})});
  if(!S.d[key]||sc>=S.d[key].s){S.d[key]={s:sc,t:all.length};save()}
  $('#sub').style.display=$('#sub2').style.display='none';
  const lv=LV.map((l,i)=>lt[i]?`<div class=lvb style="--k:var(${LC[i]})"><span>${l}</span><div><i style="width:${lc[i]/lt[i]*100}%"></i></div><span>${lc[i]}/${lt[i]}</span></div>`:'').join('');
  $('#res').innerHTML=`<div class=res>${ring(sc/all.length)}<div class=st><p>Điểm ${(sc/all.length*10).toFixed(2)}/10</p><div class=kv><span>Đúng <b class=ok>${sc}</b></span><span>Sai <b class=no>${all.length-sc-bl}</b></span><span>Bỏ trống <b>${bl}</b></span></div>${lv}<div class=acts><button class=btn id=rv>Chỉ xem câu sai</button><button class="btn g" id=rt>Làm lại</button><button class="btn g" onclick="leave()">Về danh sách</button></div></div></div>`;
  $('#rv').onclick=e=>{const b=$('#body').classList.toggle('hideok');e.target.textContent=b?'Xem tất cả câu':'Chỉ xem câu sai'};$('#rt').onclick=()=>quiz(...last);scrollTo(0,0)};
 $('#sub').onclick=$('#sub2').onclick=()=>{const un=all.filter(q=>!sel(q)).length;if(!un||confirm('Còn '+un+' câu chưa làm. Vẫn nộp bài?'))fin()};
 clearInterval(tm);if(min)tm=setInterval(()=>{left--;const e=$('#tmr');e.textContent=String(left/60|0).padStart(2,'0')+':'+String(left%60).padStart(2,'0');e.classList.toggle('warn',left<300);if(left<=0)fin()},1000)}
function leave(){clearInterval(tm);home()}

function askPw(n){const m=document.createElement('div');m.className='mask';
 m.innerHTML='<div><b>🔓 Bạn đã hoàn thành phần ngữ pháp</b><p class=sub>Nhập mật khẩu để mở khóa Dạng bài và Đề mẫu.</p><input id=pw type=password placeholder="Mật khẩu" autocomplete=off><div class=err id=pe></div><button class=btn id=ok>Mở khóa</button> <button class="btn g" id=no>Để sau</button></div>';
 document.body.appendChild(m);$('#pw').focus();
 const go=async()=>{try{if($('#pw').value.trim() == 'tienhuong28011981'){S.u=1;save();m.remove();nav(n)}else $('#pe').textContent='Mật khẩu chưa đúng, hãy thử lại.'}catch(e){$('#pe').textContent='Hãy mở trang qua https hoặc localhost để kiểm tra mật khẩu.'}};
 $('#ok').onclick=go;$('#pw').onkeydown=e=>e.key=='Enter'&&go();$('#no').onclick=()=>m.remove()}
home();
</script></body></html>
