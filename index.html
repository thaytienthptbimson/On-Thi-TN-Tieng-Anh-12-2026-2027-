 <b>their occupants</b> in paragraph 4 refers to ______.", "o": ["the bamboo drums", "the people living in the homes", "museum relics", "monsoon rivers"], "a": 1, "e": "Trong ngữ cảnh đoạn 4, <b>their occupants</b> quy chiếu cho 'the people living in the homes'."}, {"s": "What conclusion can be drawn from paragraph 4?", "o": ["Traditional building wisdom can inspire practical, climate-resilient housing for the future.", "All modern concrete buildings should be torn down immediately.", "Stilt houses only work in freezing desert climates.", "Architecture has nothing to learn from rural traditions."], "a": 0, "e": "Từ đoạn 4 có thể rút ra kết luận: 'Traditional building wisdom can inspire practical, climate-resilient housing for the future.'."}, {"s": "Which of the following is true according to the passage?", "o": ["Amphibious houses sink to the bottom of the river during storms.", "Steep roofs are designed to collect and hold rainwater on top of the house.", "Ground-level concrete box houses naturally stay cooler than ventilated stilt houses.", "Raising a house on pillars allows floodwater to flow underneath without destroying walls."], "a": 3, "e": "Thông tin đúng theo bài đọc: 'Raising a house on pillars allows floodwater to flow underneath without destroying walls.'."}, {"s": "Which of the following can be inferred from the passage?", "o": ["Natural ventilation consumes more electricity than air conditioning.", "Modernity requires copying cold-climate glass buildings in the tropics.", "Adapting to climate change often involves learning from local traditions rather than ignoring them.", "Bamboo cannot float on water."], "a": 2, "e": "Suy luận hợp lý từ toàn bài: 'Adapting to climate change often involves learning from local traditions rather than ignoring them.'."}, {"s": "Which of the following would be the best title for the passage?", "o": ["Why Brick Walls Always Stop Floods", "Wisdom on Pillars: How Traditional Stilt Houses Inspire Climate-Resilient Homes", "The History of Museums in Southeast Asia", "How to Forecast Tropical Storms"], "a": 1, "e": "Tiêu đề bao quát toàn bộ nội dung bài đọc: 'Wisdom on Pillars: How Traditional Stilt Houses Inspire Climate-Resilient Homes'."}]}]}], "3": [{"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "For much of the twentieth century, researchers feared that a second language would interfere with a child's thinking, and bilingualism was often treated as a handicap. Today the picture could hardly be more different. Estimates suggest that between 60 and 75 percent of the world's population speaks at least two languages, and the question has shifted from whether bilingualism does harm to what it might do for the mind.\n\nScientists have since begun to explain why. In a number of experiments, bilingual volunteers moved from one task to another more smoothly than <b>those</b> who spoke only one language. <u>According to scientists, the advantage arises from the constant mental effort needed to keep one language active while holding the other in check.</u> In other words, every conversation doubles as a small workout for the brain.\n\nThe benefits may even reach beyond everyday multitasking. Brain scans of lifelong bilinguals reveal more grey matter in a region linked to learning and conflict resolution, and bilingual seniors appear to experience less cognitive decline. This effect seems most <b>pronounced</b> in later life. Psychologists attribute it to a process called inhibition, which keeps the unused language quiet and grows stronger with years of practice.\n\nIt would be <b>rash</b>, however, to conclude that every bilingual enjoys a sharper mind. Several large studies have failed to find any clear advantage, and recent work suggests that the effects depend on which languages are spoken and how they are used. Switching freely between two languages in conversation with another bilingual, for instance, seems to demand little extra effort. What the evidence supports is not a universal rule but a modest claim: using more than one language may exercise the mind, although the gains vary from person to person. As schools debate how early a second language should be introduced, the more useful lesson may be that learning one is worthwhile for many reasons besides test scores.\n(Adapted from https://www.weforum.org and https://scrippsnews.com)", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["questioning the accuracy of figures on bilingual populations", "promoting the teaching of foreign languages to young children", "criticising researchers for ignoring the needs of bilingual children", "outlining a major shift in how bilingualism is viewed"], "a": 3, "e": "Đoạn 1 kể rằng suốt phần lớn thế kỷ XX song ngữ bị xem là bất lợi, nhưng nay câu hỏi đã chuyển sang nó mang lại lợi ích gì cho trí não → phác họa sự thay đổi lớn trong cách nhìn nhận song ngữ."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["tasks", "volunteers", "experiments", "scientists"], "a": 1, "e": "'bilingual volunteers moved from one task to another more smoothly than those who spoke only one language' → 'those' thay cho 'volunteers'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Scientists believe the benefit stems from the continuous mental work of using one language while suppressing the other.", "Scientists think the advantage comes from bilinguals having more time to practise both languages at once.", "According to scientists, keeping both languages active at once is an effortless way to gain this advantage.", "The advantage is explained by bilinguals ignoring one language completely so as to master the other."], "a": 0, "e": "Câu gốc: lợi thế bắt nguồn từ nỗ lực tinh thần liên tục để giữ một ngôn ngữ hoạt động trong khi kiềm chế ngôn ngữ còn lại → khớp với A."}, {"s": "The word <b>pronounced</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["distinct", "frequent", "faint", "original"], "a": 2, "e": "pronounced (rõ rệt, nổi bật) trái nghĩa với faint (mờ nhạt, yếu ớt)."}, {"s": "The word <b>rash</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["fair", "hasty", "certain", "polite"], "a": 1, "e": "rash = hasty (hấp tấp, vội vàng): 'It would be rash to conclude...' = sẽ là hấp tấp nếu kết luận..."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Attitudes towards bilingualism have changed considerably over time.", "Managing two languages may work as a form of regular mental exercise.", "Every study to date has confirmed that bilinguals outperform monolinguals.", "The advantages of bilingualism are not the same for every individual."], "a": 2, "e": "Đoạn 4: 'Several large studies have failed to find any clear advantage' → tác giả không đồng ý với C."}, {"s": "In which paragraph does the writer refer to a psychological process by its technical name?", "o": ["Paragraph 3", "Paragraph 1", "Paragraph 2", "Paragraph 4"], "a": 0, "e": "Đoạn 3: 'a process called inhibition' – tên gọi chuyên môn của một cơ chế tâm lý."}, {"s": "In which paragraph does the writer warn against an overgeneralisation?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 3, "e": "Đoạn 4: 'It would be rash, however, to conclude that every bilingual enjoys a sharper mind' → cảnh báo không nên khái quát hóa quá mức."}]}]}, {"lv": 1, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Most of us have met someone at a party, heard their name clearly, and lost it within seconds. Psychologists say this is rarely a failure of memory; it is a failure of attention.\n\nWhen we meet a stranger, our minds are busy preparing what to say next, so the name is never properly <b>stored</b>. A study of two hundred volunteers found that <b>those</b> who repeated a name aloud at once remembered it twice as often an hour later.\n\n<u>What makes the situation worse is that people feel <b>embarrassed</b> to ask again, so the same error is repeated at the next meeting.</u> The simple remedy is to pay full attention for a few seconds and to use the name in the conversation straight away.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["describing a common experience and hinting at its cause", "blaming hosts for poor introductions", "recommending that people attend parties", "criticising psychologists"], "a": 0, "e": "Đoạn 1 mô tả trải nghiệm quên tên quen thuộc và chỉ ra nguyên nhân là thiếu chú ý chứ không phải trí nhớ kém."}, {"s": "The word <b>stored</b> in paragraph 2 is CLOSEST in meaning to ______.", "o": ["kept", "spoiled", "sold", "shown"], "a": 0, "e": "stored = được lưu giữ = kept."}, {"s": "The word <b>embarrassed</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["ashamed", "confident", "puzzled", "tired"], "a": 1, "e": "embarrassed (ngại ngùng, bối rối) trái nghĩa với confident (tự tin)."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["names", "strangers", "volunteers", "minds"], "a": 2, "e": "'two hundred volunteers found that those who repeated...' → 'those' thay cho 'volunteers'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 3?", "o": ["People feel ashamed to ask a name again, which keeps the problem going.", "People hate being asked for names repeatedly, so errors never happen.", "Embarrassment stops people from meeting each other again.", "Asking a name twice is the cause of the error."], "a": 0, "e": "Ngại hỏi lại tên khiến lỗi quên tên tiếp tục lặp lại ở lần gặp sau."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Forgetting names usually comes from a lack of attention.", "Repeating a name aloud can help people recall it.", "Poor memory itself is the main cause of forgetting names.", "Using the name in conversation is a useful habit."], "a": 2, "e": "Đoạn 1: 'this is rarely a failure of memory; it is a failure of attention' → tác giả không đồng tình với C."}, {"s": "In which paragraph does the writer mention research evidence?", "o": ["Paragraph 1", "Paragraph 3", "Paragraph 2", "None of the paragraphs"], "a": 2, "e": "Đoạn 2 dẫn chứng nghiên cứu trên 200 tình nguyện viên ('A study of two hundred volunteers...')."}, {"s": "In which paragraph does the writer offer a solution?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "None of the paragraphs"], "a": 2, "e": "Đoạn 3 nêu giải pháp: 'The simple remedy is to pay full attention...'."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Walk into any university lecture hall today and you will hear the steady clatter of dozens of laptop keyboards. For decades, taking notes with a pen and paper was the unquestioned norm, yet digital devices have rapidly taken over the classroom desk. That shift has prompted psychologists to ask whether the tool we use to record information changes how well we understand it.\n\nIn a series of experiments, researchers compared students who typed lecture notes on laptops with <b>those</b> who wrote by hand. Typists recorded nearly twice as many words, often transcribing the speaker's sentences word for word. <u>Because handwriting is slower, pen-and-paper students had to listen for main ideas and summarise them in their own words on the spot.</u>\n\nWhen tested a week later on factual details, both groups performed similarly, but handwritten note-takers scored <b>markedly</b> higher on conceptual questions that required applying ideas. Psychologists attribute this advantage to 'generative processing'—the active mental work of selecting, rephrasing and connecting concepts while writing.\n\nIt would be <b>unwise</b>, however, to ban screens from every study session. Laptops excel when students need to search large archives, organise references or collaborate on shared tables. What the findings suggest is a practical balance: even if you store your files digitally, summarising key ideas in your own words—whether with a pen, a stylus or a mindful pause—matters far more than copying every syllable.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["introducing a change in student habits and the research question it raised", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 0, "e": "Đoạn 1 tập trung vào việc: 'introducing a change in student habits and the research question it raised'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["keyboards", "researchers", "experiments", "students"], "a": 3, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'students'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["The underlined process requires no effort and produces the opposite outcome.", "Researchers found that the two groups showed no difference under any circumstances.", "Writing by hand is slower, forcing students to extract key points and rephrase them immediately.", "Scientists recommend avoiding this activity altogether to save time."], "a": 2, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi C: 'Writing by hand is slower, forcing students to extract key points and rephrase them immediately.'."}, {"s": "The word <b>markedly</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["noticeably", "slightly", "clearly", "strongly"], "a": 1, "e": "markedly (rõ rệt) trái nghĩa với slightly (hơi, không đáng kể)."}, {"s": "The word <b>unwise</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["foolish", "sensible", "careful", "polite"], "a": 0, "e": "unwise = thiếu khôn ngoan = foolish."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success.", "Typing notes word for word guarantees the deepest conceptual understanding."], "a": 3, "e": "Nhận định D ('Typing notes word for word guarantees the deepest conceptual understanding.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer refer to a cognitive mechanism by its specialist term?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 2, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer recommend a balanced approach rather than rejecting digital tools?", "o": ["Paragraph 2", "Paragraph 4", "Paragraph 3", "Paragraph 1"], "a": 1, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "When city councils plan a new park, they typically plant rows of young trees several metres apart on a neat lawn and wait decades for a canopy to form. In the 1970s, Japanese botanist Akira Miyawaki proposed a radically different approach: cramming dozens of native tree and shrub species closely together on plots no larger than a tennis court. Today, these 'pocket forests' are springing up in schoolyards and traffic islands worldwide.\n\nField measurements help explain their appeal. In comparative trials, dense mini-forests grew up to ten times faster and absorbed far more carbon per square metre than <b>ones</b> planted in single-species rows. <u>Because saplings of different heights compete for sunlight while sharing underground fungi networks, the whole patch matures into a multi-layered woodland in just twenty years.</u>\n\nThe ecological gains are <b>striking</b>. A single tennis-court forest can harbour twenty times more bird and insect species than an ordinary municipal lawn, while its spongy leaf litter absorbs heavy rainfall. Ecologists call this mutual support system 'facilitative succession', where pioneer shrubs shelter slower-growing oaks and laurels from wind and heat.\n\nIt would be <b>naive</b>, however, to think that pocket forests can replace vast natural reserves or cool an entire metropolis on their own. Small plots cannot support large mammals, and soil preparation requires intensive labour at the start. Rather than a substitute for big parks, pocket forests are a clever way to bring wild nature into tight urban corners where full-scale woods could never fit.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["questioning the honesty of all university researchers", "contrasting conventional park planting with a dense native-forest method", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 1, "e": "Đoạn 1 tập trung vào việc: 'contrasting conventional park planting with a dense native-forest method'."}, {"s": "The word <b>ones</b> in paragraph 2 refers to ______.", "o": ["forests / plantations", "councils", "tennis courts", "measurements"], "a": 0, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>ones</b>' quy chiếu cho 'forests / plantations'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Scientists recommend avoiding this activity altogether to save time.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Competing for light above ground and sharing fungal networks below allows mixed saplings to form a mature woodland rapidly."], "a": 3, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi D: 'Competing for light above ground and sharing fungal networks below allows mixed saplings to form a mature woodland rapidly.'."}, {"s": "The word <b>striking</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["dramatic", "impressive", "unremarkable", "notable"], "a": 2, "e": "striking (ấn tượng, nổi bật) trái nghĩa với unremarkable (bình thường, mờ nhạt)."}, {"s": "The word <b>naive</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["experienced", "unrealistic", "cautious", "generous"], "a": 1, "e": "naive = ngây thơ, thiếu thực tế = unrealistic."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["A few tennis-court pocket forests are enough to replace all large national parks.", "A balanced, thoughtful approach yields better results than extreme positions.", "Evidence from studies helps clarify how this phenomenon works in practice.", "Context and practical implementation details matter for long-term success."], "a": 0, "e": "Nhận định A ('A few tennis-court pocket forests are enough to replace all large national parks.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer name the ecological process through which plants shelter and support one another?", "o": ["Paragraph 4", "Paragraph 1", "Paragraph 2", "Paragraph 3"], "a": 3, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer point out the physical limitations of small urban forest plots?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 4", "Paragraph 3"], "a": 2, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "In the 1950s, food companies introduced instant cake mixes that required shoppers only to add water and stir. Surprisingly, sales lagged until marketers removed powdered egg from the formula, requiring bakers to crack a fresh egg into the bowl themselves. That small extra step made people feel the cake was truly theirs, a quirk of human psychology that still shapes how we value everyday objects.\n\nBehavioural economists have tested this phenomenon in the laboratory. In several studies, volunteers who folded origami frogs or assembled simple wooden boxes placed a much higher monetary value on their creations than <b>those</b> who inspected identical items built by experts. <u>Even when the homemade version had crooked edges, its maker prized it almost as highly as a professional piece.</u>\n\nResearchers dubbed this tendency the 'IKEA effect', noting that effort creates an emotional bond between maker and object. This attachment is most <b>robust</b> when the task is successfully completed; if a kit is so frustrating that the builder gives up halfway, pride quickly turns into annoyance.\n\nIt would be <b>shortsighted</b>, however, to view this bias merely as a trick for selling flat-pack furniture. In schools and workplaces, people care far more about a project when they help shape it from the beginning rather than receiving a finished plan from above. Designing tasks where learners contribute real effort—while offering enough support to ensure they finish—turns passive recipients into proud owners.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["arguing that modern technology should be completely outlawed", "questioning the honesty of all university researchers", "using a historical marketing story to illustrate how effort creates perceived value", "listing historical dates without any central argument"], "a": 2, "e": "Đoạn 1 tập trung vào việc: 'using a historical marketing story to illustrate how effort creates perceived value'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["origami frogs", "volunteers", "wooden boxes", "economists"], "a": 1, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'volunteers'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Creators valued their own handiwork nearly as much as expert work, despite visible flaws in their homemade items.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Scientists recommend avoiding this activity altogether to save time."], "a": 0, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi A: 'Creators valued their own handiwork nearly as much as expert work, despite visible flaws in their homemade items.'."}, {"s": "The word <b>robust</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["vigorous", "strong", "durable", "fragile"], "a": 3, "e": "robust (mạnh mẽ, bền vững) trái nghĩa với fragile (mong manh, yếu ớt)."}, {"s": "The word <b>shortsighted</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["patient", "wise", "narrow-minded", "far-reaching"], "a": 2, "e": "shortsighted = thiển cận = narrow-minded."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "People value a DIY project even more when it is so difficult that they fail to finish it.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success."], "a": 1, "e": "Nhận định B ('People value a DIY project even more when it is so difficult that they fail to finish it.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer state what happens emotionally when a task proves too difficult to complete?", "o": ["Paragraph 3", "Paragraph 1", "Paragraph 2", "Paragraph 4"], "a": 0, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer apply the psychological finding to education and workplace management?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 3, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Anyone who has been caught in a sudden downpour on a day when the morning forecast promised 'sunny intervals' knows that weather can vary dramatically from one neighbourhood to the next. Official meteorological stations, typically located at airports or open fields outside town, provide accurate regional data, yet they often miss the microclimates created by hills, lakes and tall city blocks.\n\nOver the past decade, amateur weather enthusiasts have helped fill those blind spots. Across the world, hundreds of thousands of households and schools have mounted compact digital sensors on rooftops, sharing real-time temperature and rainfall readings more frequently than <b>those</b> run solely by national agencies. <u>By combining these dense backyard measurements with satellite imagery, forecasters can map storm cells street by street.</u>\n\nThe practical benefits are <b>tangible</b>. Farmers in mountain valleys receive frost warnings tailored to their specific slope, while city drainage engineers can see which ward is receiving the heaviest rain within minutes. Meteorologists refer to this blend of public sensor data and supercomputer models as 'crowd-sourced nowcasting'.\n\nIt would be <b>reckless</b>, however, to treat every backyard thermometer as scientifically flawless. A sensor placed too close to a brick chimney or an air-conditioning vent will record artificially high temperatures. Modern forecasting software therefore uses statistical filters to spot and discard faulty readings before updating the map, proving that community participation works best when paired with rigorous quality checks.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["listing historical dates without any central argument", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "explaining why regional weather stations can miss neighbourhood-level weather differences"], "a": 3, "e": "Đoạn 1 tập trung vào việc: 'explaining why regional weather stations can miss neighbourhood-level weather differences'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["airports", "households", "stations", "microclimates"], "a": 2, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'stations'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Researchers found that the two groups showed no difference under any circumstances.", "Merging neighbourhood sensor data with satellite pictures allows meteorologists to track storms at the street level.", "The underlined process requires no effort and produces the opposite outcome.", "Scientists recommend avoiding this activity altogether to save time."], "a": 1, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi B: 'Merging neighbourhood sensor data with satellite pictures allows meteorologists to track storms at the street level.'."}, {"s": "The word <b>tangible</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["abstract", "concrete", "real", "measurable"], "a": 0, "e": "tangible (hữu hình, rõ ràng) trái nghĩa với abstract (trừu tượng, mơ hồ)."}, {"s": "The word <b>reckless</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["modest", "cautious", "accurate", "careless"], "a": 3, "e": "reckless = liều lĩnh, bất cẩn = careless."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Every rooftop thermometer installed by an amateur is automatically 100% accurate.", "Context and practical implementation details matter for long-term success."], "a": 2, "e": "Nhận định C ('Every rooftop thermometer installed by an amateur is automatically 100% accurate.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer introduce the technical term for combining citizen sensors with computer weather models?", "o": ["Paragraph 1", "Paragraph 3", "Paragraph 2", "Paragraph 4"], "a": 1, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer explain how software prevents poorly placed home sensors from distorting forecasts?", "o": ["Paragraph 4", "Paragraph 1", "Paragraph 3", "Paragraph 2"], "a": 0, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "When conservationists campaign to protect marine life, colourful coral reefs and charismatic whales usually capture the public spotlight. Far less famous are the underwater carpets of seagrass that sway quietly in shallow coastal bays. Yet marine biologists increasingly recognise that these submerged flowering plants—the only true plants adapted to live entirely under the sea—perform services vital to the planet.\n\nAlthough seagrass meadows cover less than 0.2 percent of the ocean floor, they lock away carbon in underwater sediment up to thirty times faster than terrestrial forests of the same size, outperforming <b>those</b> on land by a wide margin. <u>Because wet coastal mud contains very little oxygen, fallen leaves and roots buried beneath the seabed can remain trapped for centuries without decaying.</u>\n\nTheir value to coastal communities is equally <b>profound</b>. Dense blades of grass shelter juvenile cod, seahorses and shrimp, while their root mats bind sandy seabeds together and soften incoming waves. Scientists call this ocean-based carbon storage 'blue carbon', placing seagrass alongside mangroves and salt marshes as frontline climate allies.\n\nIt would be <b>complacent</b>, however, to assume that seagrass meadows will look after themselves. Boat anchors dragging across shallow bays, agricultural fertilizer runoff and coastal dredging have wiped out nearly a third of global seagrass area over the past century. Replacing heavy chain moorings with eco-friendly buoys and replanting seagrass shoots by hand show that protecting the ocean's quiet meadows is well within our reach.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["contrasting the low public profile of seagrass with its immense ecological importance", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 0, "e": "Đoạn 1 tập trung vào việc: 'contrasting the low public profile of seagrass with its immense ecological importance'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["whales", "coastal bays", "coral reefs", "forests"], "a": 3, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'forests'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["The underlined process requires no effort and produces the opposite outcome.", "Researchers found that the two groups showed no difference under any circumstances.", "The lack of oxygen in underwater mud prevents buried plant matter from rotting, keeping carbon locked away for hundreds of years.", "Scientists recommend avoiding this activity altogether to save time."], "a": 2, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi C: 'The lack of oxygen in underwater mud prevents buried plant matter from rotting, keeping carbon locked away for hundreds of years.'."}, {"s": "The word <b>profound</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["deep", "superficial", "significant", "far-reaching"], "a": 1, "e": "profound (sâu sắc, to lớn) trái nghĩa với superficial (nông cạn, bề ngoài)."}, {"s": "The word <b>complacent</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["overconfident", "anxious", "humble", "energetic"], "a": 0, "e": "complacent = chủ quan, tự mãn = overconfident."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success.", "Seagrass meadows are immune to human activities such as boating and farming runoff."], "a": 3, "e": "Nhận định D ('Seagrass meadows are immune to human activities such as boating and farming runoff.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer define the scientific term used for carbon stored in coastal and marine ecosystems?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 2, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer describe human threats to seagrass and practical steps to restore it?", "o": ["Paragraph 2", "Paragraph 4", "Paragraph 3", "Paragraph 1"], "a": 1, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Fifty years ago, a neighbourhood grocery store typically stocked two or three kinds of toothpaste and a single shelf of cooking oil. Walk into a modern hypermarket or open an online shopping app today, and you are greeted by fifty varieties of toothpaste—whitening, herbal, charcoal, sensitive, mint-gel—and thousands of customer reviews. Conventional wisdom assumes that more choice always equals greater freedom and satisfaction.\n\nIn a landmark experiment at a gourmet food market, psychologists tested that assumption by setting up a tasting booth for fruit jam. Shoppers who encountered a display of twenty-four flavours stopped to look more often than <b>those</b> who saw a table with only six jars. <u>When it came to actually buying a jar, however, people facing the smaller selection were ten times more likely to make a purchase.</u>\n\nPsychologists call this phenomenon 'choice overload'. When options multiply beyond a manageable number, comparing every small difference becomes mentally exhausting, and buyers feel a nagging fear that another jar might have been better. This regret is most <b>acute</b> among 'maximisers'—people who feel compelled to read every review in search of the absolute best option.\n\nIt would be <b>extreme</b>, of course, to wish for empty shelves or no variety at all. Having options matters deeply in medicine, education and career paths. Yet in everyday consumer life, learning to be a 'satisficer'—someone who sets clear criteria and happily picks the first product that meets them—saves both time and peace of mind.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["questioning the honesty of all university researchers", "challenging the common belief that having more consumer options always makes us happier", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 1, "e": "Đoạn 1 tập trung vào việc: 'challenging the common belief that having more consumer options always makes us happier'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["shoppers", "flavours", "psychologists", "toothpastes"], "a": 0, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'shoppers'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Scientists recommend avoiding this activity altogether to save time.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Customers presented with only six jam options bought a jar at ten times the rate of those given twenty-four choices."], "a": 3, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi D: 'Customers presented with only six jam options bought a jar at ten times the rate of those given twenty-four choices.'."}, {"s": "The word <b>acute</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["intense", "sharp", "mild", "severe"], "a": 2, "e": "acute (gay gắt, sâu sắc) trái nghĩa với mild (nhẹ nhàng)."}, {"s": "The word <b>extreme</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["moderate", "unreasonable", "fair", "calm"], "a": 1, "e": "extreme = cực đoan, thái quá = unreasonable."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Shoppers given twenty-four flavours of jam bought ten times more jars than those given six.", "A balanced, thoughtful approach yields better results than extreme positions.", "Evidence from studies helps clarify how this phenomenon works in practice.", "Context and practical implementation details matter for long-term success."], "a": 0, "e": "Nhận định A ('Shoppers given twenty-four flavours of jam bought ten times more jars than those given six.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer introduce the psychological term for mental fatigue caused by too many options?", "o": ["Paragraph 4", "Paragraph 1", "Paragraph 2", "Paragraph 3"], "a": 3, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer advise consumers on how to make decisions without exhausting themselves?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 4", "Paragraph 3"], "a": 2, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Whenever a city council proposes closing a historic shopping street to private cars and motorbikes, the loudest objections usually come from local shopkeepers. Store owners understandably worry that if drivers cannot park right outside their front door, customers will take their business to suburban shopping malls with giant car parks. Over the past thirty years, however, hundreds of cities have put that fear to the test.\n\nFollow-up surveys from Madrid to Ljubljana tell a remarkably consistent story. After central avenues were turned into tree-lined pedestrian zones with wide pavements and tram stops, retail sales in ground-floor shops rose more steadily than in <b>those</b> that remained choked with traffic. <u>Freed from exhaust fumes and the noise of engines, passers-by walked more slowly, noticed window displays and lingered over coffee or books.</u>\n\nUrban economists attribute this boost to what they term 'dwell time'—the simple principle that the longer people enjoy being in a public space, the more likely they are to support local businesses. Vacancy rates for shopfronts on pedestrianised streets typically fall, while air quality improves <b>dramatically</b> within weeks.\n\nIt would be <b>unfair</b>, however, to ignore the practical logistics that businesses and elderly residents require. A successful car-free zone cannot simply put up concrete barriers overnight; it needs frequent electric shuttle buses, step-free access for wheelchairs and designated early-morning hours for delivery vans. When those details are planned with care, streets designed for feet rather than wheels benefit merchants and citizens alike.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["arguing that modern technology should be completely outlawed", "questioning the honesty of all university researchers", "contrasting shopkeepers' initial fears about car-free streets with the actual test results", "listing historical dates without any central argument"], "a": 2, "e": "Đoạn 1 tập trung vào việc: 'contrasting shopkeepers' initial fears about car-free streets with the actual test results'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["surveys", "streets", "tram stops", "malls"], "a": 1, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'streets'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Without traffic noise and fumes, pedestrians strolled at a relaxed pace and paid more attention to local shops and cafés.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Scientists recommend avoiding this activity altogether to save time."], "a": 0, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi A: 'Without traffic noise and fumes, pedestrians strolled at a relaxed pace and paid more attention to local shops and cafés.'."}, {"s": "The word <b>dramatically</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["rapidly", "considerably", "sharply", "negligibly"], "a": 3, "e": "dramatically (đáng kể, mạnh mẽ) trái nghĩa với negligibly (không đáng kể)."}, {"s": "The word <b>unfair</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["balanced", "reasonable", "unjust", "helpful"], "a": 2, "e": "unfair = không công bằng, phiến diện = unjust."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "Closing a street to cars succeeds best when delivery vans and public buses are banned completely at all hours.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success."], "a": 1, "e": "Nhận định B ('Closing a street to cars succeeds best when delivery vans and public buses are banned completely at all hours.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer explain the economic concept linking time spent in a pleasant street to higher retail spending?", "o": ["Paragraph 3", "Paragraph 1", "Paragraph 2", "Paragraph 4"], "a": 0, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer outline the transport and accessibility arrangements needed for a car-free street to work fairly?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 3, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "School science textbooks often present history as a neat parade of geniuses who marched straight from a brilliant hypothesis to a famous discovery. Students read about Isaac Newton's apple, Marie Curie's radium or Alexander Fleming's penicillin and easily assume that great scientists rarely make mistakes. Actual laboratory notebooks, however, tell a very different story.\n\nWhen historians examine the daily logs of pioneering researchers, they find hundreds of failed trials, contaminated samples and puzzling results that differed from <b>those</b> predicted by theory. <u>Far from being wasted time, unexpected failures often point directly to where existing knowledge is incomplete.</u> Fleming discovered penicillin precisely because he paused to ask why a stray mould had ruined his bacterial culture dish instead of throwing the dish straight into the washbasin.\n\nCognitive scientists call this productive openness to anomalies 'serendipity preparedness'. A researcher with a prepared mind does not merely follow a recipe; when an experiment goes wrong, they treat the error as a clue rather than a personal embarrassment. Progress in science is therefore rarely <b>linear</b>.\n\nIt would be <b>misleading</b>, of course, to claim that careless mistakes are something to celebrate. Sloppy measurement and unwashed test tubes only create confusion. The lesson for science classrooms is more specific: when a student's experiment yields an unexpected graph, asking 'Why did that happen?' teaches far more about scientific thinking than copying a tidy number from a neighbour's lab sheet.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["listing historical dates without any central argument", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "contrasting the tidy image of science in textbooks with the messy reality of laboratory research"], "a": 3, "e": "Đoạn 1 tập trung vào việc: 'contrasting the tidy image of science in textbooks with the messy reality of laboratory research'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["historians", "notebooks", "results", "geniuses"], "a": 2, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'results'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Researchers found that the two groups showed no difference under any circumstances.", "Surprising experimental failures are valuable because they reveal gaps in current scientific understanding.", "The underlined process requires no effort and produces the opposite outcome.", "Scientists recommend avoiding this activity altogether to save time."], "a": 1, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi B: 'Surprising experimental failures are valuable because they reveal gaps in current scientific understanding.'."}, {"s": "The word <b>linear</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["circuitous", "straightforward", "direct", "sequential"], "a": 0, "e": "linear (thẳng tắp, tuyến tính) trái nghĩa với circuitous (quanh co, vòng vèo)."}, {"s": "The word <b>misleading</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["helpful", "accurate", "honest", "deceptive"], "a": 3, "e": "misleading = gây hiểu lầm = deceptive."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Careless measurement and dirty lab equipment are the main drivers of scientific breakthroughs.", "Context and practical implementation details matter for long-term success."], "a": 2, "e": "Nhận định C ('Careless measurement and dirty lab equipment are the main drivers of scientific breakthroughs.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer name the cognitive trait that allows scientists to turn unexpected anomalies into discoveries?", "o": ["Paragraph 1", "Paragraph 3", "Paragraph 2", "Paragraph 4"], "a": 1, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer distinguish between useful experimental anomalies and careless laboratory errors?", "o": ["Paragraph 4", "Paragraph 1", "Paragraph 3", "Paragraph 2"], "a": 0, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "In many modern cities, two demographic challenges sit side by side without touching. On one hand, university students and young workers struggle to find affordable rooms near their campuses and offices; on the other, many retired seniors live alone in spacious family homes where children have grown up and moved away. Over the past decade, social innovators from the Netherlands to Japan and Vietnam have begun connecting these two groups.\n\nUnder 'homeshare' and intergenerational housing programmes, university students receive a rent-free or low-cost bedroom in a senior's home or retirement residence. In return, they commit to spending five to seven hours a week eating dinner together, helping with heavy grocery bags or teaching smartphone skills—tasks far simpler than <b>those</b> of professional nursing staff. <u>What begins as a practical housing arrangement quickly blossoms into genuine companionship across generations.</u>\n\nHealth researchers studying these programmes report <b>remarkable</b> benefits for older residents. Loneliness—which doctors link to higher risks of depression and cognitive decline—drops sharply when there is a cheerful voice in the kitchen each evening. Sociologists term this mutually supportive bond 'intergenerational reciprocity'.\n\nIt would be <b>unrealistic</b>, however, to pair strangers at random and expect instant harmony. Differences in sleeping hours, kitchen tidiness and musical taste can easily cause friction if expectations are not discussed upfront. Successful programmes therefore interview both sides carefully, set clear house rules on quiet hours and provide a coordinator to mediate minor misunderstandings.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["describing two urban social challenges and an innovative housing model that connects them", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 0, "e": "Đoạn 1 tập trung vào việc: 'describing two urban social challenges and an innovative housing model that connects them'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["programmes", "seniors", "bedrooms", "tasks"], "a": 3, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'tasks'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["The underlined process requires no effort and produces the opposite outcome.", "Researchers found that the two groups showed no difference under any circumstances.", "A pragmatic agreement to share living space soon grows into warm, authentic friendship between young and old.", "Scientists recommend avoiding this activity altogether to save time."], "a": 2, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi C: 'A pragmatic agreement to share living space soon grows into warm, authentic friendship between young and old.'."}, {"s": "The word <b>remarkable</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["extraordinary", "insignificant", "notable", "impressive"], "a": 1, "e": "remarkable (đáng kể, nổi bật) trái nghĩa với insignificant (nhỏ nhặt, không đáng kể)."}, {"s": "The word <b>unrealistic</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["impractical", "sensible", "reasonable", "hopeful"], "a": 0, "e": "unrealistic = phi thực tế = impractical."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success.", "Any student and senior paired at random will live together harmoniously without rules or screening."], "a": 3, "e": "Nhận định D ('Any student and senior paired at random will live together harmoniously without rules or screening.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer introduce the sociological term for mutual support between different age groups?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 2, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer explain the practical screening and rules needed to prevent household friction?", "o": ["Paragraph 2", "Paragraph 4", "Paragraph 3", "Paragraph 1"], "a": 1, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 2, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Throughout the twentieth century, concrete dams and straight concrete channels were built across thousands of rivers to power mills, irrigate fields and control floods. Today, however, tens of thousands of small weirs and barriers have outlived their original purpose: the mills they once served closed decades ago, and their ageing walls now trap silt, warm the water and block fish from swimming upstream to spawn.\n\nAcross Europe and North America, water engineers and conservationists are taking a bold step: dismantling obsolete river barriers. Monitoring teams have found that rivers freed from old dams recover their natural life far more rapidly than <b>those</b> left divided into stagnant ponds. <u>Within a single spring of a barrier being removed, migratory fish such as salmon and shad often return to ancestral spawning gravels they had not reached in a century.</u>\n\nThe ecological rebound is <b>comprehensive</b>. Flowing water carries nutrient-rich sediment back to coastal deltas, kingfishers and otters return to the banks, and cooler, oxygen-rich rapids replace warm algae blooms. Hydrologists call this restoration of natural flow and sediment transport 'fluvial connectivity'.\n\nIt would be <b>foolish</b>, of course, to demolish every dam on Earth. Large hydroelectric reservoirs and active irrigation dams remain vital for clean electricity and food security. The movement focuses instead on removing deadbeat barriers that no longer serve society—proving that sometimes the smartest engineering project is knowing what to take down.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["questioning the honesty of all university researchers", "explaining why many old river barriers have become harmful and obsolete", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 1, "e": "Đoạn 1 tập trung vào việc: 'explaining why many old river barriers have become harmful and obsolete'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["waterways", "engineers", "monitoring teams", "mills"], "a": 0, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'waterways'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Scientists recommend avoiding this activity altogether to save time.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Just months after an old dam is taken down, migrating fish frequently swim back to breeding grounds blocked for a hundred years."], "a": 3, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi D: 'Just months after an old dam is taken down, migrating fish frequently swim back to breeding grounds blocked for a hundred years.'."}, {"s": "The word <b>comprehensive</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["thorough", "complete", "partial", "extensive"], "a": 2, "e": "comprehensive (toàn diện) trái nghĩa với partial (một phần, phiến diện)."}, {"s": "The word <b>foolish</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["clever", "unwise", "prudent", "careful"], "a": 1, "e": "foolish = dại dột, thiếu khôn ngoan = unwise."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Conservationists want to demolish all active hydroelectric and irrigation dams immediately.", "A balanced, thoughtful approach yields better results than extreme positions.", "Evidence from studies helps clarify how this phenomenon works in practice.", "Context and practical implementation details matter for long-term success."], "a": 0, "e": "Nhận định A ('Conservationists want to demolish all active hydroelectric and irrigation dams immediately.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer provide the hydrological term for restoring a river's natural flow and sediment movement?", "o": ["Paragraph 4", "Paragraph 1", "Paragraph 2", "Paragraph 3"], "a": 3, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer clarify which dams should be kept and which obsolete barriers should be removed?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 4", "Paragraph 3"], "a": 2, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "When school budgets tighten or exam timetables grow crowded, music lessons are often the first subject to be trimmed. Many parents and administrators view playing the flute, guitar or bamboo xylophone as a pleasant hobby for talented children, but secondary to 'core' subjects like mathematics and reading. Over the past twenty years, however, auditory neuroscientists have challenged that hierarchy.\n\nPlaying an instrument is one of the most demanding workouts the human brain can perform. In longitudinal studies, children who took two years of group music lessons showed stronger neural responses to speech sounds than <b>those</b> who attended only passive appreciation classes. <u>Reading notes on a page, coordinating both hands and listening to pitch in real time require the visual, motor and auditory cortices to fire in millisecond harmony.</u>\n\nThese gains carry over into everyday classrooms in <b>measurable</b> ways. Trained young musicians are better at picking out a teacher's voice in a noisy room and detecting subtle changes in tone that signal grammar and emotion in foreign languages. Neuroscientists refer to this cross-domain strengthening of sound processing as 'neuroplastic transfer'.\n\nIt would be <b>exaggerated</b>, however, to market music lessons as a magic pill that turns every child into a math prodigy overnight. A student forced to practise an instrument they hate will gain more stress than cognitive benefit. Music belongs in schools not merely because it sharpens the ear for language, but because making music together brings joy, discipline and shared humanity that no test score can capture.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["arguing that modern technology should be completely outlawed", "questioning the honesty of all university researchers", "challenging the view that music education is an expendable luxury compared to core subjects", "listing historical dates without any central argument"], "a": 2, "e": "Đoạn 1 tập trung vào việc: 'challenging the view that music education is an expendable luxury compared to core subjects'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["administrators", "peers / children", "speech sounds", "instruments"], "a": 1, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'peers / children'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Playing music demands simultaneous millisecond coordination across the brain's sight, movement and hearing centres.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Scientists recommend avoiding this activity altogether to save time."], "a": 0, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi A: 'Playing music demands simultaneous millisecond coordination across the brain's sight, movement and hearing centres.'."}, {"s": "The word <b>measurable</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["observable", "quantifiable", "clear", "imperceptible"], "a": 3, "e": "measurable (có thể đo lường, rõ rệt) trái nghĩa với imperceptible (không thể nhận thấy)."}, {"s": "The word <b>exaggerated</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["accurate", "modest", "overstated", "understated"], "a": 2, "e": "exaggerated = phóng đại, cường điệu = overstated."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "Forcing a child to play an instrument they dislike still guarantees top mathematics scores.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success."], "a": 1, "e": "Nhận định B ('Forcing a child to play an instrument they dislike still guarantees top mathematics scores.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer cite the neuroscience term for how musical training strengthens speech and language processing?", "o": ["Paragraph 3", "Paragraph 1", "Paragraph 2", "Paragraph 4"], "a": 0, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer argue that the intrinsic joy and social value of music matter beyond its academic side effects?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 3, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Over the past decade, installing wooden beehives on the roofs of city hotels, banks and schools has become a popular badge of corporate environmental responsibility. Well-meaning organisations proudly harvest 'rooftop honey' and announce that they are saving the bees. Ecologists who study urban insects, however, warn that adding thousands of domesticated honeybees to a city is not the same as conserving wildlife.\n\nThe European honeybee is a managed agricultural species, much like chickens or cattle. In cities where parks and flowerbeds are limited, a single rooftop hive containing fifty thousand honeybees can outcompete native solitary bees and bumblebees that forage more locally than <b>those</b> kept by beekeepers. <u>Put simply, bringing in millions of honeybees without planting more flowers is like inviting ten thousand extra guests to a dinner party without cooking more food.</u>\n\nFor many wild plants, this competition is <b>critical</b>. Native bees have co-evolved with local wildflowers and trees that honeybees cannot pollinate effectively; ecologists call this specialised partnership 'pollination syndrome'. When wild bees are crowded out by high hive densities, the reproduction of native park flora suffers too.\n\nIt would be <b>unfair</b>, of course, to blame urban beekeepers, whose enthusiasm has raised public love for insects. Several cities have found a sensible middle ground: regulating the distance between rooftop hives and requiring every new hive permit to be matched with a newly planted wildflower plot. Helping bees in the city, it turns out, starts with planting the buffet before inviting the guests.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["listing historical dates without any central argument", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "questioning whether adding more urban honeybee hives genuinely helps wild pollinator conservation"], "a": 3, "e": "Đoạn 1 tập trung vào việc: 'questioning whether adding more urban honeybee hives genuinely helps wild pollinator conservation'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["hotels", "chickens", "colonies / hives", "flowerbeds"], "a": 2, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'colonies / hives'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Researchers found that the two groups showed no difference under any circumstances.", "Adding vast numbers of honeybees to a city without increasing floral resources leaves wild pollinators short of food.", "The underlined process requires no effort and produces the opposite outcome.", "Scientists recommend avoiding this activity altogether to save time."], "a": 1, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi B: 'Adding vast numbers of honeybees to a city without increasing floral resources leaves wild pollinators short of food.'."}, {"s": "The word <b>critical</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["trivial", "vital", "serious", "crucial"], "a": 0, "e": "critical (nghiêm trọng, hệ trọng) trái nghĩa với trivial (nhỏ nhặt, không quan trọng)."}, {"s": "The word <b>unfair</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["accurate", "just", "kind", "unreasonable"], "a": 3, "e": "unfair = bất công, không hợp lý = unreasonable."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Installing as many honeybee hives as possible on every roof is the best way to protect wild bumblebees.", "Context and practical implementation details matter for long-term success."], "a": 2, "e": "Nhận định C ('Installing as many honeybee hives as possible on every roof is the best way to protect wild bumblebees.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer name the ecological term for the specialised evolutionary match between native flowers and pollinators?", "o": ["Paragraph 1", "Paragraph 3", "Paragraph 2", "Paragraph 4"], "a": 1, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer propose a policy solution that balances urban beekeeping with floral habitat creation?", "o": ["Paragraph 4", "Paragraph 1", "Paragraph 3", "Paragraph 2"], "a": 0, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "For most of the twentieth century, modern hospitals were designed like sterile machines: long windowless corridors, fluorescent lighting and blank white walls meant to maximise hygiene and floor efficiency. Gardens and courtyards, once common in nineteenth-century infirmaries, were paved over for car parks and equipment wings. In 1984, however, environmental psychologist Roger Ulrich published a study that changed how architects think about healing spaces.\n\nUlrich examined the medical records of patients recovering from identical gallbladder surgeries in a suburban hospital. Half of the patients occupied rooms overlooking a small stand of deciduous trees, while the other half looked out at a brown brick wall. Patients with the tree view requested strong painkillers far less frequently and were discharged almost a full day earlier than <b>those</b> facing the bricks. <u>Even nurses' notes recorded far fewer negative comments about mood and anxiety among the patients who could see greenery.</u>\n\nSubsequent clinical trials have confirmed that this effect is both <b>consistent</b> and physiological. Viewing natural foliage, water or even high-resolution nature photographs lowers heart rate and cortisol levels within minutes—a response researchers call 'biophilic stress recovery'. Because stress hormones slow down immune function and tissue repair, a calmer patient literally heals faster.\n\nIt would be <b>absurd</b>, of course, to suggest that a pleasant window view can replace skilled surgeons, antibiotics or clean operating theatres. Rather, Ulrich's work shows that the physical environment is an active partner in medical care. Today, new hospitals from Singapore to Hue are incorporating rooftop healing gardens and sunlit courtyards, proving that nature is good medicine too.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["describing how a landmark 1984 study challenged sterile, windowless hospital design", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 0, "e": "Đoạn 1 tập trung vào việc: 'describing how a landmark 1984 study challenged sterile, windowless hospital design'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["surgeons", "trees", "records", "patients"], "a": 3, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'patients'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["The underlined process requires no effort and produces the opposite outcome.", "Researchers found that the two groups showed no difference under any circumstances.", "Nurses observed noticeably better emotional states and less anxiety in patients whose windows faced trees.", "Scientists recommend avoiding this activity altogether to save time."], "a": 2, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi C: 'Nurses observed noticeably better emotional states and less anxiety in patients whose windows faced trees.'."}, {"s": "The word <b>consistent</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["steady", "erratic", "reliable", "regular"], "a": 1, "e": "consistent (nhất quán, ổn định) trái nghĩa với erratic (thất thường, không ổn định)."}, {"s": "The word <b>absurd</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["ridiculous", "sensible", "wise", "logical"], "a": 0, "e": "absurd = vô lý, ngớ ngẩn = ridiculous."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success.", "Looking at trees through a window can completely replace surgery and antibiotics."], "a": 3, "e": "Nhận định D ('Looking at trees through a window can completely replace surgery and antibiotics.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer introduce the scientific term for the body's rapid stress reduction when exposed to nature?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 2, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer clarify that green design complements—rather than replaces—modern medical treatment?", "o": ["Paragraph 2", "Paragraph 4", "Paragraph 3", "Paragraph 1"], "a": 1, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Today's high school and university students read more words per day than any generation in history, yet most of those words glow on glass screens rather than sitting on paper pages. Digital texts offer undeniable advantages: a single tablet can hold a thousand textbooks, search for a keyword in a millisecond and adjust font size for tired eyes. When it comes to deep comprehension of long, complex arguments, however, researchers have uncovered a surprising gap.\n\nIn a meta-analysis of over fifty studies involving more than 170,000 readers, psychologists found that students who read informational texts on paper scored consistently higher on comprehension tests than <b>those</b> who read the exact same passages on screens. <u>The gap was widest when readers had to reconstruct the sequence of events or grasp the author's overall argument under a time limit.</u>\n\nResearchers attribute part of this difference to what they call 'screen inferiority'—our habit of skimming and scrolling quickly on digital devices because we associate screens with casual messages and social media. In addition, a physical book offers tactile spatial landmarks: knowing that a key definition was near the top-left corner about a quarter of the way through the volume helps the brain build a <b>coherent</b> mental map of the text.\n\nIt would be <b>pointless</b>, however, to nostalgia-trip into the past or print out every short email. For quick lookups, short news articles and collaborative editing, screens are unmatched. The practical takeaway for students is to match the medium to the task—and when studying a dense chapter on a tablet, to slow down, annotate actively and resist the urge to skim.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["questioning the honesty of all university researchers", "weighing the convenience of digital screens against research questions about deep reading comprehension", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 1, "e": "Đoạn 1 tập trung vào việc: 'weighing the convenience of digital screens against research questions about deep reading comprehension'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["readers / students", "tablets", "textbooks", "keywords"], "a": 0, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'readers / students'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Scientists recommend avoiding this activity altogether to save time.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Paper readers outperformed screen readers most clearly on timed tasks requiring overall comprehension or event sequencing."], "a": 3, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi D: 'Paper readers outperformed screen readers most clearly on timed tasks requiring overall comprehension or event sequencing.'."}, {"s": "The word <b>coherent</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["connected", "logical", "fragmented", "clear"], "a": 2, "e": "coherent (mạch lạc, gắn kết) trái nghĩa với fragmented (rời rạc, vụn vỡ)."}, {"s": "The word <b>pointless</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["valuable", "useless", "urgent", "clever"], "a": 1, "e": "pointless = vô ích, không cần thiết = useless."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Students should print out every single short email and never use tablets for quick searches.", "A balanced, thoughtful approach yields better results than extreme positions.", "Evidence from studies helps clarify how this phenomenon works in practice.", "Context and practical implementation details matter for long-term success."], "a": 0, "e": "Nhận định A ('Students should print out every single short email and never use tablets for quick searches.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer name the psychological phenomenon describing shallower reading habits on digital devices?", "o": ["Paragraph 4", "Paragraph 1", "Paragraph 2", "Paragraph 3"], "a": 3, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer advise students on how to choose between paper and screens and how to read more deeply on tablets?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 4", "Paragraph 3"], "a": 2, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Drive across many tropical highlands and you will see hillsides covered in neat rows of coffee bushes standing in full, blazing sun. In the late twentieth century, agricultural advisers encouraged farmers to clear native shade trees so they could pack more coffee plants onto each hectare and boost short-term yields with chemical fertilizers. Decades later, the hidden costs of that sun-grown monoculture have become impossible to ignore.\n\nWithout a canopy of taller trees to shelter them, exposed hillside soils bake in the dry season and wash away during heavy monsoon rains. Farmers who intercrop coffee with fruit, nut and timber trees—a practice known as agroforestry—enjoy far more stable harvests over twenty-year cycles than <b>those</b> who rely on open-sun fields. <u>Although shade-grown bushes produce slightly fewer cherries in a single peak year, they live longer and suffer far less damage during droughts and frosts.</u>\n\nThe ecological and economic rewards are <b>substantial</b>. Fallen leaves from shade trees form a natural mulch that suppresses weeds and feeds soil microbes, while blossoms and fruit attract insect-eating birds that keep coffee borers in check. Agronomists call this self-sustaining balance 'ecological intensification'.\n\nIt would be <b>naive</b>, however, to expect smallholders to plant shade trees overnight without financial support. Newly planted avocado or macadamia trees take several years to bear fruit, creating a temporary dip in income. Fair-trade price premiums and low-interest transition loans are therefore essential to help farmers bridge those early years and build resilient mountain farms.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["arguing that modern technology should be completely outlawed", "questioning the honesty of all university researchers", "explaining the shift to sun-grown coffee monoculture and its long-term drawbacks", "listing historical dates without any central argument"], "a": 2, "e": "Đoạn 1 tập trung vào việc: 'explaining the shift to sun-grown coffee monoculture and its long-term drawbacks'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["hillsides", "growers / farmers", "advisers", "monsoon rains"], "a": 1, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'growers / farmers'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Shade-grown coffee plants have a longer lifespan and greater resilience to extreme weather, despite slightly lower peak-year yields.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Scientists recommend avoiding this activity altogether to save time."], "a": 0, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi A: 'Shade-grown coffee plants have a longer lifespan and greater resilience to extreme weather, despite slightly lower peak-year yields.'."}, {"s": "The word <b>substantial</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["generous", "considerable", "significant", "meagre"], "a": 3, "e": "substantial (đáng kể, to lớn) trái nghĩa với meagre (ít ỏi, nghèo nàn)."}, {"s": "The word <b>naive</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["experienced", "wise", "unrealistic", "careful"], "a": 2, "e": "naive = ngây thơ, thiếu thực tế = unrealistic."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "Newly planted shade trees produce full harvests of fruit and nuts on the very first day.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success."], "a": 1, "e": "Nhận định B ('Newly planted shade trees produce full harvests of fruit and nuts on the very first day.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer introduce the agronomic term for using natural ecosystem processes to sustain farm productivity?", "o": ["Paragraph 3", "Paragraph 1", "Paragraph 2", "Paragraph 4"], "a": 0, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer explain why financial support is needed during the transition to agroforestry?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 3, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Ask a group of high school students how they prepare for a big history or biology exam, and the most common answer
