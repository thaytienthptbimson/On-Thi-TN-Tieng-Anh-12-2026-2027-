is simple: they read their textbook and highlighted notes over and over again. By the third or fourth reading, the sentences look wonderfully familiar, giving the student a warm sense of confidence. Cognitive psychologists, however, warn that familiarity is not the same thing as mastery.\n\nRecognising a page when it is open in front of you requires far less mental effort than retrieving that same fact from memory in a quiet exam hall. In controlled experiments, students who read a passage once and then closed the book to write down everything they could remember retained fifty percent more a week later than <b>those</b> who spent the same amount of time rereading the passage four times. <u>Each time we struggle to pull a memory out of storage, the neural pathway to that memory grows stronger and easier to find next time.</u>\n\nPsychologists call this counter-intuitive phenomenon the 'testing effect' or active recall. Ironically, students in the experiments predicted that rereading would work better because it felt smooth and effortless, whereas self-testing felt <b>strenuous</b> and exposed what they had forgotten.\n\nIt would be <b>rash</b>, of course, to throw away your textbooks or skip reading altogether; you cannot recall a concept you have never understood in the first place. Careful initial reading builds the foundation, but closing the notebook to quiz yourself with flashcards or practice questions is what cements that knowledge for the long run.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["listing historical dates without any central argument", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "contrasting students' preference for passive rereading with psychological insights on memory"], "a": 3, "e": "Đoạn 1 tập trung vào việc: 'contrasting students' preference for passive rereading with psychological insights on memory'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["textbooks", "experiments", "students", "passages"], "a": 2, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'students'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Researchers found that the two groups showed no difference under any circumstances.", "Actively retrieving information from memory reinforces its neural pathway, making future recall easier.", "The underlined process requires no effort and produces the opposite outcome.", "Scientists recommend avoiding this activity altogether to save time."], "a": 1, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi B: 'Actively retrieving information from memory reinforces its neural pathway, making future recall easier.'."}, {"s": "The word <b>strenuous</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["effortless", "demanding", "arduous", "tiring"], "a": 0, "e": "strenuous (vất vả, đòi hỏi nhiều nỗ lực) trái nghĩa với effortless (dễ dàng, không tốn sức)."}, {"s": "The word <b>rash</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["patient", "sensible", "careful", "hasty"], "a": 3, "e": "rash = hấp tấp, vội vàng = hasty."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Students should never read a textbook first and should only guess answers blindly.", "Context and practical implementation details matter for long-term success."], "a": 2, "e": "Nhận định C ('Students should never read a textbook first and should only guess answers blindly.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer give the psychological name for the memory boost gained by self-quizzing?", "o": ["Paragraph 1", "Paragraph 3", "Paragraph 2", "Paragraph 4"], "a": 1, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer show how initial comprehension reading and active recall complement each other?", "o": ["Paragraph 4", "Paragraph 1", "Paragraph 3", "Paragraph 2"], "a": 0, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "Along temperate and subtropical estuaries, flat expanses of salt-tolerant grasses flood and drain twice a day with the rhythm of the tides. For centuries, land planners viewed these muddy salt marshes as unproductive mosquito breeding grounds and drained them behind embankments to create pasture or industrial estates. Today, climate scientists are racing to undo that historical mistake.\n\nLike tropical mangroves, healthy salt marshes are extraordinary natural sponges and carbon vaults. In side-by-side coastal comparisons, shorelines bordered by wide salt marshes suffered far less erosion during storm surges than <b>those</b> defended only by bare concrete walls. <u>As incoming waves roll across the dense carpet of marsh grass, friction slows the water down and absorbs much of its destructive energy.</u>\n\nEqually impressive is how salt marshes respond to rising sea levels. When tides wash over the grass, stems trap suspended mud and sand, allowing the marsh surface to build upwards by several millimetres each year—a self-elevating process geomorphologists call 'vertical accretion'. This natural adaptability makes marshes remarkably <b>resilient</b>.\n\nIt would be <b>optimistic</b> to a fault, however, to think marshes can survive unlimited sea-level rise if they are squeezed against coastal highways and seawalls. When water rises faster than sediment can accumulate, a marsh must gradually migrate inland onto gently sloping ground. Leaving buffer zones behind coastal wetlands is therefore essential if these living shields are to protect our shores in the decades ahead.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["showing how attitudes towards coastal salt marshes have shifted from draining them to restoring them", "questioning the honesty of all university researchers", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 0, "e": "Đoạn 1 tập trung vào việc: 'showing how attitudes towards coastal salt marshes have shifted from draining them to restoring them'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["mosquitos", "tides", "industrial estates", "stretches of shoreline"], "a": 3, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'stretches of shoreline'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["The underlined process requires no effort and produces the opposite outcome.", "Researchers found that the two groups showed no difference under any circumstances.", "Dense marsh vegetation creates friction that decelerates storm waves and dissipates their damaging force.", "Scientists recommend avoiding this activity altogether to save time."], "a": 2, "e": "Câu gạch chân ở đoạn 2 được diễn đạt lại chuẩn xác nhất bởi C: 'Dense marsh vegetation creates friction that decelerates storm waves and dissipates their damaging force.'."}, {"s": "The word <b>resilient</b> in paragraph 3 is OPPOSITE in meaning to ______.", "o": ["tough", "vulnerable", "adaptable", "hardy"], "a": 1, "e": "resilient (bền bỉ, có sức chống chịu cao) trái nghĩa với vulnerable (dễ bị tổn thương)."}, {"s": "The word <b>optimistic</b> in paragraph 4 is CLOSEST in meaning to ______.", "o": ["unrealistic", "gloomy", "cautious", "doubtful"], "a": 0, "e": "optimistic to a fault = lạc quan quá mức / thiếu thực tế = unrealistic."}, {"s": "Which of the following statements would the writer NOT agree with?", "o": ["Evidence from studies helps clarify how this phenomenon works in practice.", "A balanced, thoughtful approach yields better results than extreme positions.", "Context and practical implementation details matter for long-term success.", "Salt marshes can survive any rate of sea-level rise even when blocked inland by concrete highways."], "a": 3, "e": "Nhận định D ('Salt marshes can survive any rate of sea-level rise even when blocked inland by concrete highways.') mâu thuẫn trực tiếp với lập luận của tác giả trong bài."}, {"s": "In which paragraph does the writer name the geological process by which marshes trap sediment and grow higher over time?", "o": ["Paragraph 2", "Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 2, "e": "Thông tin thuật ngữ chuyên môn này nằm ở Đoạn 3 (Paragraph 3)."}, {"s": "In which paragraph does the writer explain why coastal marshes need inland buffer space as sea levels rise?", "o": ["Paragraph 2", "Paragraph 4", "Paragraph 3", "Paragraph 1"], "a": 1, "e": "Nội dung cảnh báo khái quát hóa / định hướng thực tế này nằm ở Đoạn 4 (Paragraph 4)."}]}]}, {"lv": 3, "secs": [{"h": "Đọc hiểu 2 (8 câu)", "p": "How many hours in its entire lifetime is the average household electric drill actually used? Industrial designers who have studied the question estimate the answer is between fifteen and twenty minutes. Millions of apartment cupboards across the world hold identical drills, ladders, sewing machines and pressure washers that sit gathering dust for 364 days a year.\n\nTo reduce this duplication, neighbourhood 'tool libraries' and 'libraries of things' have opened in hundreds of cities. Operating much like a traditional book library, members pay a modest annual fee or use their municipal library card to borrow equipment when needed, spending a fraction of what <b>those</b> who buy every tool brand-new would pay. <u>Instead of fifty families on the same street each buying a cheap drill that breaks after three uses, the community shares five professional-grade drills built to last for years.</u>\n\nEnvironmental economists point out that the resource savings are <b>substantial</b>. Most of a power tool's carbon footprint comes not from the electricity it uses while spinning, but from mining metals, moulding plastics and shipping the box from factory to store—emissions known as 'embodied carbon'. Sharing durable equipment cuts that manufacturing demand directly.\n\nIt would be <b>naive</b>, however, to think a tool library runs itself without careful stewardship. Blades grow dull, batteries lose charge and borrowers occasionally return a muddy garden spade. Successful tool libraries therefore employ part-time mechanics or retired volunteers to inspect every item on return and run short safety clinics so beginners learn to use tools with confidence.", "qs": [{"s": "In paragraph 1, the writer is ______.", "o": ["questioning the honesty of all university researchers", "highlighting how rarely many household tools are used and the waste of every home buying its own", "arguing that modern technology should be completely outlawed", "listing historical dates without any central argument"], "a": 1, "e": "Đoạn 1 tập trung vào việc: 'highlighting how rarely many household tools are used and the waste of every home buying its own'."}, {"s": "The word <b>those</b> in paragraph 2 refers to ______.", "o": ["residents / people", "cupboards", "designers", "factories"], "a": 0, "e": "Trong ngữ cảnh so sánh ở đoạn 2, '<b>those</b>' quy chiếu cho 'residents / people'."}, {"s": "Which of the following best paraphrases the underlined sentence in paragraph 2?", "o": ["Scientists recommend avoiding this activity altogether to save time.", "Researchers found that the two groups showed no difference under any circumstances.", "The underlined process requires no effort and produces the opposite outcome.", "Sharing a few high-quality, durable tools across a neighbourhood replaces the need for every household to buy fragile, low-cost versions."], "a": 3, "e": "Câu gạch chân ở đoạn 2 được d function wRich(str,baseOpt={}){
 const tokRe=/(<\/?[bui]>)/gi;
 const parts=String(str??'').split(tokRe);
 let b=!!baseOpt.b,u=!!baseOpt.u,i=!!baseOpt.i,out='';
 for(const pt of parts){
  const lw=pt.toLowerCase();
  if(lw==='<b>')b=true;
  else if(lw==='</b>')b=!!baseOpt.b;
  else if(lw==='<u>'){u=true;b=true;}
  else if(lw==='</u>'){u=!!baseOpt.u;b=!!baseOpt.b;}
  else if(lw==='<i>')i=true;
  else if(lw==='</i>')i=!!baseOpt.i;
  else if(pt)out+=wR(pt,Object.assign({},baseOpt,{b,u,i}));
 }
 return out;
}

   all.forEach((q,idx)=>{const c=document.querySelector(`input[name=r${q.n}]:checked`);if(c)uAns[idx]=+c.value});
  }
  const code=$('#dm_code').value.trim()||'101';
  const blob=buildDocxBlob(title,secs,{
   org:$('#dm_org').value.trim()||'SỞ GIÁO DỤC VÀ ĐÀO TẠO',
   exam:$('#dm_exam').value.trim()||'KỲ THI TỐT NGHIỆP THPT 2026 – 2027',
   code,
   min:+$('#dm_min').value||25,
   mode:$('#dm_mode').value,
   qlab:$('#dm_qlab').value,
   uAns
  });
  const a=document.createElement('a'),url=URL.createObjectURL(blob);
  a.href=url;a.download=`${slugVi(title)}_MaDe_${slugVi(code)}.docx`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  m.remove();toast('Đã xuất file Word (.docx) thành công!');
 };
}
home();
</script></body></html>
